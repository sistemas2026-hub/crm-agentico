# =============================================================================
#  M06-D -- MATRIZ DE CLASIFICACION DE AUTONOMIA DE LAS 76 HERRAMIENTAS
#  21/09/2026 -- PROPUESTA PARA REVISION. NO SE USA EN RUNTIME.
#  M06-F (22/09/2026): 69 -> 76 con las siete que trajo origin (al final).
# =============================================================================
#
#  Este archivo NO lo lee el motor ni ningun modulo: es un documento de
#  gobierno. La clasificacion efectiva sigue siendo la de siempre
#  (Herramienta.nivel_autonomia vacio en las 69 -> lecturas 0, escrituras 2).
#  Llevarla al runtime es el bloque siguiente, y es una decision aparte.
#
#  La integridad de esta matriz la comprueba tests/test_m06d_matriz_autonomia.py
#  contra el catalogo real (tenants/rapilink.config.yaml) y contra la
#  clasificacion R1-R4 de tests/test_m10a_gobierno_frontera.py.
#
#  CRITERIO (aplicado en orden; el primero que corresponde decide)
#  ----------------------------------------------------------------
#   C1  Lectura (solo_lectura=true)                                  -> 0
#       salvo que su destino no este fijado por el catalogo           -> INDETERMINADA
#   C2  Escritura INTERNA que solo deja un pedido o una propuesta
#       para que una persona decida                                   -> 1
#   C3  Escritura con aprobacion_humana declarada                     -> 3 y la
#       aprobacion SE MANTIENE (mismo tratamiento que R3/R4)
#   C4  Escritura sin aprobacion, segun la EVIDENCIA:
#       a) CRM propio + reversible o inerte (evidenciado) + sin efecto
#          visible al cliente ni recursos comprometidos               -> 2
#       b) sistema del proveedor (WispHub) o compromete recursos, y
#          reversible (evidenciado)                                   -> 3
#       c) irreversibilidad evidenciada                               -> 3 + se
#          recomienda gate de aprobacion (discrepancia)
#       d) reversibilidad o visibilidad al cliente sin evidencia      -> INDETERMINADA
#
#  "Evidencia" = un campo del catalogo, una linea de codigo o un hecho medido
#  que se cita en 'evidencia'. Una afirmacion de diseño sin medir (por
#  ejemplo, que R2 "se deshace con otra operacion") no cuenta sola.
#
#  CLASES: R0 = lectura. R1-R4 como en tests/test_m10a_gobierno_frontera.py.
#  BARRERAS DE TODA ESCRITURA (se abrevian como "cadena autonoma"):
#    kill switch -> techo -> etapa Autonomia 2 (+B-7) -> autorizacion granular
#    -> bitacora -> permiso -> idempotencia -> ultimo metro (frontera.exigir).
#  "cadena critica" = la misma + aprobacion humana atada con sello
#    (frontera.critica, M06-A/C).
# =============================================================================

