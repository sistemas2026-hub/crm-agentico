# =============================================================================
#  PRODUCCION  --  el que despliega Dokploy en el VPS
# =============================================================================
#  Se mantiene aparte de docker-compose.yml (desarrollo) en vez de
#  parametrizar uno solo: dos archivos explicitos se auditan de un vistazo,
#  y un default mal puesto en un archivo unico es lo que conecta la maquina de
#  alguien contra la base real sin que se note.
#
#  DIFERENCIAS CON EL DE DESARROLLO
#  --------------------------------
#  - NO existe el servicio 'db'. La base es el Supabase del mismo servidor.
#    Ademas el compose de desarrollo publica 5432, que en el VPS ya lo ocupa
#    el pooler del Supabase viejo: levantarlo ahi da 'address already in use'.
#  - NADIE publica puertos. Dokploy enruta por dominio con su Traefik, que
#    habla con los contenedores por la red interna. Publicar puertos aqui los
#    expondria a internet sin pasar por TLS.
#  - Sin bind mounts del codigo. En produccion manda la imagen construida, no
#    lo que haya en el disco del servidor.
#  - Las variables NO salen de archivos .env, que no viajan en el repositorio.
#    Se declaran aca y Dokploy las inyecta desde la seccion Environment del
#    servicio. Explicito y auditable: lo que no este listado, no llega.
#
#  SERVIDORES DE PRODUCCION, NO DE DESARROLLO
#  ------------------------------------------
#  - El backend arranca gunicorn y no 'manage.py runserver' (un solo hilo, y
#    Django documenta que no se use fuera de desarrollo). Lo decide ENV_TYPE
#    en docker/backend/entrypoint.sh; gunicorn ya venia en las dependencias.
#    Los estaticos los sirve whitenoise, que ya estaba en MIDDLEWARE.
#  - El frontend usa el destino 'prod' de su Dockerfile: compila con
#    'pnpm build' y sirve con adapter-node, en vez del servidor de Vite.
# =============================================================================

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./django-crm
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # --- Django ---
      SECRET_KEY: ${SECRET_KEY:?definir en Dokploy, no reusar la de dev}
      # False: con DEBUG=True Django muestra la traza completa -incluidas las
      # variables de entorno, o sea las credenciales- en cualquier error.
      DEBUG: "False"
      ENV_TYPE: prod
      # Se le agrega 'backend' al dominio publico, y no es opcional: el
      # frontend llama a Django POR DENTRO de la red, con
      # PRIVATE_DJANGO_API_URL=http://backend:8000, asi que esas peticiones
      # llegan con 'Host: backend:8000'. Si no esta en la lista, Django las
      # rechaza con 400 DisallowedHost -- y el frontend, que solo ve un 400 sin
      # cuerpo, muestra "correo o contraseña incorrectos". Se depura el login
      # durante horas por un problema que no tiene que ver con credenciales.
      # Va aqui y no en la variable de Dokploy porque 'backend' es el nombre
      # del servicio en ESTE archivo: lo sabe el compose, no quien despliega.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?dominio del backend, SIN https://},backend
      DOMAIN_NAME: ${DOMAIN_NAME:?URL publica del backend, CON https://}
      # El navegador carga la interfaz desde el dominio del FRONTEND y de ahi
      # llama al backend: son origenes distintos, asi que sin esto el navegador
      # bloquea cada peticion. Su valor por defecto es http://localhost:5173
      # (settings.py), o sea que si no se define, en el servidor no funciona
      # nada -- y el error de CORS que se ve en consola no menciona la causa.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?URL del frontend, CON https://}
      # Para el admin de Django y cualquier formulario: sobre HTTPS exige que
      # el origen este declarado o rechaza el POST con 403.
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?ambos dominios, CON https://}
      # De aqui sale CADA enlace que el sistema manda por correo: el de
      # inicio de sesion por magic link, el portal de facturas del cliente y
      # la encuesta. Con el valor por defecto (localhost:5173) el sistema
      # arranca bien y le manda a los clientes enlaces a su propia maquina,
      # sin que nada falle visiblemente. settings.py aborta el arranque antes
      # que permitirlo, y hace bien.
      FRONTEND_URL: ${FRONTEND_URL:?URL publica del frontend, CON https://}
      # Traefik es el unico ingreso -este compose no publica ningun puerto- y
      # reescribe X-Forwarded-Proto, que son las dos condiciones que settings.py
      # exige para confiar en esa cabecera. Sin esto, Django cree que las
      # peticiones son HTTP y las cookies marcadas Secure no viajan.
      TRUST_PROXY_SSL_HEADER: "True"
      # --- Base: el Supabase de este mismo servidor ---
      DBHOST: ${DBHOST:?}
      DBPORT: ${DBPORT:?}
      DBNAME: ${DBNAME:?}
      DBUSER: ${DBUSER:?}
      DBPASSWORD: ${DBPASSWORD:?}
      # --- Celery ---
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # --- Correo ---
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@rapilinksas.co}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      CORS_ALLOW_ALL: "False"
    depends_on:
      redis:
        condition: service_healthy
    command: /bin/bash /entrypoint.sh
    volumes:
      - ./django-crm/docker/backend/entrypoint.sh:/entrypoint.sh:ro
      # Adjuntos y archivos subidos. Van al disco porque este despliegue no usa
      # S3; sin el volumen, cada redespliegue se los lleva.
      - media:/app/media

  celery-worker:
    build:
      context: ./django-crm
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?}
      DEBUG: "False"
      # Sin esto corren en modo 'dev' (settings.py usa "dev" por defecto) y no
      # cargan server_settings: misma imagen, configuracion distinta a la del
      # backend, y las diferencias aparecen en produccion.
      ENV_TYPE: prod
      # De aqui sale CADA enlace que el sistema manda por correo: el de
      # inicio de sesion por magic link, el portal de facturas del cliente y
      # la encuesta. Con el valor por defecto (localhost:5173) el sistema
      # arranca bien y le manda a los clientes enlaces a su propia maquina,
      # sin que nada falle visiblemente. settings.py aborta el arranque antes
      # que permitirlo, y hace bien.
      FRONTEND_URL: ${FRONTEND_URL:?URL publica del frontend, CON https://}
      # Traefik es el unico ingreso -este compose no publica ningun puerto- y
      # reescribe X-Forwarded-Proto, que son las dos condiciones que settings.py
      # exige para confiar en esa cabecera. Sin esto, Django cree que las
      # peticiones son HTTP y las cookies marcadas Secure no viajan.
      TRUST_PROXY_SSL_HEADER: "True"
      DBHOST: ${DBHOST:?}
      DBPORT: ${DBPORT:?}
      DBNAME: ${DBNAME:?}
      DBUSER: ${DBUSER:?}
      DBPASSWORD: ${DBPASSWORD:?}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A crm worker --loglevel=info
    volumes:
      - media:/app/media

  celery-beat:
    build:
      context: ./django-crm
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?}
      DEBUG: "False"
      # Sin esto corren en modo 'dev' (settings.py usa "dev" por defecto) y no
      # cargan server_settings: misma imagen, configuracion distinta a la del
      # backend, y las diferencias aparecen en produccion.
      ENV_TYPE: prod
      # De aqui sale CADA enlace que el sistema manda por correo: el de
      # inicio de sesion por magic link, el portal de facturas del cliente y
      # la encuesta. Con el valor por defecto (localhost:5173) el sistema
      # arranca bien y le manda a los clientes enlaces a su propia maquina,
      # sin que nada falle visiblemente. settings.py aborta el arranque antes
      # que permitirlo, y hace bien.
      FRONTEND_URL: ${FRONTEND_URL:?URL publica del frontend, CON https://}
      # Traefik es el unico ingreso -este compose no publica ningun puerto- y
      # reescribe X-Forwarded-Proto, que son las dos condiciones que settings.py
      # exige para confiar en esa cabecera. Sin esto, Django cree que las
      # peticiones son HTTP y las cookies marcadas Secure no viajan.
      TRUST_PROXY_SSL_HEADER: "True"
      DBHOST: ${DBHOST:?}
      DBPORT: ${DBPORT:?}
      DBNAME: ${DBNAME:?}
      DBUSER: ${DBUSER:?}
      DBPASSWORD: ${DBPASSWORD:?}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A crm beat --loglevel=info
    volumes:
      - media:/app/media

  frontend:
    build:
      context: ./django-crm/frontend
      dockerfile: Dockerfile
      # Compila con 'pnpm build' y sirve el resultado con adapter-node, en vez
      # del servidor de desarrollo. Escucha en el puerto 3000.
      target: prod
    restart: unless-stopped
    environment:
      # PUBLIC_ lo usa el NAVEGADOR: tiene que ser el dominio publico del
      # backend, no un nombre de la red interna que el navegador no resuelve.
      PUBLIC_DJANGO_API_URL: ${PUBLIC_DJANGO_API_URL:?dominio publico del backend}
      # PRIVATE_ lo usa el codigo que corre DENTRO del contenedor: ahi si vale
      # el nombre del servicio.
      PRIVATE_DJANGO_API_URL: http://backend:8000
    depends_on:
      - backend

  # Solo embeddings (bge-m3). El LLM va a la API de DeepSeek: los cinco roles
  # estan redirigidos en tenants/rapilink.config.yaml.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Sin esto el modelo se descarga de memoria tras 5 minutos ocioso y la
      # primera consulta despues de una pausa paga la recarga (RNF-04).
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  motor:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Conexion: las mismas cinco que el CRM. nucleo/persistencia/conexion.py
      # compone la cadena con ellas.
      DBHOST: ${DBHOST:?}
      DBPORT: ${DBPORT:?}
      DBNAME: ${DBNAME:?}
      DBUSER: ${DBUSER:?}
      DBPASSWORD: ${DBPASSWORD:?}
      OLLAMA_HOST: http://ollama:11434
      WISPHUB_API_KEY: ${WISPHUB_API_KEY:?}
      WISPHUB_BASE_URL: ${WISPHUB_BASE_URL:-https://api.wisphub.io}
      WISPHUB_MODO_REAL: ${WISPHUB_MODO_REAL:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?}
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  # Archivos subidos por los usuarios. Sin S3, viven en disco.
  media:
  # Los modelos descargados. Sin esto, cada redespliegue vuelve a bajar 1.2 GB
  # y la primera consulta espera a que termine.
  ollama_models:
