id: smartolt
nombre: Smartolt
descripcion: Herramientas verificadas contra smartolt.
extraido_de: rapilink
variables:
- nombre: SMARTOLT_BASE_URL
  etiqueta: URL base de la API
  ejemplo: https://smartolt
secretos:
- nombre: SMARTOLT_API_KEY
  etiqueta: Credencial de Smartolt
areas:
  soporte:
    descripcion: Atiende a un colaborador interno (nunca al cliente directo), revisa
    orientado_a: colaborador
  soporte_tecnico_cliente:
    descripcion: El suscriptor, ya derivado desde el agente general porque su consulta
    orientado_a: cliente_final
herramientas:
- nombre: consultar_estado_ont
  tipo: http
  descripcion: 'Estado de la ONU del cliente en la OLT (Online/Offline) y hace cuanto cambio. PRIMER paso
    del diagnostico de SmartOLT -- liviano (sin PII, sin latencia relevante). Si da Offline sin que consultar_senal_ont
    alcance para explicar por que, y hace falta distinguir sin energia de falla optica, ese es un diagnostico
    mas profundo que todavia no esta disponible como herramienta -- en ese caso sigue el protocolo de
    preguntar por las luces del equipo.

    '
  solo_lectura: true
  endpoint: /api/onu/get_onu_status/{sn_onu}
  metodo: GET
  auth_ref: SMARTOLT_API_KEY
  auth_esquema: ''
  auth_header: X-Token
  inyectar_sesion:
    sn_onu: sn_onu
  inyectados_obligatorios:
  - sn_onu
  reintentar_identificador_como:
    sn_onu: gpon_hex
  base_url_ref: SMARTOLT_BASE_URL
  areas:
  - soporte
  - soporte_tecnico_cliente
  campos_por_area:
    soporte:
    - onu_status
    - last_status_change
    soporte_tecnico_cliente:
    - onu_status
- nombre: consultar_senal_ont
  tipo: http
  descripcion: 'Nivel de senal optica de la ONU del cliente. SEGUNDO paso del diagnostico de SmartOLT,
    junto con consultar_estado_ont -- llama a las dos juntas para un diagnostico completo. El veredicto
    (onu_signal_1490_veredicto) ya viene calculado contra los umbrales de G-GO-04, no lo calcules tu:
    ''aceptable'' es -8 a -25 dBm, fuera de ese rango es un problema real de senal.

    '
  solo_lectura: true
  endpoint: /api/onu/get_onu_signal/{sn_onu}
  metodo: GET
  auth_ref: SMARTOLT_API_KEY
  auth_esquema: ''
  auth_header: X-Token
  inyectar_sesion:
    sn_onu: sn_onu
  inyectados_obligatorios:
  - sn_onu
  reintentar_identificador_como:
    sn_onu: gpon_hex
  veredictos:
    onu_signal_1490:
    - desde: -25.0
      hasta: -8.0
      etiqueta: aceptable
    - desde: null
      hasta: -25.0001
      etiqueta: 'fuera de rango -- senal debil: problema en el drop (conector, cable o tensores)'
    - desde: -7.9999
      hasta: null
      etiqueta: 'fuera de rango -- senal muy fuerte: revisar con un tecnico'
  base_url_ref: SMARTOLT_BASE_URL
  areas:
  - soporte
  - soporte_tecnico_cliente
  campos_por_area:
    soporte:
    - onu_signal
    - onu_signal_1310
    - onu_signal_1490
    - onu_signal_1490_veredicto
    soporte_tecnico_cliente:
    - onu_signal
    - onu_signal_1490_veredicto
- nombre: consultar_velocidad_aprovisionada
  tipo: http
  descripcion: 'A que velocidad esta REALMENTE configurado el equipo del cliente en la red, que no es
    lo mismo que el plan que contrato. Devuelve el perfil de bajada y el de subida; el nombre del perfil
    ES la velocidad (PLAN_100MB = 100 megas de bajada).

    USALA en cualquier reporte de internet lento, ANTES de pedirle al cliente que corra una prueba de
    velocidad: si el equipo quedo configurado por debajo de su plan, esa es la causa y ya la tienes --
    hacerlo medir no agrega nada y lo hace trabajar al pepe.

    LA SUBIDA ES NORMALMENTE LA MITAD DE LA BAJADA en esta red (medido sobre 22 clientes reales el 21/08/2026:
    PLAN_100MB/PLAN_50MB, PLAN_200MB_SV/PLAN_100MB). Un par asimetrico asi NO es una falla, no lo reportes
    como problema.

    Lo que SI es un hallazgo: que el perfil de bajada no corresponda al plan contratado, o que no haya
    ningun perfil asignado. En los dos casos, el cliente no puede alcanzar su velocidad por mas pruebas
    que haga, y eso se resuelve del lado nuestro, no en su casa.

    '
  solo_lectura: true
  endpoint: /api/onu/get_onu_speed_profiles/{sn_onu}
  metodo: GET
  auth_ref: SMARTOLT_API_KEY
  auth_esquema: ''
  auth_header: X-Token
  inyectar_sesion:
    sn_onu: sn_onu
  inyectados_obligatorios:
  - sn_onu
  reintentar_identificador_como:
    sn_onu: gpon_hex
  base_url_ref: SMARTOLT_BASE_URL
  areas:
  - soporte
  - soporte_tecnico_cliente
  campos_por_area:
    soporte:
    - download_speed_profile_name
    - upload_speed_profile_name
    soporte_tecnico_cliente:
    - download_speed_profile_name
    - upload_speed_profile_name
- nombre: consultar_incidente_red
  tipo: interno
  detecta_incidente: true
  descripcion: 'Correlaciona la ONU de ESTE cliente contra los incidentes activos de su OLT en SmartOLT
    -- resuelve si su falla es un caso aislado o parte de una caida que afecta a mas gente (mismo splitter/PON).
    El veredicto (''es_incidente_de_red'', cuantos clientes, desde cuando) ya viene calculado, no lo recalcules
    ni lo cuestiones. IMPORTANTE: SmartOLT tarda 2 a 5 minutos en agrupar una caida recien empezada (dato
    del proveedor) -- ''es_incidente_de_red: false'' en un reporte muy reciente significa "todavia no
    hay nada agrupado", no "confirmado que es solo suyo". Comunicaselo asi al colaborador, no lo simplifiques
    a un si/no tajante cuando el reporte tiene pocos minutos.

    VIENEN DOS NUMEROS Y NO MIDEN LO MISMO. ''clientes_afectados'' es lo que agrupa SmartOLT con su propio
    criterio. ''clientes_caidos_a_la_vez'' es evidencia cruda: cuantos equipos del mismo puerto se cayeron
    en el mismo momento que el de este cliente, contado sobre los tiempos reales. Para hablarle al cliente
    usa el SEGUNDO, y lo mismo con ''desde_por_tiempos'' en vez de ''desde'' -- en la caida del 21/08/2026
    SmartOLT declaraba 8 afectados desde las 12:16 cuando los tiempos mostraban 7 caidos juntos desde
    las 07:16, cinco horas antes.

    Por que importa: un puerto acumula equipos apagados hace meses (clientes que se fueron y nadie dio
    de baja). Contarlos como afectados hincha el numero y lo vuelve inutil -- en ese mismo puerto habia
    17 caidos, y 10 llevaban entre mes y medio y ocho meses. Los que importan son los que se cayeron JUNTOS.

    '
  solo_lectura: true
  auth_ref: SMARTOLT_API_KEY
  auth_esquema: ''
  auth_header: X-Token
  inyectar_sesion:
    sn_onu: sn_onu
  inyectados_obligatorios:
  - sn_onu
  reintentar_identificador_como:
    sn_onu: gpon_hex
  base_url_ref: SMARTOLT_BASE_URL
  areas:
  - soporte
  - soporte_tecnico_cliente
  campos_por_area:
    soporte:
    - es_incidente_de_red
    - tipo_alerta
    - clientes_afectados
    - porcentaje_afectado
    - desde
    - zona
    - caja
    - motivo
    - clientes_caidos_a_la_vez
    - desde_por_tiempos
    soporte_tecnico_cliente:
    - es_incidente_de_red
    - desde_por_tiempos
    - motivo
- nombre: consultar_estabilidad_enlace
  tipo: interno
  resume_estabilidad: true
  descripcion: 'Cuantas veces se cayo y volvio el enlace de ESTE cliente en las ultimas 24 horas, y por
    que. El veredicto (''enlace_inestable'', cuantas caidas, cual fue la causa dominante) ya viene calculado:
    no lo recalcules ni lo cuestiones.

    USALA cuando el cliente diga que le anda MAL A RATOS -- "a veces bien y a veces no", "se cae y vuelve",
    "en las noches se pone lento". Ese es el caso que ninguna otra herramienta puede ver: todas miden
    AHORA, y ahora suele estar andando bien. Un equipo que responde ''Online'' con señal ''Very good''
    puede haberse caido nueve veces en el dia, y esto es lo unico que lo muestra.

    NO reemplaza a diagnosticar_falla_ont: esa dice por que se cayo LA ULTIMA vez, y esa ultima causa
    puede tapar el patron. Visto el 21/08/2026 en la ONU de prueba: la ultima causa era un simple ''re-register''
    mientras el historial del mismo dia tenia ocho alarmas de perdida optica.

    Si da ''enlace_inestable'', ya tienes evidencia suficiente: no le hagas hacer pruebas de velocidad
    para confirmar algo que la red ya conto.

    '
  solo_lectura: true
  auth_ref: SMARTOLT_API_KEY
  auth_esquema: ''
  auth_header: X-Token
  inyectar_sesion:
    sn_onu: sn_onu
  inyectados_obligatorios:
  - sn_onu
  reintentar_identificador_como:
    sn_onu: gpon_hex
  base_url_ref: SMARTOLT_BASE_URL
  areas:
  - soporte
  - soporte_tecnico_cliente
  campos_por_area:
    soporte:
    - enlace_inestable
    - caidas_en_ventana
    - ventana_horas
    - causa_dominante
    - veces_la_causa_dominante
    - ultima_caida
    - motivo
    soporte_tecnico_cliente:
    - enlace_inestable
    - caidas_en_ventana
    - ventana_horas
    - causa_dominante
    - veces_la_causa_dominante
