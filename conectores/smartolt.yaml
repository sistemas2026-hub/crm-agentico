- nombre: activar_catv
  tipo: http
  descripcion: 'Enciende el servicio de television en el equipo del cliente. Se usa en UN solo caso: consultar_estado_catv
    dio ''Disabled'' y su plan SI incluye TV. Ahi la television esta apagada en el equipo por error, y
    encenderla resuelve el caso entero sin visita ni tecnico.

    NO la llames en ningun otro caso. Si el plan no incluye TV, el servicio esta apagado A PROPOSITO y
    encenderlo seria darle algo que no contrato -- medido: de cada dos clientes con la TV apagada, uno
    la tiene apagada con razon. El motor ademas lo rechaza solo si falta alguna de las dos condiciones,
    asi que no lo intentes "por si acaso": sigue el protocolo normal.

    Despues de encenderla, dile al cliente que ya quedo activada y preguntale si le volvio la señal. Si
    todavia no la ve, el equipo necesita volver a buscar los canales: pedile los pasos a
    consultar_guia_sintonizacion -- son distintos segun la marca del televisor y segun use TDT, y por
    eso no van escritos aca.

    Maximo UNA vez por conversacion.

    '
  solo_lectura: false
  requiere_confirmacion: true
  endpoint: /api/onu/enable_catv/{sn_onu}
  metodo: POST
  auth_ref: SMARTOLT_API_KEY
