- nombre: consultar_dispositivos_conectados
  tipo: http
  descripcion: "Los equipos que estan conectados AHORA al router del cliente, via TR-069. Es lo unico\
    \ que deja ver del lado de adentro de la casa: hasta aca el diagnostico llega a la ONT y despues hay\
    \ que preguntar.\nCuando el cliente dice que no tiene internet pero la ONT responde y la señal esta\
    \ bien, esto separa los tres casos que antes se distinguian preguntando:\n- Varios equipos activos,\
    \ de WiFi Y de cable: el servicio llega. Falla\n  UN dispositivo puntual, no la conexion.\n- Solo\
    \ equipos de cable activos ('InterfaceType' Ethernet) y ninguno de\n  WiFi ('802.11'): el problema\
    \ es el WiFi -- banda, clave o alcance.\n- Lista vacia con la ONT en linea: no hay NADA conectado.\
    \ O el router\n  del cliente esta apagado, o el WiFi entero se cayo.\n\n'HostName' trae el nombre\
    \ real del equipo (\"DESKTOP-C8V2688\", el celular de alguien). Sirve para hablarle concreto -- \"\
    veo tu computador conectado pero ningun celular\" -- en vez de interrogarlo.\nOJO CON EL ERROR: si\
    \ responde 'The ONU is not responding to TR-069 ACS requests', eso NO es \"no hay equipos conectados\"\
    , es \"no pude mirar\". Medido el 19/08/2026: de 5 ONUs con TR-069 habilitado, 2 contestaron con datos,\
    \ 1 con lista vacia y 2 fallaron asi. Tratar un fallo como lista vacia le diria a alguien que no tiene\
    \ nada conectado cuando en realidad no se pudo ver.\nNo la llames si la ONT esta caida o la señal\
    \ esta fuera de rango: el problema esta antes y los equipos de adentro no importan todavia.\n"
  solo_lectura: true
  endpoint: /api/onu/get_onu_router_hosts/{sn_onu}
