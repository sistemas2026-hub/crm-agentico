- nombre: reiniciar_ont
  tipo: http
  descripcion: 'LLAMA A ESTA HERRAMIENTA (no sugieras el reinicio manual del router, no escales) apenas
    consultar_senal_ont haya dado ''aceptable'' Y ping_cliente haya respondido bien, en un cliente que
    dice no tener internet -- ese es exactamente el caso para el que existe esta herramienta, y usar el
    reinicio manual en su lugar le hace perder tiempo al cliente para lograr lo mismo que esto hace en
    un paso. Reinicia la ONT del cliente. Contrato del proveedor (documentado, agosto 2026): comando fire-and-forget
    -- confirma que SE MANDO, no que la ONT ya reinicio ni que el problema se resolvio. Dile al cliente
    que el equipo va a estar sin conexion **uno o dos minutos** (medido en vivo, 14/08/2026: volvio a
    responder en ~73 segundos) y que revise si volvio la señal despues de ese tiempo.

    SIN paso de aprobacion humana -- el codigo exige en su lugar que ya hayas corrido consultar_senal_ont
    y ping_cliente EN ESTA conversacion y que los dos hayan dado resultado favorable (senal aceptable,
    ping exitoso). Si no se cumple, la herramienta se rechaza sola con el motivo -- no lo intentes "igual",
    sigue el protocolo alternativo. Es exactamente la logica del equipo electronico que a veces necesita
    reinicio PERO solo tiene sentido si ya se descarto que el problema es de red: si la senal esta mal,
    reiniciar no arregla nada y solo retrasa mandar un tecnico.

    Maximo UNA vez por conversacion -- si el cliente insiste en que lo reinicies de nuevo, no lo repitas:
    dile que un colaborador humano sigue el caso.

    '
  solo_lectura: false
  requiere_confirmacion: true
  exige_turno_propio: true
  endpoint: /api/onu/reboot/{sn_onu}
  metodo: POST
  auth_ref: SMARTOLT_API_KEY
  auth_esquema: ''
  auth_header: X-Token
  inyectar_sesion:
    sn_onu: sn_onu
  inyectados_obligatorios:
  - sn_onu
  reintentar_identificador_como:
    sn_onu: gpon_hex
  exige_previas:
  - herramienta: consultar_senal_ont
    campo: onu_signal_1490_veredicto
    valor: aceptable
  - herramienta: ping_cliente
    campo: ping-exitoso
    valores:
    - 1 de 3
    - 2 de 3
    - 3 de 3
  limite_por_conversacion: 1
  verificacion:
    espera_segundos: 120
    max_intentos: 3
    escalar_si_no_confirma: accion_sin_efecto
    comprobaciones:
    - herramienta: consultar_estado_ont
      campo: last_status_change
      regla: cambio
    - herramienta: ping_cliente
      campo: ping-exitoso
      regla: valores
      valores:
      - 1 de 3
      - 2 de 3
      - 3 de 3
  escalar_si_falla: sin_datos_para_diagnosticar
  sugerir_cuando_disponible: 'El diagnostico (señal + ping) dio favorable, asi que reiniciar la ONT es
    el siguiente paso -- no el reinicio manual del router, no escalar a un humano.

    LLAMA LA HERRAMIENTA reiniciar_ont AHORA, en este mismo paso. No anuncies que la vas a usar ni le
    prometas al cliente que vas a reiniciar: si no la llamas, el reinicio NO ocurre y le habrias mentido.
    Primero ejecutala, y recien despues cuentale al cliente que ya la reiniciaste y que espere uno o dos
    minutos.

    Unica excepcion: si el cliente ya te dijo en este intercambio que no quiere que la reinicies.

    '
  base_url_ref: SMARTOLT_BASE_URL
  areas:
  - soporte
  - soporte_tecnico_cliente
  campos_por_area:
    soporte:
    - status
    - response
    soporte_tecnico_cliente:
    - response
- nombre: diagnosticar_falla_ont
  tipo: http
  descripcion: 'Diagnostico PROFUNDO de por que la ONU esta offline. Distingue el corte de energia CONFIRMADO
    (el equipo alcanzo a avisar) de una caida sin aviso -- que puede ser la fibra, pero tambien un equipo
    apagado o desenchufado de golpe: esos dos se ven identicos desde la OLT y solo los separa preguntarle
    al cliente. SOLO llama a esta herramienta como SEGUNDO paso, y solo cuando consultar_estado_ont ya
    dio Offline y consultar_senal_ont no alcanzo para explicar por que (offline no tiene lectura de senal
    util) -- nunca la llames primero ni la llames si el equipo esta Online, ahi no aporta nada mas que
    las dos herramientas livianas. Tarda ~10 segundos (mucho mas que las otras herramientas de SmartOLT)
    -- es el costo de tener la causa real en vez de adivinar, dile al cliente que estas revisando algo
    mas a fondo si la conversacion se alarga.

    ''ONU details.Last down cause_interpretado'' ya viene calculado: no interpretes tu el texto crudo
    en ingles (''dying-gasp'', ''ONT LOSi/LOBi alarm''), usa la version interpretada. Si no viene el campo
    ''_interpretado'' es porque la causa no esta en el mapeo conocido -- en ese caso no inventes que significa,
    di que no se pudo determinar la causa exacta y seguí con el protocolo (luces del equipo, o escalar).

    '
  solo_lectura: true
  endpoint: /api/onu/get_onu_full_status_info/{sn_onu}
  metodo: GET
  auth_ref: SMARTOLT_API_KEY
  auth_esquema: ''
  auth_header: X-Token
  extraer_de: full_status_json
  inyectar_sesion:
    sn_onu: sn_onu
  inyectados_obligatorios:
  - sn_onu
  reintentar_identificador_como:
    sn_onu: gpon_hex
  mapeos:
    ONU details.Last down cause:
      dying-gasp: sin energia electrica en el domicilio (corte de luz o el equipo se desenchufo)
      ONT LOSi/LOBi alarm: 'sin señal optica: puede ser la fibra (cortada o falla en la caja NAP) O el
        equipo apagado/desenchufado -- desde la OLT los dos se ven identicos, hay que preguntarle al cliente
        por la corriente para distinguirlos'
      ONT LOFi alarm: 'sin señal optica: puede ser la fibra (cortada o falla en la caja NAP) O el equipo
        apagado/desenchufado -- desde la OLT los dos se ven identicos, hay que preguntarle al cliente
        por la corriente para distinguirlos'
      re-register: 'el equipo se volvio a registrar en la red hace poco (reconexion reciente). Esto NO
        dice por que se cayo antes: si el cliente sigue sin servicio, hay que tratarlo como una caida
        sin causa confirmada'
      ONU is currently online: el equipo esta en linea, no hay una caida que explicar
  base_url_ref: SMARTOLT_BASE_URL
  areas:
  - soporte
  - soporte_tecnico_cliente
  campos_por_area:
    soporte:
    - ONU details.Last down cause
    - ONU details.Last down cause_interpretado
    - ONU details.Run state
    - ONU details.Last down time
    - Optical status.Rx optical power(dBm)
    soporte_tecnico_cliente:
    - ONU details.Last down cause_interpretado
    - ONU WAN Interfaces.MAC address
- nombre: cambiar_tipo_onu
  tipo: http
  multipart: true
  descripcion: 'Corrige el TIPO con que la ONU quedo registrada en SmartOLT, para que exponga el puerto
    de television. No cambia nada fisico en la casa del cliente: cambia como esta clasificado su equipo.

    SOLO se usa cuando consultar_estado_catv devolvio ''Not supported by ONU-Type'' Y el cliente confirmo
    que tiene UN SOLO equipo. Si tiene dos, su television va por un decodificador aparte y el puerto de
    la ONU no interviene -- cambiar el tipo ahi no arregla nada.

    Despues de llamarla, vuelve a leer consultar_estado_catv: tiene que dejar de decir ''Not supported''.
    Recien entonces activar_catv.

    '
  solo_lectura: false
  requiere_confirmacion: true
  exige_turno_propio: true
  limite_por_conversacion: 1
  exige_previas:
  - herramienta: consultar_estado_catv
    campo: catv
    contiene: Not supported
  endpoint: /api/onu/change_onu_type/{sn_onu}
  metodo: POST
  auth_ref: SMARTOLT_API_KEY
  auth_esquema: ''
  auth_header: X-Token
  inyectar_sesion:
    sn_onu: sn_onu
  inyectados_obligatorios:
  - sn_onu
  argumentos_fijos:
    onu_type: CDATA-CATV
  base_url_ref: SMARTOLT_BASE_URL
  areas:
  - soporte
  - soporte_tecnico_cliente
