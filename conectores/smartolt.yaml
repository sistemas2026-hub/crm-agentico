- nombre: consultar_estado_catv
  tipo: http
  descripcion: "Si el servicio de TV esta habilitado en el equipo del cliente, segun la OLT. Para una\
    \ falla de TV es el UNICO dato duro que tenemos de nuestro lado -- todo lo demas del protocolo (cableado,\
    \ entrada, sintonizacion) depende de lo que el cliente reporte.\nLLAMA A ESTA HERRAMIENTA APENAS el\
    \ cliente reporta una falla de TV y ya confirmaste que su plan la incluye, ANTES de arrancar con la\
    \ lista de preguntas. El manual (5.9) pide verificar en SmartOLT como PARTE del procedimiento, no\
    \ despues de agotar al cliente.\nComo leer 'catv': - 'Enabled'  = el servicio esta habilitado en el\
    \ equipo. De nuestro\n               lado sale bien, asi que el problema esta del lado del\n     \
    \          cliente: sigue el protocolo (cableado, entrada del TV,\n               sintonizacion).\n\
    - 'Disabled' = el servicio de TV esta APAGADO en el equipo. ESO es la\n               falla, ya la\
    \ encontraste, y la resuelves tu: llama a\n               activar_catv. No derives a un humano por\
    \ esto ni le\n               pidas que sintonice antes de encenderlo.\n- 'Not supported by ONU-Type'\
    \ = el modelo de equipo que tiene no\n               soporta television. No es algo que el cliente\
    \ pueda\n               resolver ni que se arregle sintonizando: pasa el caso a\n               un\
    \ colaborador humano, porque si su plan incluye TV hay\n               que cambiarle el equipo.\n"
  solo_lectura: true
  escalar_si_falla: sin_datos_para_diagnosticar
