id: wisphub
nombre: Wisphub
descripcion: Herramientas verificadas contra api.wisphub.io.
extraido_de: rapilink
variables:
- nombre: WISPHUB_BASE_URL
  etiqueta: URL base de la API
  ejemplo: https://api.wisphub.io
secretos:
- nombre: WISPHUB_API_KEY
  etiqueta: Credencial de Wisphub
areas:
  soporte:
    descripcion: Atiende a un colaborador interno (nunca al cliente directo), revisa
    orientado_a: colaborador
  facturacion:
    descripcion: Revisa facturas, saldos y registra pagos.
    orientado_a: colaborador
  administracion:
    descripcion: Consultas consolidadas, sin datos personales.
    orientado_a: colaborador
  facturacion_cliente:
    descripcion: El suscriptor, ya derivado desde el agente general porque su consulta
    orientado_a: cliente_final
  soporte_tecnico_cliente:
    descripcion: El suscriptor, ya derivado desde el agente general porque su consulta
    orientado_a: cliente_final
  ventas:
    descripcion: Un prospecto por WhatsApp -- TODAVIA NO es cliente de Rapilink. Nunca
    orientado_a: cliente_final
herramientas:
- nombre: consultar_cliente
  tipo: http
  descripcion: Datos de un cliente por su ID de servicio.
  solo_lectura: true
  endpoint: /api/clientes/
  metodo: GET
  auth_ref: WISPHUB_API_KEY
  auth_esquema: Api-Key
  filtros_verificados:
    id_servicio:
      param: id_servicio
      tipo: id
      verificado_el: 2026-08-12
  base_url_ref: WISPHUB_BASE_URL
  areas:
