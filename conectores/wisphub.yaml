- nombre: contar_clientes
  tipo: agregado
  entidad: clientes
  etiqueta: clientes
  descripcion: 'Cuenta clientes por estado, plan, ciudad, localidad, router o tecnico (o el total sin
    filtro). El resultado ya viene calculado -- nunca sumes ni corrijas el numero que te llega.

    Si el colaborador pide explicitamente un archivo o reporte descargable ("mandame un excel", "quiero
    el reporte de morosos", "pasamelo en pdf"), pasa formato=''excel'' o formato=''pdf'' segun lo que
    haya pedido (si no aclaro el tipo de archivo, usa ''excel''): se genera un archivo real y queda adjunto
    a tu respuesta automaticamente, el colaborador lo ve en la misma conversacion. El resultado te trae
    ''archivo_id'' -- es un identificador TECNICO, NUNCA lo escribas ni lo menciones en tu respuesta (no
    significa nada para una persona). Solo confirma que ya generaste el archivo, por ejemplo "Listo, te
    dejo el Excel con el detalle". Si solo pregunta un numero ("cuantos clientes activos hay"), no uses
    formato o dejalo en ''texto'' -- redacta la respuesta como siempre, sin mencionar ningun archivo.

    Si el resultado trae ''error_archivo'', el archivo NO se genero -- decile al colaborador que el reporte
    no se pudo generar en este momento, nunca afirmes que si se genero.

    '
  solo_lectura: true
  exportable: true
  sincroniza_localidades: true
  endpoint: /api/clientes/
  auth_ref: WISPHUB_API_KEY
  auth_esquema: Api-Key
  filtros_verificados:
    estado:
      param: estado
      tipo: enum
      valores:
        activo: 1
        suspendido: 2
        cancelado: 3
        gratis: 4
      verificado_el: 2026-07-29
    plan_internet:
      param: plan_internet
      tipo: id
      verificado_el: 2026-07-29
    ciudad:
      param: ciudad
      tipo: texto
      verificado_el: 2026-07-29
    localidad:
      param: localidad
      tipo: texto
      verificado_el: 2026-07-29
    router:
