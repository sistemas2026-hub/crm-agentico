- nombre: consultar_mi_servicio
  tipo: http
  descripcion: 'Estado del servicio del cliente autenticado. El id_cliente NO viaja como argumento del
    modelo: lo inyecta el codigo desde la sesion. Si viniera del modelo, una inyeccion de prompt bastaria
    para pedir el de otro.

    '
  solo_lectura: true
  endpoint: /api/clientes/
  metodo: GET
  auth_ref: WISPHUB_API_KEY
  auth_esquema: Api-Key
  inyectar_sesion:
    id_servicio: id_cliente
  inyectados_obligatorios:
  - id_servicio
  base_url_ref: WISPHUB_BASE_URL
  areas:
  - facturacion_cliente
  - soporte_tecnico_cliente
  campos_por_area:
    facturacion_cliente:
    - estado
    - estado_facturas
    - saldo
    - fecha_corte
    - plan_internet
    soporte_tecnico_cliente:
    - estado
    - plan_internet
    - ssid_router_wifi
- nombre: consultar_plan_tv
  tipo: http
  descripcion: 'Confirma si un plan de internet incluye TV, leyendo su descripcion real -- el NOMBRE del
    plan casi nunca lo dice (''PLAN HOGAR'', ''PLAN ELITE'', etc. pueden incluir TV igual, verificado
    en vivo agosto 2026). Pasale ''id_plan'', el id que ya viste en plan_internet.id al llamar a consultar_mi_servicio.

    '
  solo_lectura: true
  endpoint: /api/plan-internet/queue/{id_plan}/
  metodo: GET
  auth_ref: WISPHUB_API_KEY
  auth_esquema: Api-Key
  filtros_verificados:
    id_plan:
      param: id_plan
      tipo: id
      verificado_el: 2026-08-14
  cache: true
  base_url_ref: WISPHUB_BASE_URL
  areas:
  - soporte_tecnico_cliente
  campos_por_area:
    soporte_tecnico_cliente:
    - descripcion
- nombre: consultar_planes
  tipo: http
  descripcion: 'Catalogo TECNICO completo de WispHub (nombre e ID) -- trae variantes duplicadas y nombres
    legacy pensados para facturar clientes existentes, NO una lista de venta (para eso esta consultar_planes_venta,
    que hay que llamar primero). Usala solo para resolver el ID de un plan YA CONFIRMADO por consultar_planes_venta,
    antes de pedir su precio con consultar_plan_detalle -- nunca inventes un nombre de plan que no aparezca
    aca.

    '
  solo_lectura: true
  cache: true
  cache_vigencia_dias: 7
  endpoint: /api/plan-internet/
  metodo: GET
  auth_ref: WISPHUB_API_KEY
  auth_esquema: Api-Key
  base_url_ref: WISPHUB_BASE_URL
  areas:
  - ventas
  campos_por_area:
    ventas:
    - id
    - nombre
- nombre: consultar_plan_detalle
  tipo: http
  descripcion: 'Precio y velocidad reales de UN plan, por su ID (resolvelo primero con consultar_planes).
    Verificado en vivo (19/08/2026): el precio NO viene en el listado de consultar_planes, solo aca.

    '
  solo_lectura: true
  cache: true
  endpoint: /api/plan-internet/queue/{id_plan}/
  metodo: GET
  auth_ref: WISPHUB_API_KEY
  auth_esquema: Api-Key
  requeridos:
  - id_plan
  filtros_verificados:
    id_plan:
      param: id_plan
      tipo: id
      verificado_el: 2026-08-19
  base_url_ref: WISPHUB_BASE_URL
  areas:
  - ventas
  campos_por_area:
    ventas:
    - nombre
    - precio
    - bajada
    - subida
    - descripcion
- nombre: verificar_identidad_por_cedula
  tipo: http
  descripcion: 'Primer paso de la verificacion (no el unico -- ver confirmar_identidad) por numero de
    cedula, cuando el numero de WhatsApp no alcanzo para verificarlo solo. Filtro verificado contra la
    API real (metodo del valor imposible, agosto 2026 -- ver .claude/skills/wisphub-api/SKILL.md). NUNCA
    devuelve datos del cliente: solo el nombre a confirmar, o si quedo ambiguo o no encontrado.

    '
  solo_lectura: true
  verifica_identidad: true
  campo_busqueda: cedula
  endpoint: /api/clientes/
  metodo: GET
  auth_ref: WISPHUB_API_KEY
  auth_esquema: Api-Key
  base_url_ref: WISPHUB_BASE_URL
  areas:
  - facturacion_cliente
  - soporte_tecnico_cliente
  - ventas
- nombre: ping_cliente
  tipo: http
  asincrona: true
  descripcion: 'Ping en tiempo real al equipo del cliente autenticado, via WispHub -- confirma si hay
    comunicacion real con la red, mas alla de lo que diga el estado de facturacion. Verificado en vivo
    (agosto 2026, cliente de prueba id_servicio=5832): responde en pocos segundos, 3 intentos.

    Si ''ping-exitoso'' dice que todos respondieron: el corte NO es de conectividad a nivel de red --
    no sugieras reiniciar el router por eso, la causa es otra (revisar plan/facturacion, o escalar para
    revision mas profunda). Si no responde ninguno o la mayoria: sigue el procedimiento del manual (luces
    del router, reinicio de 30 segundos, escalar si persiste).

    '
  solo_lectura: true
  endpoint: /clientes/{id_servicio}/ping/
  metodo: POST
  auth_ref: WISPHUB_API_KEY
  auth_esquema: Api-Key
  argumentos_fijos:
    pings: 3
    arp_ping: false
  inyectar_sesion:
    id_servicio: id_cliente
  inyectados_obligatorios:
  - id_servicio
  escalar_si_falla: sin_datos_para_diagnosticar
  base_url_ref: WISPHUB_BASE_URL
  areas:
  - soporte_tecnico_cliente
  campos_por_area:
    soporte_tecnico_cliente:
    - ping-exitoso
    - ping-1.packet-loss
    - ping-2.packet-loss
    - ping-3.packet-loss
    - ping-1.avg-rtt
    - ping-2.avg-rtt
    - ping-3.avg-rtt
    - ping-1.max-rtt
    - ping-2.max-rtt
    - ping-3.max-rtt
- nombre: agendar_visita_tecnica
  tipo: http
  multipart: true
  descripcion: 'Agenda una visita tecnica real en WispHub (crea un ticket) -- se ejecuta de inmediato,
    SIN ningun paso de confirmacion humana despues de la llamada, asi que la decision de llamarla o no
    es toda tuya.

    Solo la usas cuando el colaborador que te escribe ya CONFIRMO (reviso la central) que una falla puntual
    de TV en canales especificos no se explica por causas del lado del cliente (cableado, exceso de TV
    sobre el splitter, etc. -- ver seccion 5.11 del manual). Nunca la llames porque el cliente final lo
    pida directo, ni porque alguien pregunte "se puede agendar" sin haber confirmado nada -- eso es una
    pregunta, no una confirmacion.

    Argumentos que propones: ''servicio'' (id_servicio del cliente -- si solo tienes la cedula, resuelvela
    primero con consultar_cliente_por_cedula) y ''descripcion'' (canales afectados por NOMBRE, nunca numero,
    y que se valido antes de escalar). Si falta alguno, pidelo antes de llamar -- nunca inventes ni completes
    a medias. El resto (tecnico, prioridad, departamento, asunto) queda fijo, siempre el mismo tecnico
    y asunto ''Problemas De Tv''.

    '
  solo_lectura: false
  requiere_confirmacion: true
  endpoint: /api/tickets/
  metodo: POST
  auth_ref: WISPHUB_API_KEY
  auth_esquema: Api-Key
  argumentos_fijos:
    tecnico: '1428053'
    email_tecnico: mario.vasquez.moreno@gmail.com
    asunto: Problemas De Tv
    asuntos_default: Problemas De Tv
    estado: '1'
    prioridad: '2'
    departamento: Soporte Técnico
    departamentos_default: Soporte Técnico
    origen_reporte: oficina
  argumentos_sobrescribibles:
  - tecnico
  fechas_automaticas:
    fecha_inicio: 0
    fecha_final: 3
  filtros_verificados:
    servicio:
      param: servicio
      tipo: id
      verificado_el: 2026-08-12
    descripcion:
      param: descripcion
      tipo: texto
      verificado_el: 2026-08-12
  base_url_ref: WISPHUB_BASE_URL
  areas:
  - soporte
  campos_por_area:
    soporte:
    - id_ticket
    - asunto
    - estado
    - prioridad
    - tecnico
    - departamento
    - fecha_creacion
    - servicio.id_servicio
