<!doctype html>
<html lang="es">
  <head>
    <!-- Fuentes AUTOALOJADAS (12/11/2026), sin Google: ver static/fuentes/fuentes.css.
         Declara todas las familias de la plataforma (Inter, JetBrains Mono, Geist,
         y las de la Bandeja, el Supervisor NOC y el Inventario); cada archivo se
         baja solo si algo en pantalla lo usa. -->
    <link rel="stylesheet" href="%sveltekit.assets%/fuentes/fuentes.css" />
    <!-- Sin analitica de terceros. Aca estaba el Google Analytics de BottleCRM
         (G-JNWHD22PPN), heredado al vendorizar el 08/08/2026: mandaba la URL de
         cada pagina a una cuenta ajena, y hay URLs que SON la llave de acceso
         (/solicitud/<token>, el portal de facturas). Un tercero nuevo exige
         resolver la autorizacion de tratamiento antes (CLAUDE.md §5, mismo
         criterio que tiene apagado a Sentry). La prueba
         lib/observabilidad/sin-analitica-de-terceros.test.js impide que vuelva. -->
    <!-- El tema oscuro se aplica ANTES del primer pintado, o la pagina se ve
         clara un instante y salta. Lee la misma clave que lib/v2/tema.js. -->
    <script>
      try {
        if (localStorage.getItem('dexter-tema') === 'oscuro') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
