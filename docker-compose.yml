# Un solo compose para toda la plataforma: el motor (nucleo/) y la
# plataforma CRM (django-crm/, vendorizada sin su historial -- ver
# ARQUITECTURA.md). Antes eran dos archivos a proposito, para no pisar
# actualizaciones de upstream de django-crm; ese motivo ya no aplica: al
# unificar sin historial, no queda una relacion de git con el proyecto
# original para sincronizar.
#
# Arriba: docker compose up
services:
  db:
    # pgvector/pgvector, no la postgres:16-alpine de antes: el esquema
    # 'asistente' (supabase/01_schema.sql) necesita la extension 'vector'
    # para los embeddings del corpus, que la imagen oficial no trae. Misma
    # version mayor de Postgres (16), asi que el volumen existente sigue
    # sirviendo tal cual -- no hace falta reinicializar la base.
    image: pgvector/pgvector:pg16
    env_file:
      - django-crm/.env.docker
      - path: django-crm/.env.docker.local
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./django-crm/docker/postgres/init-rls-user.sql:/docker-entrypoint-initdb.d/init-rls-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./django-crm
      dockerfile: Dockerfile
    env_file:
      - django-crm/.env.docker
      - path: django-crm/.env.docker.local
        required: false
    environment:
      # Traduccion del .env de la raiz a los nombres que usa Django
      # (settings.py lee DBNAME/DBUSER/DBPASSWORD/DBHOST/DBPORT). Una sola
      # fuente: si el .env apunta a Supabase, el CRM y el motor van los dos
      # a Supabase; si no define nada, ambos se quedan en el 'db' local.
      # Los valores por defecto reproducen lo que traia .env.docker.
      DBHOST: ${DBHOST:-db}
      DBPORT: ${DBPORT:-5432}
      DBNAME: ${DBNAME:-crm_db}
      DBUSER: ${DBUSER:-crm_user}
      DBPASSWORD: ${DBPASSWORD:-crm_password}
    volumes:
      - ./django-crm/backend:/app
      - ./django-crm/docker/backend/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /bin/bash /entrypoint.sh

  celery-worker:
    build:
      context: ./django-crm
      dockerfile: Dockerfile
    env_file:
      - django-crm/.env.docker
      - path: django-crm/.env.docker.local
        required: false
    environment:
      # Traduccion del .env de la raiz a los nombres que usa Django
      # (settings.py lee DBNAME/DBUSER/DBPASSWORD/DBHOST/DBPORT). Una sola
      # fuente: si el .env apunta a Supabase, el CRM y el motor van los dos
      # a Supabase; si no define nada, ambos se quedan en el 'db' local.
      # Los valores por defecto reproducen lo que traia .env.docker.
      DBHOST: ${DBHOST:-db}
      DBPORT: ${DBPORT:-5432}
      DBNAME: ${DBNAME:-crm_db}
      DBUSER: ${DBUSER:-crm_user}
      DBPASSWORD: ${DBPASSWORD:-crm_password}
    volumes:
      - ./django-crm/backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A crm worker --loglevel=info

  celery-beat:
    build:
      context: ./django-crm
      dockerfile: Dockerfile
    env_file:
      - django-crm/.env.docker
      - path: django-crm/.env.docker.local
        required: false
    environment:
      # Traduccion del .env de la raiz a los nombres que usa Django
      # (settings.py lee DBNAME/DBUSER/DBPASSWORD/DBHOST/DBPORT). Una sola
      # fuente: si el .env apunta a Supabase, el CRM y el motor van los dos
      # a Supabase; si no define nada, ambos se quedan en el 'db' local.
      # Los valores por defecto reproducen lo que traia .env.docker.
      DBHOST: ${DBHOST:-db}
      DBPORT: ${DBPORT:-5432}
      DBNAME: ${DBNAME:-crm_db}
      DBUSER: ${DBUSER:-crm_user}
      DBPASSWORD: ${DBPASSWORD:-crm_password}
    volumes:
      - ./django-crm/backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A crm beat --loglevel=info

  frontend:
    build:
      context: ./django-crm/frontend
      dockerfile: Dockerfile
      # Servidor de Vite con recarga en caliente. El codigo entra por el bind
      # mount de abajo; el destino 'prod' compila y no lo necesita.
      target: dev
    env_file:
      - django-crm/.env.docker
      - path: django-crm/.env.docker.local
        required: false
    environment:
      # Igual que en produccion, pero con valor por defecto: en desarrollo se
      # levanta el stack entero y el tenant es el unico que hay. Ver el mismo
      # bloque en docker-compose.prod.yml para por que van aca y no en un .env.
      PRIVATE_ASISTENTE_URL: http://motor:5000
      PRIVATE_ASISTENTE_TENANT: ${ASISTENTE_TENANT:-rapilink}
    volumes:
      - ./django-crm/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

  # Embeddings. NO sirve el LLM: los cinco roles estan redirigidos a
  # deepseek-v4-flash en tenants/rapilink.config.yaml, asi que aca solo corre
  # bge-m3 (~1.2 GB en disco, ~2-3 GB residente) y no el qwen3:30b, que pedia
  # 18 GB. Tampoco se puede resolver con DeepSeek: su API expone /models y
  # /chat/completions, pero /embeddings responde 404 -- verificado. Un modelo
  # de chat no devuelve vectores; es otro tipo de modelo, no una opcion del
  # mismo.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Por defecto Ollama descarga el modelo de memoria tras 5 minutos
      # ocioso. Los embeddings estan en el camino critico de CADA pregunta,
      # no solo de la carga del corpus: sin esto, la primera consulta despues
      # de una pausa paga la recarga entera (RNF-04, el tecnico esperando en
      # campo).
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  motor:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Redirige ollama.embed() al contenedor de arriba. La libreria resuelve
      # el host con os.getenv('OLLAMA_HOST'), asi que no hay codigo que tocar.
      #
      # Configurable, no fijo: quien ya tiene Ollama nativo en su maquina
      # (Windows/Mac, el uso habitual de este equipo de desarrollo -- ver
      # PRD.md 7.1.1) puede apuntar aca a 'http://host.docker.internal:11434'
      # desde su .env y saltarse el contenedor -- y con el, la descarga de
      # ~4-5 GB (imagen + bge-m3) que ese Ollama ya tiene resuelta. Sin
      # override en el .env, el default sigue siendo el contenedor de abajo:
      # a nadie mas le cambia nada.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
    ports:
      - "5000:5000"
    volumes:
      - ./nucleo:/app/nucleo
      - ./tenants:/app/tenants
      - ./corpus:/app/corpus
      - ./cli:/app/cli
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  # external: reusa el volumen que ya existia cuando django-crm corria como
  # proyecto de compose aparte (carpeta django-crm/), en vez de que Compose
  # arme uno nuevo vacio con el nombre de proyecto "crm-agentico". Compose no
  # gestiona su ciclo de vida (no lo crea ni lo borra con "down -v").
  postgres_data:
    name: django-crm_postgres_data
    external: true
  frontend_node_modules:
  # Los modelos descargados. Sin volumen, cada redespliegue vuelve a bajar
  # 1.2 GB y la primera consulta espera a que termine.
  ollama_models:
