# Pensado para combinarse con el compose de django-crm, no para correr solo:
#
#   docker compose -f ../django-crm/docker-compose.yml -f docker-compose.yml up
#
# No se toca el docker-compose.yml de django-crm (evita pisar sus
# actualizaciones de upstream) -- este archivo solo agrega el servicio del
# motor a la misma red por defecto que ya arma ese compose.
services:
  motor:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./nucleo:/app/nucleo
      - ./tenants:/app/tenants
