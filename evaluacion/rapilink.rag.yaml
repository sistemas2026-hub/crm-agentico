  # --- NEGATIVOS: el corpus no cubre esto ----------------------------------
  #  Sin estos no se puede medir el falso positivo del gate. Ojo con el
  #  criterio: no basta con que el tema suene ajeno, tiene que ser algo que
  #  de verdad NO este documentado.
  #
  #  'ruta' dice DE DONDE deberia salir la respuesta, y es lo que separa dos
  #  fallos distintos cuando el gate deja pasar algo que no corresponde:
  #
  #    ruta: herramienta  -> lo resuelve una herramienta (WispHub, el catalogo
  #                          de planes). Que ademas se le inyecte documentacion
  #                          "recuperada para esta pregunta" es un fallo de
  #                          ROUTING: material que no viene al caso, con una
  #                          instruccion que le dice al modelo que lo use.
  #    ruta: ninguna      -> no lo responde nadie. Si el gate lo deja pasar es
  #                          un fallo de ANSWERABILITY: parecido semantico
  #                          confundido con evidencia.

  - pregunta: la receta del ajiaco santafereno
    rol: soporte
    sin_respuesta: true
    ruta: ninguna

  - pregunta: quien gano el mundial de 1986
    rol: soporte
    sin_respuesta: true
    ruta: ninguna

  - pregunta: cuantos clientes activos tenemos hoy
    rol: soporte
    sin_respuesta: true
    ruta: herramienta        # contar_clientes, no el corpus

  - pregunta: cual es el saldo de la cedula 12345678
    rol: soporte
    sin_respuesta: true
    ruta: herramienta        # dato vivo de WispHub, no documentacion

  - pregunta: a que hora abre la oficina
    rol: ventas
    sin_respuesta: true
    ruta: ninguna            # no esta documentado en el corpus

  - pregunta: cuanto cuesta el plan mas caro
    rol: ventas
    sin_respuesta: true
    ruta: herramienta        # los precios salen de consultar_planes_venta, y
                             # los documentos no traen ninguno a proposito.
                             # Caso de regresion permanente: saca 0.488 contra
                             # MANUAL-VENTAS-02, que no tiene ni un precio.

  # --- BRECHAS CONOCIDAS ----------------------------------------------------
  #  Fallos que ya sabemos que existen. No cuentan como error de calidad: son
  #  el testigo de que la mejora, cuando llegue, de verdad ocurrio.

  - pregunta: y cuanto tarda?
    rol: ventas
    espera: [MANUAL-VENTAS-02]
    brecha_conocida: >
      Mensaje corto que depende del turno anterior. Se vectoriza el mensaje
      CRUDO (ver motor.py: recuperar(..., mensaje)), asi que no hay con que
      recuperar nada. Lo arregla construir la consulta con el ultimo
      intercambio en vez de solo el ultimo mensaje.

  - pregunta: listo, dale
    rol: ventas
    espera: [MANUAL-VENTAS-02]
    brecha_conocida: >
      Igual que el anterior, en su forma extrema: como consulta de busqueda
      no significa nada.

  # --- trafico real de soporte_tecnico_cliente ------------------------------
  #  Las consultas mas frecuentes del sistema, tomadas de
  #  asistente.unanswered_queries con su numero de ocurrencias. Hasta el
  #  22/08/2026 este rol veia CERO fragmentos y todas fallaban por permisos:
  #  ningun documento tenia asignado 'soporte_tecnico_cliente'. La solucion
  #  NO fue darle las guias tecnicas -- G-GO-04 esta escrita para un tecnico
  #  con Power Meter y le diria a un cliente que manipule conectores de
  #  fibra -- sino escribir la guia que la propia empresa tenia listada como
  #  'Por Elaborar' en su procedimiento de soporte.
  #
  #  Son el tramo mas importante del set: la baseline que no los incluya
  #  mide bien y representa mal la produccion.

  - pregunta: no tengo internet
    rol: soporte_tecnico_cliente
    espera: [GUIA-ATENCION-01]          # 130 ocurrencias reales

  - pregunta: se me cayo el internet
    rol: soporte_tecnico_cliente
    espera: [GUIA-ATENCION-01]          # 36 ocurrencias reales

  - pregunta: no me anda el internet
    rol: soporte_tecnico_cliente
    espera: [GUIA-ATENCION-01]          # 35 ocurrencias reales

  - pregunta: se fue el internet
    rol: soporte_tecnico_cliente
    espera: [GUIA-ATENCION-01]

  - pregunta: no navega
    rol: soporte_tecnico_cliente
    espera: [GUIA-ATENCION-01]

  - pregunta: que hago para que vuelva el internet
    rol: soporte_tecnico_cliente
    espera: [GUIA-ATENCION-01]

  - pregunta: cuanto se demora en arreglarse
    rol: soporte_tecnico_cliente
    espera: [GUIA-ATENCION-01]

  - pregunta: tengo que revisar algun cable?
    rol: soporte_tecnico_cliente
    espera: [GUIA-ATENCION-01]

  - pregunta: reinicio el modem?
    rol: soporte_tecnico_cliente
    espera: [GUIA-ATENCION-01]

  # NO se agrega un caso de falla de TV a este set, y conviene dejar escrito
  # por que para que nadie lo "arregle" mas adelante.
  #
  # Las 62 ocurrencias de "no me sale señal en el tv" / "se me fue la señal
  # del tv" en unanswered_queries se registraron cuando estos roles veian
  # CERO fragmentos: son el mismo fallo de permisos que ya se corrigio, no
  # evidencia de que falte documentacion de TV. Leerlas como un hueco de
  # contenido fue un error de interpretacion (22/08/2026).
  #
  # El diagnostico de TV NO va al corpus porque ya vive completo en el prompt
  # del rol: confirmar el plan con consultar_plan_tv (nunca por el nombre del
  # plan), el arbol segun consultar_estado_catv (Offline / Disabled / Not
  # supported), y hasta el texto de la sintonizacion automatica eligiendo
  # ANTENA. Escribirlo tambien en un documento seria una segunda fuente de
  # verdad para una regla que ya funciona.
  #
  # Su guarda es un caso dorado que lo prueba de punta a punta contra el
  # motor real, que es donde corresponde: ver "falla de TV confirma el plan y
  # mide el puerto antes de preguntar" en rapilink.casos.yaml.
