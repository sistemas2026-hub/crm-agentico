# =============================================================================
#  SET DE EVALUACION DE RECUPERACION (RAG)  -  Rapilink
# =============================================================================
#  Se corre con:  py -3.13 cli/evaluar_rag.py rapilink
#
#  QUE MIDE, Y POR QUE NO ALCANZA CON "SUBIO LA SIMILITUD"
#  -------------------------------------------------------
#  Un promedio de similitud mas alto no dice si el fragmento CORRECTO llego.
#  Aca se mide por etapas, que es donde se ve que hay que arreglar:
#
#    elegibles     cuantos fragmentos podia ver ese rol. Un 0 es un problema
#                  de PERMISOS y no de recuperacion -- no se arregla tocando
#                  el umbral ni el modelo (ver supabase/202608211448_diagnostico_recuperacion).
#    Recall@1/3/8  si el documento correcto aparece, y que tan arriba.
#    MRR           lo mismo, en un solo numero.
#    gate          los dos errores que de verdad administra el umbral:
#                    falso negativo = habia respuesta y no paso el umbral
#                    falso positivo = no habia respuesta y algo lo paso
#
#  La distincion Recall@8 vs Recall@1 decide una cosa concreta: si el
#  documento bueno ESTA entre los candidatos pero abajo, un reranker sirve;
#  si nunca entra, un reranker no rescata nada y hay que mirar la consulta o
#  la busqueda.
#
#  COMO ESTAN ETIQUETADOS  --  LEER ANTES DE CONFIAR EN UN NUMERO
#  --------------------------------------------------------------
#  'espera' son los codigos de documento que responderian bien la pregunta.
#  Se etiquetaron por TEMA, a partir del titulo y alcance de cada documento,
#  sin haberlos leido enteros. Es un primer borrador util, no una verdad
#  revelada: cuando un caso falle, el reporte imprime que recupero de verdad
#  para poder corregir la etiqueta en un minuto si la equivocada era ella.
#  Un set de evaluacion con etiquetas malas miente con mas confianza que no
#  tener set.
#
#  'sin_respuesta: true' marca lo que el corpus NO cubre. Son tan importantes
#  como los positivos: sin ellos no se puede medir el falso positivo del
#  gate, que es el que hace que el asistente conteste con material que no
#  responde la pregunta.
#
#  'brecha_conocida' documenta un fallo que YA sabemos que existe. No cuenta
#  como error de calidad -- esta para que el dia que se arregle, se note.
# =============================================================================

casos:

