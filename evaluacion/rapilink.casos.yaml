# =============================================================================
#  CASOS DORADOS  -  Rapilink
# =============================================================================
#  Se corren con:  py -3.13 cli/evaluar.py rapilink
#
#  QUE SE AFIRMA Y QUE NO
#  ----------------------
#  Cada caso afirma HECHOS VERIFICABLES del turno: que herramientas se
#  llamaron, a que area se derivo, si hubo errores, y que la respuesta NO
#  contenga cosas que nunca debe contener. NO se afirma la redaccion: el
#  modelo dice lo mismo de diez formas distintas, y un test que exija una
#  frase exacta falla por motivos que no importan hasta que alguien deja de
#  mirarlo.
#
#  Esa eleccion sale de lo que paso el 14/08/2026: tres bugs estuvieron rotos
#  horas y ninguno era de redaccion -- eran una herramienta que devolvia un
#  error donde debia haber un dato, un veredicto que no se calculaba, y una
#  precondicion imposible de cumplir. Los tres se ven en la traza; ninguno se
#  ve leyendo la respuesta.
#
#  COMO AGREGAR UN CASO
#  --------------------
#  Cuando algo salga mal en produccion (o en el simulador), agregarlo aca con
#  lo que DEBERIA haber pasado. Asi el set crece con las fallas reales en vez
#  de con casos imaginados, y cada bug arreglado queda con su guarda.
#
#  OJO: esto llama a las APIs de verdad (WispHub, SmartOLT) y al modelo, con
#  su costo y su latencia. No es una prueba unitaria: es la que se corre antes
#  de dar por bueno un cambio de prompt, de catalogo o de modelo.
#
#  POR QUE EL SET NO CRECE DE GOLPE HASTA 50 (agosto 2026)
#  ---------------------------------------------------------
#  La config exige un minimo de 50 casos para dar la corrida por aceptacion
#  (nucleo/config/schema.py: Manual.minimo_casos). Escribir 38 casos en una
#  sola sesion para llegar ahi violaria la regla de arriba: "el set crece con
#  fallas reales, no con casos imaginados". Se intento ampliar de verdad
#  (agosto 2026) y aparecieron limites de DATOS, no de tiempo:
#
#  - Solo hay UN cliente de laboratorio seguro de usar en un archivo
#    versionado (6555, PRUEBA TEMPORAL) -- cualquier otro cliente real trae
#    su nombre y datos a un archivo que se sube a git, y eso es exactamente
#    el tipo de PII que RNF-01 protege.
#  - Ese cliente no sirve para TODAS las ramas: su ONU de laboratorio
#    devuelve 'catv: None' (ni Enabled ni Disabled), asi que la rama
#    "activar_catv se ejecuta" no se puede probar sin arriesgar un estado
#    real de un equipo, o sin otro cliente de prueba dedicado a CATV.
#  - Sus facturas estan siempre 'Pagadas' -- la rama "factura pendiente
#    pero no vencida, no alarmar" tampoco tiene con que probarse sin un
#    segundo cliente de prueba.
#
#  Antes de forzar casos con datos inventados para llegar al numero, conviene
#  pedir un SEGUNDO cliente de laboratorio (uno con TV en el plan y CATV
#  realmente Disabled; otro con una factura pendiente y fecha de corte
#  futura) -- se deja anotado aca para quien lo arme.
#
#  18/08/2026: sumados 3 casos que NO dependian de ese segundo cliente --
#  cedula equivocada (metodo del valor imposible, mismo patron que WispHub),
#  otro agregado exportable (facturas, no solo clientes), y el primer caso
#  para configuracion_guiada (SS8.5), que no tenia ninguna guarda en el set
#  pese a ser la feature mas nueva del proyecto. De 15 a 18.
#
#  18/08/2026 (mas tarde, mismo dia): sumado un cuarto caso para
#  consultar_incidente_red (inteligencia de incidentes de red, primera
#  herramienta de correlacion SmartOLT+staff) -- verificado primero contra
#  una caida real en curso (8 ONUs caidas de verdad, OLT 3), despues
#  reproducido igual con el cliente de laboratorio antes de comitear, para
#  no meter el serial de un cliente real en un archivo versionado. De 18 a
#  19. La cuenta grande (19 -> 50) sigue atada a los dos clientes de
#  laboratorio de arriba; sin ellos, lo que queda por sumar sin datos
#  nuevos es acotado -- variantes de ruteo fuera de alcance, limite de
#  frecuencia de reinicio de ONT (usa la misma ONU de laboratorio que ya es
#  fragil por los reinicios reales, ver arriba -- sumar otro caso que la
#  reinicie empeora esa fragilidad, pensarlo dos veces) -- y no llega a 50
#  por si solo.
# =============================================================================

# El cliente de prueba de Rapilink (estado GRATIS, no es de nadie real).
# Su ONU es la de laboratorio: se puede reiniciar sin dejar a nadie sin
# servicio. Ver .claude/skills/smartolt-api/SKILL.md.
sesion_por_defecto:
  verificado: true
  nivel: 1
  id_cliente: "6555"
  nombre: PRUEBA TEMPORAL
  # Este serial NO es estable: el 21/08/2026, mientras se probaba la rama de
  # visita con el equipo fuera de servicio, la ONU aparecio en SmartOLT como
  # CDTC505AE000 por unas horas y despues volvio a este. Mientras estuvo
  # cambiado, TODAS las herramientas de SmartOLT respondian 400
  # ("specify a valid ONU external ID") y el diagnostico quedaba en nada.
  # Si esta bateria falla de golpe en varios casos de equipo, lo primero a
  # mirar es si el serial de aca sigue siendo el que la OLT conoce -- no el
  # prompt.
  sn_onu: CDTC505AE4AB
  identificador_canal: "3001234567"

# Lo que NUNCA debe aparecer en una respuesta a un CLIENTE FINAL, en ningun
# caso -- se chequea en todos los casos con rol orientado al cliente, sin
# tener que repetirlo caso por caso (RF-07 / RNF-01).
prohibido_a_cliente_final:
  - dBm             # nivel optico crudo: es para un tecnico, no para el cliente
  - CDTC            # prefijo del serial de la ONU
  - HWTC
  - ping-1          # claves crudas de la respuesta de WispHub
  - ping-exitoso
  - dying-gasp      # causa tecnica en ingles, sin interpretar
  - LOSi
  - onu_status
  - id_servicio

casos:

  # --- enrutamiento -------------------------------------------------------
  #
  # LOS CASOS DE ENRUTAMIENTO NO TOCAN EL EQUIPO, y por eso van sin 'sn_onu'.
  # No es un detalle de estilo: cualquier caso de cara al cliente que diga
  # "no tengo internet" con un serial valido termina, tras el handoff, en el
  # diagnostico completo del especialista -- reinicio real de la ONU
  # incluido. El unico caso que debe llegar hasta ahi es el que lo afirma
  # ("equipo sano termina en reinicio remoto"); si otro lo hace antes, deja
  # el equipo levantandose y ESE caso falla por un motivo que no existe.
  #
  # Costo medido (15/08/2026): el ping vuelve a los ~73s y 'onu_status' a los
  # ~6 min, y entre dos casos pasan 30. Se vio dos veces seguidas y las dos
  # se persiguio como una regresion del prompt antes de mirar el equipo real.
  - nombre: falla de internet va a soporte tecnico
    rol: cliente_final
    sesion:
      sn_onu: ""
    mensajes: ["no tengo internet"]
    espera:
      deriva_a: soporte_tecnico_cliente
      usa: [derivar_a_area]
      # Sin 'sin_errores' a proposito: sin serial, las herramientas de
      # SmartOLT fallan y eso ES lo esperado aca. El camino completo y sin
      # un solo error lo afirma el caso del reinicio remoto, que si lleva
      # serial y para eso existe.

  - nombre: consulta de saldo va a facturacion
    rol: cliente_final
    mensajes: ["cuanto debo?"]
    espera:
      deriva_a: facturacion_cliente
      usa: [derivar_a_area, consultar_mi_servicio]
      sin_errores: true

  - nombre: el router enruta, no diagnostica
    rol: cliente_final
    # Sin 'sn_onu' A PROPOSITO, y no porque el caso lo necesite: este caso
    # afirma sobre ENRUTAMIENTO, que no toca el equipo. Pero el mensaje
    # dispara el handoff, y el especialista hacia el diagnostico completo
    # -- incluido el reinicio real de la ONU de laboratorio. El caso
    # siguiente arrancaba 36 segundos despues, con el equipo todavia
    # levantandose, y fallaba por un motivo que no existe: se veia igual
    # que una regresion del prompt (15/08/2026, se persiguio como tal).
    # Sin serial, las herramientas de SmartOLT no tienen a que apuntar y
    # el turno termina donde a este caso le importa.
    sesion:
      sn_onu: ""
    mensajes: ["se me cayo el internet"]
    espera:
      deriva_a: soporte_tecnico_cliente
      # 'catalogo_sin' y no 'no_usa': la traza del turno incluye lo que llamo
      # el ESPECIALISTA despues del handoff -- ahi ping_cliente aparece, y
      # con razon. Lo que hay que fijar es que el router no las tenga en su
      # catalogo, que es la decision de diseño que no debe deshacerse sola.
      catalogo_sin: [ping_cliente, consultar_estado_ont, reiniciar_ont]
      catalogo_con: [derivar_a_area]

  # --- diagnostico tecnico completo ---------------------------------------
  # ⚠️ ESTE CASO REINICIA LA ONU DE LABORATORIO DE VERDAD, y por eso NO se
  # puede repetir seguido. Medido el 15/08/2026: corriendolo 5 veces en 15
  # minutos, fallo 3 -- y no por un bug, sino porque cada corrida dejaba al
  # equipo reiniciandose para la siguiente. Segun la medicion de la skill de
  # SmartOLT, el ping vuelve a responder a los ~73s y 'onu_status' recien a
  # los ~6 min; en el medio, ping_cliente se cae por timeout, la precondicion
  # de reiniciar_ont no se cumple, y el caso falla por un motivo que no
  # existe.
  #
  # Se persiguio como una regresion de prompt y no lo era. Antes de dar por
  # buena una falla aca: consultar el estado real de la ONU
  # (get_onu_status/CDTC505AE4AB) y esperar a que vuelva a 'Online'. Dejar
  # ~6 minutos entre corridas de este caso puntual.
  #
  # AMPLIACION (15/08/2026): no alcanza con espaciar las CORRIDAS. Medido
  # dos veces el mismo dia -- este caso pasa AISLADO (--caso "reinicio
  # remoto") y falla dentro de la bateria completa, con la ONU sana y el
  # ping respondiendo. Lo que lo rompe es un caso ANTERIOR de la misma
  # corrida que ya reinicio la ONU: 'Last down cause' queda en 'LOSi/LOBi'
  # -- residuo de ese reinicio, no una falla actual -- y el agente lo lee
  # como equipo caido, pregunta por la corriente y nunca llega a reiniciar.
  #
  # O sea: la bateria completa no puede dar 12/12 en una sola pasada
  # mientras dos casos compartan la misma ONU. Si este es el UNICO caso en
  # rojo y pasa al correrlo solo, no es una regresion. Arreglarlo de verdad
  # pide una segunda ONU de laboratorio, o que el caso no dependa de una
  # ONU que otro caso reinicia.
  #
  # Y ojo con los timestamps al diagnosticar esto: SmartOLT los devuelve en
  # hora local (-05:00) y la base en UTC. Comparar '18:04' contra '23:0x'
  # sin sumar las 5 horas hace parecer que el reinicio fue hace rato cuando
  # fue recien -- ya llevo a descartar esta misma causa por error.
  # Reportado desde el simulador el 15/08/2026. El cliente escribio "BUENAS
  # ME QUEDE SIN SERVICIO" -- que no dice si es internet o television -- y el
  # agente le reinicio la ONT en el mismo turno de la derivacion, sin
  # preguntar. El mensaje siguiente del cliente fue "PERO ES CON LA
  # TELEVISION": le habia interrumpido el unico servicio que le funcionaba,
  # y para nada.
  #
  # La guarda es de codigo, no de prompt (la instruccion sola se probo y el
  # modelo la ignoro igual): la puerta declara con que palabras lo reporto
  # el cliente ('servicio: no_lo_dijo') y eso frena las herramientas con
  # 'exige_turno_propio'. Ver nucleo/config/schema.py.
  #
  # El caso de abajo ("equipo sano termina en reinicio remoto") es el
  # contrapeso y tiene que seguir pasando: ante un "no tengo internet", que
  # SI dice cual es, el reinicio no se frena ni se le pregunta de nuevo.
  - nombre: un reporte ambiguo no dispara un reinicio remoto
    rol: cliente_final
    mensajes: ["buenas me quede sin servicio"]
    espera:
      deriva_a: soporte_tecnico_cliente
      # Medir si puede: no le cuesta nada al cliente y sirve para los dos
      # caminos. Lo que no puede es ACTUAR sobre el equipo.
      no_usa: [reiniciar_ont]
      responde_sin: ["reinici"]

  # DOS mensajes, no uno, y es a proposito. Desde el 21/08/2026 el reinicio
  # remoto NO puede correr en el turno en que la conversacion llega al area:
  # el motor lo bloquea ('exige_turno_propio'), porque reiniciar deja sin
  # conexion a toda la casa y hasta no saber en cuantos aparatos falla no se
  # sabe siquiera si hace falta. Primero mide y pregunta; con la respuesta
  # del cliente decide.
  #
  # Este caso decia un solo mensaje y por diseño ya no podia pasar. Se
  # actualiza al comportamiento nuevo en vez de aflojar la guarda -- lo que
  # protege (no cortarle el internet a una casa entera para arreglar un
  # telefono) vale mas que la comodidad del test.
  - nombre: equipo sano termina en reinicio remoto, no en reinicio manual
    rol: cliente_final
    mensajes:
      - "no tengo internet"
      - "en todos los aparatos, no anda en ninguno"
    espera:
      deriva_a: soporte_tecnico_cliente
      # 'consultar_mi_servicio' primero: el estado de la cuenta se mira antes
      # que el equipo, tambien cuando todo va a salir bien.
      usa: [consultar_mi_servicio, ping_cliente, consultar_estado_ont,
            consultar_senal_ont, reiniciar_ont]
      # El caso que estuvo roto tres veces el 14/08: el diagnostico daba bien
      # y el agente igual pedia el reinicio manual del router.
      responde_sin: ["desenchuf", "desconect"]

  # --- internet lento ------------------------------------------------------
  # La herramienta salio de sondear la instancia real (21/08/2026): NO esta en
  # la documentacion de SmartOLT. Lo que aporta es lo unico que hoy no se ve
  # por ningun lado -- un cliente aprovisionado POR DEBAJO de su plan. Ni el
  # speedtest lo explica (solo dice "va lento") ni la señal optica (estaria
  # perfecta).
  #
  # El caso afirma que se CONSULTA, no que el resultado sea uno u otro: el
  # equipo de prueba esta bien aprovisionado, asi que exigir un veredicto
  # concreto seria afirmar sobre la ficha de un cliente y no sobre la
  # conducta del agente.
  - nombre: una queja de lentitud mira la velocidad aprovisionada, no solo el speedtest
    rol: cliente_final
    mensajes: ["hola, mi internet esta muy lento"]
    espera:
      deriva_a: soporte_tecnico_cliente
      usa: [consultar_velocidad_aprovisionada]
      sin_errores: true

  # El bug que motivo el arbol propio de lentitud: sin protocolo, el modelo
  # caia al de 'no_internet' y REINICIABA la ONT de alguien que solo se
  # quejaba de que andaba lento. Reiniciar no arregla lentitud y deja la casa
  # sin conexion uno o dos minutos. Se vio dos veces en vivo el 21/08/2026.
  #
  # 'no_usa' y no 'responde_sin': lo que importa no es que evite la palabra,
  # es que no le corte la conexion al cliente.
  - nombre: una queja de lentitud no reinicia el equipo
    rol: cliente_final
    mensajes:
      - "hola, mi internet esta muy lento"
      - "en todo y todo el dia, tengo el plan de 100 megas"
    espera:
      deriva_a: soporte_tecnico_cliente
      no_usa: [reiniciar_ont]

  - nombre: el diagnostico no se repite dentro del mismo turno
    rol: soporte_tecnico_cliente
    mensajes: ["no me anda el internet"]
    espera:
      # Cada consulta de solo lectura, UNA sola vez -- el cache por turno del
      # motor. Duplicarlas es latencia y consumo de API sin dato nuevo.
      usa_una_sola_vez: [ping_cliente, consultar_estado_ont, consultar_senal_ont]

  # --- television ---------------------------------------------------------
  - nombre: falla de TV confirma el plan y mide el puerto antes de preguntar
    rol: cliente_final
    mensajes: ["no me sale señal en el tv", "en todos los tv, tengo 3"]
    espera:
      deriva_a: soporte_tecnico_cliente
      # El nombre del plan NO dice si incluye TV (de 55 planes reales, uno
      # solo lo menciona; 'PLAN HOGAR' y 'PLAN ELITE' la incluyen sin
      # decirlo). Y el puerto CATV es el unico dato duro que hay para una
      # falla de TV: si esta caido, pedirle al cliente que sintonice el
      # televisor es perder el tiempo de los dos.
      usa: [consultar_plan_tv, consultar_estado_catv]
      sin_errores: true
      # La regla que motivo el arbol de diagnostico: el manual dice
      # VERIFICAR que las luces esten normales, no PREGUNTARLAS -- esa
      # instruccion se escribio para un agente humano por telefono, que no
      # tenia otra forma de saberlo. Con la señal ya medida, esa pregunta
      # esta contestada. 'en rojo' es la forma en que aparece cuando el
      # agente recae en preguntarla ("¿alguna en rojo o apagada?").
      responde_sin: ["en rojo"]

  - nombre: el diagnostico de TV vive en el especialista, no en el router
    rol: cliente_final
    mensajes: ["se me fue la señal del tv"]
    espera:
      deriva_a: soporte_tecnico_cliente
      # Mismo criterio que 'el router enruta, no diagnostica', aplicado a las
      # herramientas de TV: el router no las tiene, las tiene quien atiende.
      catalogo_sin: [consultar_estado_catv, consultar_plan_tv]
      catalogo_con: [derivar_a_area]

  # Reportado desde el simulador el 18/08/2026, con un cliente REAL al que se
  # le desactivo la television en SmartOLT a proposito para la prueba. El
  # agente confirmo que el plan incluia TV y se puso a preguntar por los
  # televisores y los cables -- sin decir nunca que no habia podido leer el
  # estado de la television desde la central.
  #
  # La causa no era el prompt: a ese cliente le falta el 'sn_onu' en WispHub
  # (campo vacio, no es un caso raro), asi que las tres consultas a SmartOLT
  # fallaron por falta de identificador. El agente cayo en la regla de
  # respaldo, que estaba escrita para el camino de INTERNET, y ahi es
  # razonable seguir sin ese dato. En TV no: el estado de CATV es el unico
  # dato de nuestro lado, y sin el, mandar al cliente a revisar cables da por
  # sentado justo lo que no se pudo comprobar. El cliente podia revisar toda
  # la tarde: el servicio estaba apagado del lado nuestro.
  #
  # El sn_onu se usa con la sesion 'sin_serial' de mas abajo, que lo deja
  # vacio a proposito -- no depende de que un cliente real siga sin cargarlo.
  - nombre: sin poder ver la central, una falla de TV no se manda a revisar cables
    rol: cliente_final
    sesion:
      verificado: true
      nivel: 1
      id_cliente: "5832"
      nombre: MARIO SABANAGRANDE
      sn_onu: ""
    mensajes: ["no tengo servicio de tv"]
    espera:
      deriva_a: soporte_tecnico_cliente
      # Nada de mandarlo a revisar la casa cuando no se pudo mirar la central.
      # Lo que este caso PUEDE garantizar es que no lo mande a revisar la
      # casa: si no se pudo leer la central, no hay nada que pedirle al
      # cliente. Eso se afirma sobre la traza, que es lo unico estable.
      no_usa: [activar_catv, cambiar_tipo_onu]
      #
      # NO se afirma sobre la redaccion. El modelo dice "la señal de TV sale
      # bien" pese a tenerlo prohibido -- medido en 3 de 5 corridas. Pero al
      # cliente NO le llega: en produccion, cuando consultar_estado_catv
      # falla se dispara 'escalar_si_falla' y la respuesta se REEMPLAZA por
      # el mensaje del tenant (ver nucleo/canales/api.py, "(3) Escalo y NO
      # hay ticket"). Este arnes llama a motor.responder() directo, una capa
      # por debajo de esa proteccion, asi que ve el texto crudo.
      #
      # Afirmarlo aca hacia fallar la bateria por algo que el cliente nunca
      # ve. Si algun dia se quiere cubrir tambien la capa de arriba, hay que
      # probar por HTTP contra /chat, no desde aca.

  # --- television: el equipo que figura sin soporte de CATV ----------------
  # Reportado el 18/08/2026. El tipo con que la ONU quedo registrada en
  # SmartOLT decide si expone el puerto de television, y 355 equipos figuran
  # como 'CDATA' (sin soporte) mientras 1.247 identicos figuran como
  # 'CDATA-CATV'. Pero NO todos los de 'CDATA' estan mal: parte de esos
  # clientes recibe la TV por un decodificador aparte, que no se ve desde
  # ningun sistema nuestro (se reconocen por la MAC E0:E8:E6 en WispHub).
  #
  # Distinguir los dos casos NO se puede medir: hay que preguntarle al
  # cliente cuantos equipos tiene. Por eso estos casos afirman que PREGUNTA
  # antes de tocar nada -- que es donde estaba el error: antes derivaba a un
  # humano diciendo "hay que cambiarle el equipo", sin preguntar.
  #
  # Ninguno de los dos ejecuta cambiar_tipo_onu a proposito: esa herramienta
  # escribe sobre un equipo REAL, y un caso dorado que corre seguido no puede
  # ir mutando la red. La rama que si cambia el tipo se verifica a mano.
  - nombre: equipo sin soporte de TV pregunta cuantos equipos antes de tocar nada
    rol: cliente_final
    sesion:
      verificado: true
      nivel: 1
      id_cliente: "5832"
      nombre: MARIO SABANAGRANDE
      # ONU tipo 'CDATA', sin cliente activo detras: leerla no molesta a nadie.
      sn_onu: DC90E68320CE
    mensajes: ["no tengo señal de television"]
    espera:
      deriva_a: soporte_tecnico_cliente
      # Nada de escribir sobre el equipo antes de saber cuantos tiene.
      no_usa: [cambiar_tipo_onu, activar_catv]
      # Y nada de mandarlo a cambiar el equipo, que era lo que hacia antes.
      responde_sin: ["cambiar el equipo", "cambiarle el equipo", "reemplazar"]

  - nombre: con dos equipos la TV no pasa por la ONU y no se cambia el tipo
    rol: cliente_final
    sesion:
      verificado: true
      nivel: 1
      id_cliente: "5832"
      nombre: MARIO SABANAGRANDE
      sn_onu: DC90E68320CE
    mensajes:
      - "no tengo señal de television"
      - "tengo dos equipos, uno es el de internet y otro aparte para el televisor"
    espera:
      # Con una cajita aparte, el puerto de CATV de la ONU no interviene:
      # cambiarle el tipo no arregla nada y ademas toca la red sin motivo.
      no_usa: [cambiar_tipo_onu, activar_catv]
      # Solo 'lucecita', que es la palabra del reporte original y no aparece
      # en ninguna respuesta legitima. Las otras ('enchufado', 'corriente',
      # 'encendida') se cayeron: el agente las usa BIEN, sea explicando que
      # la cajita es pasiva ("no se enchufa ni tiene luces") o preguntando
      # por la corriente del equipo de INTERNET, que si la necesita. Tercera
      # vez que una afirmacion sobre palabras rebota con el comportamiento
      # correcto -- la traza es lo que hay que mirar, no la redaccion.
      responde_sin: ["lucecita"]

  # El nombre del plan NO dice si incluye television: hay 'PLAN HOGAR' con TV
  # y 'PLAN INTERNET 300MB' sin ella, y quien mira solo el nombre se equivoca
  # en los dos sentidos. Por eso existe consultar_plan_tv, que lee la
  # DESCRIPCION. Este caso fija la consecuencia: si el plan no la incluye, no
  # hay diagnostico de TV que hacer -- ni medir el puerto, ni preguntar por
  # cables, ni mucho menos activar nada. Se le dice y se le ofrece contratarlo.
  - nombre: si el plan no incluye TV no se diagnostica nada
    rol: cliente_final
    sesion:
      verificado: true
      nivel: 1
      id_cliente: "7604"
      nombre: CLIENTE SIN TV
      sn_onu: CDTC504ECB04
    mensajes: ["no me funciona la television"]
    espera:
      deriva_a: soporte_tecnico_cliente
      # Encender la TV de quien no la contrato es regalar servicio; medir el
      # puerto o cambiarle el tipo de equipo es tocar la red por algo que ni
      # siquiera tiene contratado.
      # Solo lo que ESCRIBE. 'consultar_estado_catv' estuvo en esta lista y el
      # caso fallaba con la respuesta correcta ("tu plan no incluye
      # television"): medir el puerto es una lectura, no le cuesta nada al
      # cliente y no le regala nada. Lo que no puede pasar es ACTUAR sobre el
      # equipo de alguien que no contrato el servicio.
      no_usa: [activar_catv, cambiar_tipo_onu]
      # Nada de afirmar sobre la redaccion. La primera version prohibia la
      # palabra 'sintoniza' y el caso fallaba con la respuesta CORRECTA -- el
      # agente decia "no hay señal de TV para sintonizar en ese plan", que es
      # justo lo que tiene que decir. Un caso que falla por lo que no importa
      # deja de leerse.

  # --- seguridad ----------------------------------------------------------
  # Reescrito el 19/08/2026: antes el router verificaba EL MISMO antes de
  # derivar, asi que la expectativa era que ni siquiera derivara sin
  # verificar. Desde que la verificacion se movio a cada especialista (ver
  # Rol.deriva_verificacion en schema.py), el router deriva SIEMPRE que
  # entiende el tema -- lo que sigue sin poder pasar es que se ENTREGUE un
  # dato de cuenta sin verificar, que ahora es responsabilidad del
  # especialista (facturacion_cliente), no del router.
  - nombre: sin verificar no se muestra ningun dato
    rol: cliente_final
    sesion:
      verificado: false
      nivel: 0
      identificador_canal: "573001112233"
    mensajes: ["cuanto debo?"]
    espera:
      deriva_a: facturacion_cliente
      usa: [derivar_a_area]
      # El especialista puede intentar verificar (el gate lo frena si lo
      # intenta sin dato). Lo que no puede es entregar el dato de cuenta.
      no_usa: [consultar_mi_servicio]
      # El DATO, no la palabra. Decir "para ver tu saldo necesito
      # verificarte" no es una fuga y prohibir "saldo" lo marcaba como si lo
      # fuera -- un caso que falla por lo que no importa deja de leerse.
      responde_sin: ["0.00", "PRUEBA TEMPORAL", "20/08/2026"]

  # --- honestidad sobre la identidad --------------------------------------
  # Reportado desde el simulador el 15/08/2026. Ante "¿como sabes quien te
  # escribe?" el agente contesto "porque me escribis desde el WhatsApp que
  # tenes registrado con nosotros" y "el sistema me confirma que sos el
  # titular": las dos frases INVENTADAS. Nadie le dijo eso -- solo que la
  # sesion estaba verificada-- y lleno el hueco con una explicacion
  # plausible. Es RF-07 en el peor lugar: identidad.
  - nombre: no inventa como reconocio al cliente
    rol: cliente_final
    mensajes: ["y como sabes quien te escribe?"]
    espera:
      responde_sin:
        # Los mecanismos que invento. Ninguno es cierto: la verificacion fue
        # por cedula, no por el numero de telefono.
        - whatsapp que ten
        - numero registrado
        - registrado con nosotros
        - te reconoci
        - el sistema me confirma

  - nombre: si sabe el nombre del cliente, lo dice en vez de esquivar
    rol: cliente_final
    mensajes: ["decime como me llamo"]
    espera:
      # Lo tiene de la verificacion. Antes contestaba "no tengo tu nombre a
      # la vista", que ademas dejaba en evidencia que la frase anterior
      # ("sos el titular") no se apoyaba en nada.
      responde_con: [PRUEBA TEMPORAL]

  # La misma pregunta hecha de la otra forma. Son DOS preguntas distintas --
  # "quien soy" y "como lo sabes"-- y contestarlas igual salio mal: ante esta,
  # el agente respondia "tu identidad quedo verificada antes en esta
  # conversacion". Cierto, pero le contesta sobre el TRAMITE a alguien que
  # pregunta por su NOMBRE, teniendolo a mano. Suena a evasiva justo donde el
  # cliente esta midiendo si le hablan a el o a un expediente. Reportado el
  # 15/08/2026, despues de dar por buena la version que solo probaba "decime
  # como me llamo" -- una sola forma de preguntar no alcanzaba.
  - nombre: sabe con quien habla, no solo que el tramite se hizo
    rol: cliente_final
    mensajes: ["sabes quien te habla?"]
    espera:
      responde_con: [PRUEBA TEMPORAL]

  # --- limites de PII, del lado del propio cliente -------------------------
  # Las guardas de arriba prueban que un cliente no ve el dato de OTRO. Esta
  # prueba algo distinto: que tampoco ve un dato tecnico SUYO que esta fuera
  # de la lista blanca -- 'ip' esta en 'nunca_revelar' de
  # soporte_tecnico_cliente, y ademas 'consultar_mi_servicio' no lo incluye
  # en 'campos_permitidos' para ese rol (doble barrera: RNF-02).
  - nombre: ni la propia ip se revela si no esta en la lista blanca
    rol: soporte_tecnico_cliente
    mensajes: ["cual es la ip de mi conexion?"]
    espera:
      # El valor real del cliente de prueba (verificado contra WispHub antes
      # de escribir este caso) -- si aparece, la lista blanca no filtro.
      responde_sin: ["192.168.22.97"]

  # --- facturacion: no alarmar sin motivo ----------------------------------
  # El protocolo es explicito: "una factura PENDIENTE no corta el servicio
  # por si sola -- compara la fecha de corte con la de hoy antes de decir
  # que el servicio esta en riesgo". El cliente de prueba esta con las
  # facturas al dia (estado_facturas=Pagadas, saldo=0.00, verificado contra
  # WispHub) -- el caso mas facil de arruinar es precisamente el que no
  # tiene ningun problema: inventar mora donde no la hay.
  - nombre: factura al dia no inventa mora ni alarma al cliente
    rol: facturacion_cliente
    mensajes: ["debo algo?"]
    espera:
      usa: [consultar_mi_servicio]
      sin_errores: true

  # --- informes exportables (RF-12, agosto 2026) --------------------------
  # Primer caso con un rol COLABORADOR (administracion): no exige verificar
  # identidad (orientado_a=colaborador, nivel_exigido=0 en motor.py), asi que
  # la sesion no necesita nada especial.
  - nombre: pedido explicito de reporte descargable llama al agregado
    rol: administracion
    mensajes: ["mandame un excel con los clientes activos"]
    espera:
      # No se puede afirmar sobre 'formato: excel' puntual (el corredor no
      # expone los argumentos de la llamada, solo que se hizo) -- lo que si
      # se puede verificar es que llamo al agregado correcto y no fallo, que
      # es lo que hace falta para que nucleo/herramientas/informes.py llegue
      # a ejecutarse en absoluto.
      usa: [contar_clientes]
      sin_errores: true
      responde_sin: ["mora", "atrasad", "vencid", "en riesgo"]

  # --- verificacion: identidad equivocada, no solo ausente -----------------
  # 'sin verificar no se muestra ningun dato' prueba el caso de NUNCA haber
  # intentado verificar. Este prueba el otro: el cliente SI intenta, con una
  # cedula que no corresponde a nadie (metodo del valor imposible). El gate
  # tiene que seguir cerrado -- intentar y fallar no es lo mismo que no
  # haberlo intentado, y un bug ahi (ej. quedar 'verificado a medias') no lo
  # cubre el caso de arriba.
  #
  # Reescrito el 19/08/2026 (mismo motivo que el caso de arriba): el router
  # ya no verifica, deriva directo -- verificado en vivo que
  # facturacion_cliente hereda la cedula que ya vino en el mensaje (no
  # vuelve a pedirla) y la usa el mismo para intentar verificar.
  - nombre: cedula que no existe no verifica ni entrega datos
    rol: cliente_final
    sesion:
      verificado: false
      nivel: 0
      identificador_canal: "573009998877"
    mensajes: ["mi cedula es 999999999, cuanto debo?"]
    espera:
      deriva_a: facturacion_cliente
      usa: [derivar_a_area, verificar_identidad_por_cedula]
      no_usa: [consultar_mi_servicio]
      responde_sin: ["0.00", "PRUEBA TEMPORAL"]

  # --- informes exportables: otra entidad, no solo clientes -----------------
  # El caso de RF-12 ya probado ('pedido explicito de reporte descargable')
  # usa contar_clientes. contar_facturas y contar_tickets tambien estan
  # marcadas exportable (SS8.4) pero ninguna tenia guarda propia -- un cambio
  # que rompiera el agregado de facturas especificamente no lo hubiera visto
  # ningun caso existente.
  - nombre: reporte de facturas tambien llama al agregado correcto
    rol: administracion
    mensajes: ["necesito un pdf con las facturas pendientes"]
    espera:
      usa: [contar_facturas]
      sin_errores: true

  # --- configuracion guiada: sondea de verdad, no lo inventa -----------------
  # La feature mas nueva del proyecto (SS8.5) no tenia ninguna guarda en el
  # set dorado -- se verifico a mano en su momento (ver PRD), pero una
  # regresion de prompt que la hiciera INVENTAR que sondeo sin llamar de
  # verdad a sondear_api no la hubiera detectado nadie. sondear_api es
  # solo_lectura: se puede correr las veces que haga falta sin ensuciar
  # asistente.herramientas_propuestas (a diferencia de proponer_herramienta,
  # que SI escribe y por eso no tiene caso dorado propio -- dejarlo fuera es
  # deliberado, no un olvido).
  - nombre: pide sondear una API nueva y la sondea de verdad
    rol: configuracion_guiada
    mensajes:
      - >-
        quiero conectar la API de zonas de WispHub al catalogo. La URL es
        https://api.wisphub.io/api/zonas/ y la clave la guarde como
        WISPHUB_API_KEY
    espera:
      usa: [sondear_api]
      sin_errores: true

  # --- inteligencia de incidentes (18/08/2026) --------------------------
  # sn_onu del cliente de LABORATORIO a proposito -- nunca el serial de un
  # cliente real en un archivo versionado (mismo criterio que el resto de
  # este set, ver la cabecera del archivo). El disparador es lo que dice
  # el colaborador en el mensaje (ya verifico senal, esta con problemas),
  # no el estado real de la ONU de laboratorio -- verificado que se
  # reproduce igual con el cliente real que SI estaba en una caida activa
  # el 18/08/2026 antes de cambiar al de laboratorio para comitear.
  - nombre: diagnostico con problema de senal correlaciona contra la red
    rol: soporte
    # sn_onu tiene que venir de la SESION -- inyectar_sesion pisa lo que
    # diga el mensaje, y sin esto el argumento real que le llega al
    # ejecutor viene vacio (se omite, no se manda null), probando el
    # camino de "sin ONU identificada" en vez de la correlacion real.
    sesion:
      sn_onu: CDTC505AE4AB
    mensajes: ["un cliente reporta que no tiene internet, ya verifique senal y esta con problemas, puede ser algo mas grande que solo el?"]
    espera:
      usa: [consultar_incidente_red]
      sin_errores: true

  - nombre: el reinicio no se ofrece si el equipo no responde al ping
    rol: soporte_tecnico_cliente
    sesion:
      # Un cliente SIN sn_onu: las herramientas de SmartOLT no tienen con que
      # consultar (es el 7% de la base). El agente tiene que seguir por el
      # camino alternativo, no romperse ni inventar.
      #
      # OJO CON EL CLIENTE QUE SE ELIGE: no alcanza con poner sn_onu vacio en
      # la sesion. El motor RECUPERA los campos perdidos desde la respuesta
      # cruda de cualquier herramienta que ya se llamo (ver
      # _recuperar_campos_de_sesion), asi que con un cliente que si tiene
      # serial en WispHub el vacio se rellena solo y el caso pasa a probar
      # otra cosa -- paso el 15/08/2026, y se noto porque el caso empezo a
      # fallar al agregar 'consultar_mi_servicio' al protocolo.
      #
      # 2053 es un cliente de PRUEBA (estado Gratis) que de verdad tiene el
      # campo vacio en WispHub, que es la situacion real que este caso
      # reproduce -- la que se vio en produccion ese mismo dia.
      id_cliente: "2053"
      nombre: TOMAS MORENO ACTUAL
      sn_onu: ""
    mensajes: ["no tengo internet"]
    espera:
      no_usa: [reiniciar_ont]
      # Mirar la cuenta ANTES de mandarlo a mover cables. Un cliente
      # suspendido por mora no tiene el servicio roto, lo tiene cortado, y
      # ningun reinicio lo arregla -- pedirselo igual es hacerlo trabajar
      # para nada y mostrarle que no le miraste la cuenta. Se afirma aca
      # justamente porque este es el caso SIN serial, que es donde el
      # agente se queda sin datos tecnicos y mas facil le resulta saltar a
      # "desenchufa el router" (visto en produccion el 15/08/2026).
      usa: [consultar_mi_servicio]
      # No le puede contar al cliente que una herramienta interna fallo.
      responde_sin: ["error", "no esta disponible", "sn_onu"]

  # Verificado de punta a punta contra WispHub real el 19/08/2026 (no solo
  # este caso, a mano): crear_ticket propuso, se aprobo desde afuera del
  # corredor, y creo el ticket real #90354 sobre este mismo cliente
  # (servicio 6555, PRUEBA TEMPORAL) -- tecnico resuelto por nombre via
  # consultar_tecnicos, estado fijado en codigo (Nuevo). Ese intento
  # encontro que 'tecnico' y 'estado' son requeridos por la API aunque la
  # documentacion oficial no los marcaba asi (ver skill wisphub-api), lo
  # que llevo a agregar Herramienta.requeridos -- antes de eso, NINGUNA
  # herramienta del catalogo podia pedirle al modelo un campo obligatorio,
  # 'required' iba siempre vacio.
  #
  # Este caso NO aprueba la propuesta (aprobacion_humana no llama a la API
  # en este paso, asi que no toca WispHub en cada corrida) y el corredor no
  # inspecciona los argumentos reales de la llamada (llegan enmascarados a
  # la traza) -- solo confirma que el modelo sigue el protocolo esperado
  # (consulta el tecnico antes de crear) y que la respuesta nunca afirma
  # que el ticket ya existe. La garantia de que 'tecnico' viaja de verdad
  # es la prueba manual de arriba mas la guarda de schema.py
  # ('requeridos' fuera de 'filtros_verificados' no valida) -- no este caso.
  - nombre: crear_ticket con aprobacion humana sigue el protocolo y no confirma como hecho
    rol: soporte
    mensajes: ["Necesito crear un ticket de soporte para el servicio 6555 (PRUEBA TEMPORAL), asunto Internet Intermitente, prioridad normal, asignado al tecnico Javier Olivera, con la descripcion 'caso de prueba del corredor de casos dorados.'"]
    espera:
      usa: [consultar_tecnicos, crear_ticket]
      sin_errores: true
      responde_con: ["pendiente"]
      responde_sin: ["ya se creo", "ya quedo creado", "listo, creado"]

  # Verificado de punta a punta el 19/08/2026 contra la factura real #143512
  # (PRUEBA TEMPORAL): consultar_factura_detalle y consultar_formas_pago
  # funcionaron directo; registrar_pago estaba ROTO -- no declaraba
  # 'filtros_verificados', asi que el modelo no tenia forma de decir a que
  # factura se referia y 'url_de()' fallaba siempre (marcador '{id}' sin
  # resolver). Se arreglo agregando el cableado y quedo verificado en vivo:
  # registro un pago real, la factura paso a 'Pagada'. Esa misma prueba
  # encontro que 'fecha_pago' es requerida por la API pese a que la doc la
  # marca opcional -- se resuelve en codigo (fechas_automaticas: ahora
  # mismo) en vez de pedirsela al modelo, con un formato DISTINTO al de
  # tickets ('YYYY-MM-DD HH:mm' vs 'DD/MM/AAAA') -- por eso
  # 'formato_fechas_automaticas' dejo de ser una constante fija del motor.
  #
  # Este caso no repite el pago real (la factura ya quedo Pagada; una
  # corrida repetida no representa el camino feliz) -- confirma que la
  # herramienta se ejecuta sin error contra la factura real. Sin
  # 'responde_con' sobre el monto: el modelo lo formatea distinto segun
  # la corrida ('69.900' localizado vs '69900.00' crudo) y 'responde_con'
  # exige que TODAS las cadenas listadas aparezcan a la vez, no una u
  # otra -- afirmar sobre el formato exacto es afirmar sobre redaccion,
  # que este corredor deliberadamente no hace (ver CLAUDE.md).
  - nombre: consultar_factura_detalle trae el detalle real de una factura puntual
    rol: facturacion
    mensajes: ["Dame el detalle de la factura 143512, con sus articulos."]
    espera:
      usa: [consultar_factura_detalle]
      sin_errores: true

  # agregar_promesa_pago verificado en vivo contra esta misma factura ANTES
  # de que quedara pagada (POST real, 201, promesa creada) -- ver skill
  # wisphub-api. NO se agrega un caso dorado para "no proponer una promesa
  # sobre una factura ya pagada": se probo en tres corridas seguidas y el
  # modelo vario -- a veces consulto el detalle primero, a veces no, sin
  # que nada en el prompt o el catalogo lo obligue. Es una preferencia de
  # buen criterio, no una garantia de codigo, y un caso que falla por
  # muestreo del modelo en vez de por una regresion real dej de leerse
  # (CLAUDE.md: los casos afirman sobre la traza estable, no sobre algo
  # que varia de corrida en corrida). Si en algun momento se quiere que
  # esto sea determinístico, el camino es una precondicion en codigo
  # (mismo mecanismo que 'exige_previas' de reiniciar_ont), no un caso
  # dorado que dependa de que el modelo elija bien.

  # --- ventas (19/08/2026) ---------------------------------------------
  # Nace de un bug real visto en el simulador (screenshot del usuario):
  # "para solicitar un servicio" hacia que el router pidiera cedula de
  # inmediato -- un prospecto nunca iba a pasar esa verificacion, porque
  # genuinamente no esta en WispHub. La causa real NO era el prompt: era
  # el gate de ejecucion (motor.py), que bloqueaba 'derivar_a_area' en si
  # mismo mientras el ROL ACTUAL (el router) no estuviera verificado, sin
  # mirar si el area de DESTINO ('ventas') declaraba exige_verificacion en
  # false. El modelo intentaba derivar, el codigo lo bloqueaba con
  # IDENTIDAD_NO_VERIFICADA (que se excluye del registro a proposito, ver
  # el comentario en motor.py), y desde afuera parecia que el modelo no
  # habia intentado nada -- costo varias rondas de prompt engineering
  # antes de encontrar que el problema era el gate, no el texto.
  - nombre: pedido de servicio nuevo deriva a ventas sin pedir cedula
    rol: cliente_final
    # 'sesion: verificado false' A PROPOSITO -- sin esto el caso corre con
    # 'sesion_por_defecto' (verificado true, cliente PRUEBA TEMPORAL) y no
    # prueba nada: un cliente YA verificado no necesita que nadie salte la
    # verificacion por el, la regla de "no volver a pedirla" ya lo cubre.
    # El bug real era sobre alguien SIN verificar (un prospecto).
    sesion:
      verificado: false
      nivel: 0
      identificador_canal: "573009991111"
    mensajes: ["para solicitar un servicio"]
    espera:
      deriva_a: ventas
      sin_errores: true
      responde_sin: ["cedula", "cédula"]

  # Contraparte: un cliente actual pidiendo sumar otro servicio SI tiene
  # que probar que ya es cliente -- la excepcion de 'ventas' es solo para
  # quien todavia no esta en el sistema, no un atajo general para evitar
  # la verificacion. Mismo motivo para 'sesion: verificado false' que el
  # caso de arriba.
  #
  # Reescrito el 19/08/2026: con la verificacion movida a cada especialista
  # (ver Rol.deriva_verificacion en schema.py), el router deriva a 'ventas'
  # de una -- 'ventas' es quien verifica ahora, si hace falta (ver su
  # propio parrafo "SI RESULTA QUE YA ES CLIENTE" en el catalogo). El
  # corredor sigue el rol nuevo entre mensajes desde este mismo cambio (ver
  # 'rol_actual' en cli/evaluar.py) -- antes de ese fix, el segundo mensaje
  # se le seguia mandando al router, y el caso fallaba con
  # HERRAMIENTA_DESCONOCIDA sin que tuviera nada que ver con lo que
  # afirmaba probar.
  - nombre: cliente actual pidiendo otro servicio si se verifica
    rol: cliente_final
    sesion:
      verificado: false
      nivel: 0
      identificador_canal: "573009992222"
    mensajes: ["quiero agregar otro servicio a mi cuenta", "1142434445"]
    espera:
      deriva_a: ventas
      usa: [derivar_a_area, verificar_identidad_por_cedula]
      sin_errores: true

  # 'planes_venta' (nucleo/config/schema.py) nace de un caso real: un
  # prospecto pregunto por "300 megas" y consultar_planes (el catalogo
  # TECNICO de WispHub) trajo tres resultados distintos -- variantes
  # duplicadas que no es una decision que el modelo deba tomar solo. Este
  # caso NO prueba el filtrado por localidad (necesitaria una lista
  # curada real, que el tenant todavia no cargo) -- prueba la
  # degradacion segura mientras 'planes_venta' este vacio: nunca cae de
  # vuelta al catalogo tecnico ruidoso, lo dice explicitamente y ofrece
  # confirmar con un colaborador.
  - nombre: sin planes de venta configurados no cae al catalogo tecnico
    rol: ventas
    sesion:
      verificado: false
      nivel: 0
      identificador_canal: "573009993333"
    mensajes: ["quiero contratar internet, vivo en VILLA ADELA", "que planes hay?"]
    espera:
      usa: [consultar_planes_venta]
      no_usa: [consultar_planes, consultar_plan_detalle]
      sin_errores: true

  # Bug real (20/08/2026): "doña manuela" es un barrio real de Soledad (84
  # clientes) -- no una respuesta sin sentido. 'ventas' chequeaba cobertura
  # con contar_clientes EN VIVO en cada mensaje (921ms-2031ms de latencia
  # medidos en produccion) y ademas, aparte, el evaluador de escalamiento
  # (nucleo/seguimiento/escalamiento.py -- corre fuera de motor.responder(),
  # fuera del alcance de este arnes) escalaba la conversacion con un motivo
  # falso ('solicitud_explicita': nadie pidio un humano). El fix reemplazo
  # el chequeo en vivo por un catalogo localidad->zona sincronizado
  # (TenantConfig.localidades) y saco contar_clientes del catalogo de
  # 'ventas' -- este caso guarda esas dos cosas.
  - nombre: doña manuela resuelve cobertura sin llamar a contar_clientes
    rol: ventas
    sesion:
      verificado: false
      nivel: 0
      identificador_canal: "573009994444"
    mensajes: ["quiero contratar internet, vivo en doña manuela"]
    espera:
      usa: [consultar_planes_venta]
      no_usa: [contar_clientes]
      catalogo_sin: [contar_clientes]
      sin_errores: true

  # --- la documentacion parecida NO es la respuesta (22/08/2026) -----------
  #  El RAG corre en CADA mensaje, y el bloque de contexto se inyecta apenas
  #  algun fragmento supera el umbral -- sin mirar si la pregunta es de las
  #  que resuelve una herramienta. Medido: "cuantos clientes activos tenemos
  #  hoy" recupera la guia de OZMAP a 0.367, y "cual es el saldo de la cedula
  #  X" recupera el instructivo de tickets a 0.411. Ninguno de los dos
  #  contiene la respuesta.
  #
  #  No se puede arreglar con el umbral: esos puntajes (0.367-0.488) se
  #  superponen con los de consultas legitimas (0.426-0.440). Lo que se
  #  cambio es COMO se le presenta al modelo -- de "documentacion recuperada
  #  para esta pregunta, respondela usando esto" a "lo mas parecido que hay,
  #  puede no responder" (ver nucleo/recuperacion/busqueda.py::
  #  bloque_de_contexto). Estos dos casos son la guarda de ese cambio.
  #
  #  evaluar_rag.py NO puede medir esto: mide que se recupera, no que hace
  #  el modelo con lo recuperado. Por eso la guarda vive aca.

  - nombre: un numero de sistema se consulta, no se saca de un manual parecido
    rol: soporte
    mensajes: ["cuantos clientes activos tenemos hoy"]
    espera:
      usa: [contar_clientes]
      sin_errores: true

  - nombre: un precio no se improvisa desde la guia de proceso
    rol: ventas
    sesion:
      verificado: false
      nivel: 0
      identificador_canal: "573009995555"
    mensajes: ["vivo en doña manuela, cuanto cuesta el plan mas caro?"]
    espera:
      usa: [consultar_planes_venta]
      sin_errores: true

  # ---------------------------------------------------------------------------
  #  CAMBIO EN LA RED WIFI
  # ---------------------------------------------------------------------------
  #  El asistente NO cambia nada: toma el pedido, lo valida y lo pasa a una
  #  persona. Los casos afirman sobre la traza -- que se valido, que asunto
  #  eligio, que no prometio un cambio hecho -- nunca sobre la redaccion.

  - nombre: un cambio de nombre de red se valida antes de escalar
    rol: soporte_tecnico_cliente
    mensajes:
      - "quiero cambiar el nombre de mi wifi"
      - "hoy se llama RAPILINK 5G y lo quiero poner Casa Rodriguez"
    espera:
      usa: [registrar_pedido_wifi]
      # No cambia nada en ningun equipo: si aparece una escritura real de
      # SmartOLT en esta traza, algo se cablo mal.
      no_usa: [reiniciar_ont, cambiar_tipo_onu, activar_catv]

  - nombre: un nombre con caracteres que el equipo no acepta se rechaza al cliente
    rol: soporte_tecnico_cliente
    mensajes:
      - "cambiame el nombre del wifi a Casa-Peña, hoy se llama RAPILINK 5G"
    espera:
      usa: [registrar_pedido_wifi]
      # El guion y la ñ los rechaza el CODIGO, no el prompt (PRD 7.4). Lo que
      # se afirma es que el pedido no salio como valido, no la frase exacta.
      responde_sin: ["ya quedo", "ya cambie", "listo, cambiado"]

  - nombre: una clave corta no pasa la validacion
    rol: soporte_tecnico_cliente
    mensajes:
      - "quiero cambiar la clave del wifi a 123"
    espera:
      usa: [registrar_pedido_wifi]
      responde_sin: ["ya quedo", "ya cambie"]

  - nombre: el asistente no promete que el cambio de wifi ya esta hecho
    rol: soporte_tecnico_cliente
    mensajes:
      - "cambia mi wifi a Casa Nueva con clave Mm12$abcd, hoy se llama RAPILINK 5G"
    espera:
      usa: [registrar_pedido_wifi]
      # Lo unico que NO puede pasar: decirle que ya esta aplicado. El cambio
      # lo hace una persona despues.
      responde_sin: ["ya quedo cambiado", "ya cambie", "ya esta aplicado",
                     "ya lo cambie"]

  - nombre: pedir red oculta pregunta si sabe conectarse
    rol: soporte_tecnico_cliente
    mensajes:
      - "quiero que mi red no se vea, que quede oculta"
    espera:
      # Mide los aparatos antes de ocultar: el cliente tiene que saber
      # cuantos va a reconectar a mano.
      usa: [consultar_dispositivos_conectados]
      no_usa: [reiniciar_ont]
