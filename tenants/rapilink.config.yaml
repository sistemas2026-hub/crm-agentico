# =============================================================================
#  RAPILINK S.A.S  -  configuracion del tenant
#  Primer despliegue. Sirve de caso de referencia para los demas ISP.
# =============================================================================
#  TODO lo especifico de esta empresa vive en este archivo. El codigo no la
#  conoce. Dar de alta otro ISP = copiar tenant.config.example.yaml, llenarlo
#  y correr el sondeo de API para generar la seccion 'herramientas'.
#
#  NINGUN SECRETO AQUI. Los campos '*_ref' son NOMBRES de variable de entorno
#  o de secreto en Vault. El validador rechaza el archivo si detecta un valor
#  con pinta de credencial.
# =============================================================================

version: 1

identidad:
  slug: rapilink
  nombre_legal: Rapilink S.A.S
  nombre_comercial: Rapilink
  sector: isp
  zona_horaria: America/Bogota
  idioma: es
  # Editado tambien desde Configuracion > Personalidad del asistente en
  # vivo -- este valor se sincronizo manualmente para que --exportar no lo
  # borre. Si se edita desde la interfaz, actualizar aca tambien a mano.
  descripcion: >
    Rapilink es un proveedor de internet (ISP). Ofrece planes de internet
    residencial solo, y tambien planes combo que incluyen internet +
    television. No se conocen otros servicios (telefonia, etc.) mas alla de
    estos dos.

marca:
  firma_mensajes: "Rapilink - Soporte"

persona:
  nombre_asistente: Dexter
  tono: cercano
  # Los tecnicos consultan desde el celular en campo (ver seccion 14 del
  # diseno). Respuestas largas en WhatsApp no se leen.
  longitud_respuesta: breve
  instrucciones_adicionales: >
    Responde en espanol, en tercera persona y sin tecnicismos innecesarios.
    Si un dato viene de una herramienta, repitelo LITERAL: no lo redondees,
    no lo reformules y no calcules sobre el.

# -----------------------------------------------------------------------------
#  GLOSARIO  -  para que el usuario y el manual hablen el mismo idioma
# -----------------------------------------------------------------------------
#  Sin esto, "no me llega internet" no recupera el fragmento que dice
#  "perdida de senal optica", que es donde esta el procedimiento.
glosario:
  - termino_canonico: ONT
    sinonimos: [modem optico, roseta, equipo del cliente, terminal, ont, onu]
  - termino_canonico: perdida de senal optica
    sinonimos: [no llega internet, sin internet, se cayo el servicio, luz roja, los, senal perdida]
  - termino_canonico: cable drop
    sinonimos: [cable de acometida, fibra del poste, acometida]
  - termino_canonico: suspension por mora
    sinonimos: [me cortaron, esta cortado, suspendido, sin servicio por pago]
  - termino_canonico: red WiFi del cliente
    sinonimos: [clave del wifi, contrasena wifi, ssid, nombre de la red]

# -----------------------------------------------------------------------------
#  ROLES  -  lista BLANCA de campos, nunca lista negra
# -----------------------------------------------------------------------------
#  Un campo sin entrada explicita NO se entrega. El registro de cliente de
#  WispHub trae 54 campos, incluidas cuatro contrasenas y las coordenadas GPS
#  del domicilio: con lista negra, un campo nuevo del proveedor quedaria
#  expuesto por defecto.
roles:

  soporte:
    descripcion: |
      Atiende a un colaborador interno (nunca al cliente directo), revisa
      estado de clientes y tickets.

      Ademas, funciona como el orquestador de visitas tecnicas: cuando un
      colaborador te confirma que ya reviso en la central y una falla de
      TV en canales especificos es PUNTUAL (solo de un cliente, no
      explicada por cableado, splitter, ni exceso de TV sobre el maximo
      recomendado), llama a 'agendar_visita_tecnica' para crear el ticket.

      Reglas para usar 'agendar_visita_tecnica' -- son estrictas porque
      agenda una visita real, con costo y logistica, sin ningun paso de
      confirmacion despues tuyo:
      - Nunca la llames solo porque un cliente pide una visita, ni porque
        alguien pregunta "se puede agendar". Solo cuando el mensaje del
        colaborador indica una CONFIRMACION ya hecha (revisada la central,
        descartadas las causas del lado del cliente).
      - Necesitas el cliente identificado (id_servicio o cedula -- si solo
        te dan la cedula, usa consultar_cliente_por_cedula primero para
        resolver el id_servicio) y una descripcion clara del caso: que
        canales estan afectados (por NOMBRE, nunca numero) y que se validó
        antes de escalar.
      - Si falta alguno de esos datos, pedilo antes de llamar a la
        herramienta -- no la llames con informacion incompleta ni
        inventada.
      - Despues de crear el ticket, confirmale al colaborador el numero
        (id_ticket) para que quede como referencia.
    area: Atención al Cliente
    cargo: Agente de Soporte
    puede_consultar: [consultar_cliente, consultar_cliente_por_cedula, consultar_ticket,
          consultar_tickets_de_cliente, contar_tickets, contar_clientes, consultar_casos_bottlecrm,
          agendar_visita_tecnica]
    campos_permitidos:
      consultar_cliente: [id_servicio, nombre, cedula, estado, email, telefono, direccion, localidad,
        ciudad, plan_internet, zona, fecha_instalacion, estado_facturas, saldo, fecha_corte]
      consultar_cliente_por_cedula: [id_servicio, nombre, cedula, estado, email, telefono, direccion,
        localidad, ciudad, plan_internet, zona, fecha_instalacion, estado_facturas, saldo, 
            fecha_corte]
      # BottleCRM: nombres reales verificados en vivo (ver skill bottlecrm-api),
      # no los que sugeriria la doc. 'account'/'assigned_to'/'tags' completos
      # NO se listan -- son objetos pesados con datos de cuenta que nadie pidio;
      # 'account.name' alcanza para identificar de que cliente es el caso.
      consultar_casos_bottlecrm: [id, name, status, priority, case_type, description, created_at, 
            closed_on, account.name]
      consultar_ticket: [id_ticket, asunto, descripcion, razon_falla, estado, prioridad, tecnico, 
            departamento, origen_reporte, fecha_creacion, fecha_inicio, fecha_fin, 
            servicio.id_servicio, servicio.plan_internet, servicio.zona]
      consultar_tickets_de_cliente: [id_ticket, asunto, estado, prioridad, tecnico, fecha_creacion]
      contar_tickets: [total, desglose, interpretacion, advertencia]
      contar_clientes: [total, desglose, interpretacion, advertencia]
      # Sin 'servicio' completo (mismo motivo que consultar_ticket): trae el
      # registro del cliente entero. 'servicio.id_servicio' alcanza para
      # confirmar a quien se le agendo.
      agendar_visita_tecnica: [id_ticket, asunto, estado, prioridad, tecnico, departamento,
            fecha_creacion, servicio.id_servicio]
    nunca_revelar: [password_servicio, password_cpe, password_router_wifi, password_ssid_router_wifi,
      usuario_router_wifi, coordenadas]

  facturacion:
    descripcion: Revisa facturas, saldos y registra pagos.
    area: Facturación
    cargo: Agente de Facturación
    puede_consultar: [consultar_cliente, consultar_cliente_por_cedula, consultar_facturas, 
          registrar_pago, contar_facturas, contar_clientes]
    campos_permitidos:
      # Sin datos de red ni tickets: no hacen a su trabajo.
      consultar_cliente: [id_servicio, nombre, cedula, estado, email, telefono, direccion, localidad,
        ciudad, estado_facturas, saldo, fecha_corte, plan_internet]
      consultar_cliente_por_cedula: [id_servicio, nombre, cedula, estado, email, telefono, 
            estado_facturas, saldo, fecha_corte, plan_internet]
      consultar_facturas: [id_factura, estado, total, saldo, fecha_emision, fecha_vencimiento, 
            fecha_pago]
      registrar_pago: [resultado, id_factura, total_cobrado, mensajes, messages, task_id, errors]
      contar_facturas: [total, desglose, interpretacion, advertencia]
      contar_clientes: [total, desglose, interpretacion, advertencia]
    nunca_revelar: [password_servicio, password_cpe, password_router_wifi, password_ssid_router_wifi,
      ip, mac_cpe]

  administracion:
    descripcion: Consultas consolidadas, sin datos personales.
    area: Administración
    cargo: Analista
    # 'consultar_ticket' agregado desde la interfaz (Agentes) -- sincronizado
    # aca para que este archivo no lo pise en el proximo cargar_config.py.
    puede_consultar: [consultar_cliente, consultar_tickets_de_cliente, contar_clientes,
          contar_facturas, contar_tickets, informe_materiales, consultar_ticket]
    campos_permitidos:
      # Sin PII: ni cedula, ni contacto. Ve estado y servicio.
      consultar_cliente: [id_servicio, nombre, estado, plan_internet, zona, fecha_instalacion,
            estado_facturas]
      consultar_tickets_de_cliente: [id_ticket, asunto, estado, prioridad, tecnico, fecha_creacion]
      contar_clientes: [total, desglose, interpretacion, advertencia]
      contar_facturas: [total, desglose, interpretacion, advertencia]
      contar_tickets: [total, desglose, interpretacion, advertencia]
      informe_materiales: [periodo, totales, tickets_cerrados, con_registro_de_material,
            registros_en_cero, cobertura_por_categoria, sin_normalizar, interpretacion, advertencia]
      consultar_ticket: [asunto, fecha_inicio, servicio.id_servicio, departamento,
            servicio.plan_internet, descripcion, origen_reporte, estado, prioridad,
            servicio.zona, fecha_creacion, razon_falla, tecnico, fecha_fin, id_ticket]
    nunca_revelar: [cedula, email, telefono, direccion, coordenadas, saldo]

  cliente_final:
    area: Atención al Cliente
    cargo: Recepcionista Virtual
    descripcion: |
      El suscriptor, por WhatsApp. Solo ve SU propio servicio.

      Tono: cercano, como espera el cliente en WhatsApp (tuteo, sin "usted").
      Los guiones institucionales son una base -- se adaptan con naturalidad
      en cada respuesta, nunca se repiten igual palabra por palabra (protocolo
      de atencion al cliente de la empresa, S7 y S9).

      Frases a evitar y su alternativa (protocolo real de la empresa, S7):
      - Nunca "no se puede" -> decir que SI se puede hacer.
      - Nunca "no se" -> "dejame confirmar eso y te digo".
      - Nunca "calmate" en seco ante un reclamo -> "entiendo, lo resolvemos".
      - Nunca "espera" sin explicar por que -> "dejame revisar tu cuenta un momento".

      Lo que resolves VOS, al instante (protocolo de atencion al cliente, S6):
      consultas de saldo, estado de factura y estado del servicio. Tambien un
      primer diagnostico cuando el cliente dice que no tiene internet o
      perdio la señal: usa ping_cliente y segui su protocolo (si responde,
      la causa no es de red -- revisa plan/facturacion o escala para
      revision mas profunda; si no responde o responde poco, guialo con las
      luces del router y un reinicio de 30 segundos, siguiendo el
      protocolo de esa herramienta).

      Una factura PENDIENTE no corta el servicio por si sola: solo lo afecta
      a partir de la FECHA DE CORTE. Compara esa fecha con la de hoy antes de
      mencionarla. Si el corte todavia no llego, decilo asi ("tenes una
      factura pendiente, con corte el X, o sea que todavia no te afecta el
      servicio") y segui buscando la causa por otro lado. Nunca insinues que
      una deuda esta limitando el servicio cuando la fecha de corte es
      futura: es falso y el cliente lo sabe.

      Lo que NO resolves y derivas a un colaborador humano: si despues de
      usar ping_cliente y el reinicio de 30 segundos el cliente sigue sin
      servicio, deriva. Tambien derivas siempre traslados, reconexion,
      instalaciones nuevas, reclamos formales, y cambio de contrasena (el
      protocolo dice que esto se resuelve al instante, pero todavia no
      existe esa herramienta aqui -- hasta que exista, se deriva). Al
      derivar, decile al cliente que un colaborador humano sigue el caso.

      Verificacion de identidad: normalmente ya queda resuelta por el numero
      de WhatsApp desde el que escribe (no tenes que pedir nada). Si el
      sistema todavia no lo verifico, pedile su NUMERO DE CEDULA (no el ID de
      servicio, eso no lo sabe la mayoria de los clientes) y llama a
      verificar_identidad_por_cedula con ese dato. Si te dice que es
      ambiguo, pedile ademas su nombre completo o direccion para descartar.

      La cedula sola NO verifica todavia -- es un chequeo en dos pasos.
      Cuando verificar_identidad_por_cedula encuentra un unico cliente, te
      devuelve 'nombre_a_confirmar': decile al cliente que el servicio
      figura a nombre de esa persona y pregunta si es el/ella. NUNCA
      reveles ningun otro dato en ese momento (ni estado, ni saldo, ni
      nada). Cuando responda, llama a confirmar_identidad con
      confirma=true (dijo que si) o confirma=false (dijo que no, puede ser
      una cedula mal tipeada -- pedisela de nuevo). Recien despues de un
      confirma=true el cliente queda verificado de verdad.
    orientado_a: cliente_final
    puede_consultar: [consultar_mi_servicio, verificar_identidad_por_cedula,
          confirmar_identidad, ping_cliente]
    campos_permitidos:
      # Lo minimo para autoservicio. El id_cliente NO lo propone el modelo:
      # lo inyecta el codigo desde la sesion autenticada.
      consultar_mi_servicio: [estado, plan_internet, estado_facturas, saldo, fecha_corte,
            ssid_router_wifi]
      # 'ping-N' (N=1..pings, ver argumentos_fijos de la herramienta) y
      # 'ping-exitoso' son las claves reales que devuelve WispHub -- no hay
      # forma de agruparlas bajo un nombre generico sin perder la lista
      # blanca por campo (ver nucleo/seguridad/listas_blancas.py). 'host' es
      # la MAC del equipo, no un dato de contacto -- se deja pasar porque
      # ayuda a confirmar que respondio el equipo correcto.
      ping_cliente: ["ping-1", "ping-2", "ping-3", "ping-exitoso"]
    nunca_revelar: [password_servicio, password_cpe, password_router_wifi, usuario_router_wifi,
          cedula, direccion, coordenadas, ip, mac_cpe, sn_onu, sectorial, router.nombre]

# -----------------------------------------------------------------------------
#  SEGURIDAD
# -----------------------------------------------------------------------------
seguridad:
  reglas_absolutas:
    - "Las credenciales de administrador de la ONT NUNCA se comparten con un cliente final. Al cliente
      solo se le entrega la contrasena de SU red WiFi."
    - "Nunca inventar direcciones IP, VLAN, credenciales, procedimientos ni valores numericos. Si el dato
      no esta en el contexto, decirlo."
    - "Un dato que viene de una herramienta se muestra literal: no se reformula, no se redondea y no se
      calcula sobre el."
    - "Nunca entregar datos de un cliente a quien no ha sido verificado como titular de ese servicio."
    - "Nunca prometer plazos, descuentos o beneficios que no esten confirmados por el area correspondiente
      (protocolo de atencion al cliente, S6)."
  # 0 ninguno / 1 posesion del canal / 2 reto adicional / 3 humano
  requiere_verificacion:
    estado_red_general: 0
    procedimiento_documental: 0
    estado_servicio: 1
    saldo: 1
    factura: 1
    clave_wifi: 1
    datos_contrato: 2
    registrar_pago: 3
    cambio_datos: 3

autenticacion:
  campo_identidad: telefono
  # El campo 'telefono' de WispHub guarda VARIOS numeros en uno solo en el 55%
  # de los casos. Medido sobre 600 clientes: extrayendo todos los moviles la
  # cobertura es 98.7%; leyendolo como valor unico, 43%.
  patron_extraccion: '(?<!\d)3\d{9}(?!\d)'
  # Para cuando el numero no coincide (celular nuevo). Ninguno es publico:
  # la cedula NO sirve como reto porque esta en la factura y el contrato.
  retos_nivel_2:
    - monto de la ultima factura
    - fecha del ultimo pago
    - nombre del plan contratado
  # Medido: solo el 0.4% de los numeros apunta a mas de un cliente. No es
  # fallo de autenticacion, es que hay que preguntar cual servicio.
  desambiguar_si_multiple: true
  ofrecer_actualizar_numero: true

# -----------------------------------------------------------------------------
#  CORPUS
# -----------------------------------------------------------------------------
corpus:
  reportar_defectos: true

  # Fuera del corpus. Lleva credenciales en el propio titulo: vectorizarlo
  # permitiria que el asistente las recuperara y se las mostrara a quien
  # pregunte, incluido un cliente final por WhatsApp. Choca de frente con la
  # regla absoluta de seguridad declarada mas abajo.
  excluir:
    - "*Contraseñas*"

  # Versiones superadas del mismo procedimiento. Se cargan marcadas como
  # obsoletas: no se recuperan en las busquedas, pero queda constancia de que
  # existieron y de con cual se respondio en su momento. La vigente es
  # 'Procedimiento_Soporte_Tecnico_V2 (Final).docx'.
  obsoletos:
    - "Procedimiento de Soporte Técnico V1 OLD.docx"
    - "Procedimiento_Soporte_Tecnico_V2.docx"

  # RESPALDO de roles, para los documentos que todavia no declaran la columna
  # 'roles' en su tabla de metadatos. Si el .docx la trae, esa manda y esto ni
  # se mira -- ver Corpus.roles_por_defecto en nucleo/config/schema.py.
  #
  # Hoy hace falta para los 19: 12 tienen tabla sin columna de roles y 7 no
  # tienen tabla. Sin esto, una recarga los deja a todos sin roles, o sea
  # invisibles para el asistente.
  #
  # Ninguno va a 'cliente_final': son guias tecnicas operativas,
  # procedimientos internos y perfiles de cargo de RRHH. El dia que Rapilink
  # arme material de cara al cliente (FAQ, instructivos de auto-gestion), ese
  # si lleva cliente_final -- preferentemente declarandolo en el documento.
  # Todos los colaboradores, que es como venia funcionando: hasta ahora la
  # audiencia era binaria (interno / cliente) y cualquier colaborador veia
  # todo el corpus. Acotarlo por area es posible desde que existe
  # roles_permitidos, pero es una decision de politica de informacion de la
  # empresa y no se toma desde aca: sacarle a facturacion las guias que hoy
  # puede leer es un cambio que alguien tiene que querer.
  #
  # Cuando se quiera afinar, esto es lo que hay que editar (o mejor: declarar
  # la columna 'roles' dentro del propio documento, que es donde manda).
  # 'cliente_final' NO aparece en ninguna linea: son guias tecnicas
  # operativas, procedimientos internos y perfiles de cargo de RRHH.
  roles_por_defecto:
    "G-GO-*": [soporte, facturacion, administracion]
    "Gu*a para la*": [soporte, facturacion, administracion]
    "Instructivo de Gestion*": [soporte, facturacion, administracion]
    "Procedimiento_Soporte_Tecnico*": [soporte, facturacion, administracion]
    "Auxiliar de Redes*": [soporte, facturacion, administracion]
    "T*cnico de Redes*": [soporte, facturacion, administracion]

  # Como esta maquetada la documentacion de ESTA empresa. Verificado sobre 19
  # documentos reales, donde conviven tres plantillas distintas:
  #   G-GO-04..13        secciones con Heading 2 + tabla Codigo|Version
  #   Procedimiento V2   secciones dentro de tablas de una celda, 0 estilos
  #   Perfiles y Guias   Heading 1 + List Paragraph, prosa y listas
  # Otra empresa describe la suya aqui y el motor no se toca.
  perfil_documento:
    marcas_callout: ["⚠", "📝", "ℹ", "ATENCIÓN", "NOTA", "IMPORTANTE"]
    encabezados_pie: ["REGISTRO DE CAMBIOS", "APROBACIÓN", "ELABORADO"]
    campos_metadatos: [Código, Versión, Fecha]
    # 'Procedimiento V2' pone '1 OBJETIVO' dentro de una tabla de una celda.
    titulo_un_nivel_en_tabla: true
    # Sin esto, cada paso de una lista numerada ('3. Abre un navegador') se
    # tomaba como titulo de seccion: rompia el procedimiento en secciones
    # falsas y se tragaba las referencias cruzadas de esos pasos.
    exigir_multinivel_sin_estilo: true
    # 'seccion_vacia' queda fuera: dio 26 falsos positivos y 0 aciertos, porque
    # estas plantillas usan estilo de titulo para lineas que YA son el contenido
    # ("4.3 Procurar el cuidado integral de su salud.").
    defectos_a_reportar: [numeracion_duplicada, referencia_rota]
    anotar_imagenes: true

  tipos_documento:
    - tipo: guia_tecnica
      estrategia_chunking: por_seccion
      # Una tabla que mapea servidores a VLAN y segmentos IP es inutil si se
      # parte a la mitad.
      preservar_tablas: true
      tamano_objetivo_tokens: 500
      metadatos_dominio: [marca_equipo, tipo_procedimiento, servidor]
    - tipo: politica
      estrategia_chunking: por_seccion
      preservar_tablas: true
      tamano_objetivo_tokens: 700
      metadatos_dominio: [area]

rag:
  # text-embedding-3-large de OpenAI, no Ollama: el VPS no tiene recursos de
  # sobra para correr un modelo local ademas de todo lo demas (agosto 2026).
  # Pedido con dimensions=1024 (nucleo/recuperacion/embeddings.py) -- MISMA
  # dimension que bge-m3, a proposito, para no migrar la columna ademas de
  # re-vectorizar. Cambiar 'modelo_embeddings' sin re-vectorizar el corpus deja
  # vectores no comparables: la busqueda no falla, devuelve peor en silencio.
  modelo_embeddings: text-embedding-3-large
  # Coincide con vector(1024) del esquema SQL. Cambiarlo (a otro que no sea
  # 1024) obliga a migrar la columna, ademas de re-vectorizar todo el corpus.
  dimensiones: 1024
  top_k: 8
  umbral_similitud: 0.35
  busqueda_hibrida: true
  rrf_k: 60
  expandir_con_glosario: true
  # Si nada supera el umbral NO se llama al modelo: se responde esto y se
  # registra en unanswered_queries.
  mensaje_sin_resultados: >
    No encontre eso en la documentacion disponible. Lo estoy registrando para
    que lo revisen. Si es urgente, te paso con un companero.

# -----------------------------------------------------------------------------
#  MODELOS  -  medido con banco_pruebas.py, agosto 2026
# -----------------------------------------------------------------------------
#  modelo                    herram   args  respeta  inventa  RF-15  tok/s  s/turno  US$/1k
#  qwen3:30b-a3b-q4_K_M       100%   100%    100%       0     100%   11.2    42.6      0.00
#  deepseek:deepseek-v4-flash 100%   100%   66.7%*      0     100%   69.7     4.7      0.24
#  qwen3:4b                   100%   100%    100%       0     100%   52.0    51.8      0.00
#  phi4-mini                 12.5%  12.5%    100%       0     100%   57.9     3.1      0.00
#  gemma3:4b                  NO USAR: ignora el dato de la herramienta y lo inventa
#
#  * muestra de 3 casos: no es un veredicto, ver evaluacion.minimo_casos abajo.
#    Verificado por streaming (cli/prueba_velocidad.py) contra la misma tarea
#    de produccion: modelo local en caliente, ~22s hasta la primera palabra
#    (7.6 tok/s); DeepSeek, ~8s (115 tok/s). Calidad de texto equivalente.
llm:
  # DeepSeek tambien POR DEFECTO, no solo por override (agosto 2026). Antes el
  # default era el modelo local y los overrides por rol eran la excepcion que
  # salia a la nube; ya no hay modelo local en ningun lado -- se saco el
  # contenedor de Ollama del VPS al pasar los embeddings a OpenAI, y era su
  # unico consumidor.
  #
  # Dejarlo apuntando al local era una mina: cualquier rol SIN override
  # explicito caia ahi y el turno moria con 'model requires more system
  # memory'. Paso de verdad con el rol fusionado de un colaborador
  # (nucleo/config/fusion.py), que por nombre no matcheaba ningun override.
  #
  # La base legal es la misma que ya cubria los overrides: la autorizacion de
  # tratamiento que firma el cliente cubre transferencia internacional (Ley
  # 1581 art. 26, ver PRD RNF-01). Lo que cambia es que el local ya no es el
  # resguardo -- no hay resguardo, y por eso conviene que este escrito.
  modelo_por_defecto: deepseek:deepseek-v4-flash
  modelo_informes: deepseek:deepseek-v4-flash
  temperatura: 0.1
  max_tokens: 1024
  # Cada iteracion cuesta un TURNO COMPLETO (~43 s local, ~5 s API), no
  # milisegundos.
  limite_iteraciones_agente: 4
  # El razonamiento se descarta del historial: reenviarlo acumula 2.500-5.400
  # caracteres inutiles por turno.
  descartar_thinking: true
  # Solo lo que se APARTA del default de arriba. Los cuatro roles reales ya no
  # figuran aca: todos usaban deepseek-v4-flash, que ahora es el default, asi
  # que repetirlos era ruido que se desincroniza en el primer cambio.
  #
  # (La base legal para que roles con PII -soporte, facturacion,
  # cliente_final- salgan a una API externa esta explicada arriba, junto al
  # modelo por defecto, que es donde manda ahora.)
  overrides:
    # 'rol:supervisor' es una clave VIRTUAL (nucleo/seguimiento/supervisor.py):
    # no es un rol real, no aparece arriba en 'roles'. Revisa cada conversacion
    # cerrada en segundo plano -- sin la urgencia de latencia de responderle a
    # un cliente en vivo -- asi que va a Claude en vez de DeepSeek, para que
    # el juicio de "fue un buen ejemplo" sea lo mas confiable posible. En
    # prueba con Sonnet 5 (mas barato que Opus 5) ahora que la revision se
    # apoya en el manual real via RAG y no solo en el criterio del modelo.
    'rol:supervisor': anthropic:claude-sonnet-5
  # Si algun rol necesitara quedarse en un modelo local (ej. si se restringe
  # la autorizacion mas adelante), se le agrega su linea aqui -- pero hoy NO
  # hay modelo local corriendo en ningun lado, asi que primero habria que
  # volver a levantar ese servicio.

# -----------------------------------------------------------------------------
#  HERRAMIENTAS
# -----------------------------------------------------------------------------
#  Los filtros de la seccion 'agregado' estan VERIFICADOS contra la API en
#  produccion con el metodo del valor imposible: se consulta con un valor que
#  no puede existir y se compara el total con el de la consulta sin filtro. Si
#  coinciden, la API esta IGNORANDO el parametro y no entra al catalogo.
#
#  Un filtro ignorado no da error: devuelve el universo entero disfrazado de
#  respuesta exacta. Por eso los ignorados se listan aparte y se RECHAZAN con
#  su motivo, en vez de intentarse.
herramientas:

  - nombre: consultar_cliente
    tipo: http
    descripcion: Datos de un cliente por su ID de servicio.
    solo_lectura: true
    roles_permitidos: [soporte, facturacion, administracion]
    base_url: https://api.wisphub.io
    endpoint: /api/clientes/
    metodo: GET
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key
    # BUG encontrado en vivo (agosto 2026): esta herramienta nunca tuvo
    # filtro -- el modelo no tenia como decirle CUAL cliente, asi que
    # devolvia la coleccion entera sin filtrar. Verificado que
    # ?id_servicio=N funciona (count=1 contra un cliente real).
    filtros_verificados:
      id_servicio:
        param: id_servicio
        tipo: id
        verificado_el: 2026-08-12

  - nombre: consultar_cliente_por_cedula
    tipo: http
    descripcion: Datos de un cliente por su cedula.
    solo_lectura: true
    roles_permitidos: [soporte, facturacion]
    base_url: https://api.wisphub.io
    endpoint: /api/clientes/
    metodo: GET
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key
    # Mismo bug que consultar_cliente -- sin filtro, nunca busco de verdad
    # por cedula. Verificado en vivo: ?cedula=N funciona (count=1).
    filtros_verificados:
      cedula:
        param: cedula
        tipo: id
        verificado_el: 2026-08-12

  - nombre: consultar_mi_servicio
    tipo: http
    descripcion: >
      Estado del servicio del cliente autenticado. El id_cliente NO viaja como
      argumento del modelo: lo inyecta el codigo desde la sesion. Si viniera
      del modelo, una inyeccion de prompt bastaria para pedir el de otro.
    solo_lectura: true
    roles_permitidos: [cliente_final]
    base_url: https://api.wisphub.io
    endpoint: /api/clientes/
    metodo: GET
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key
    inyectar_sesion:
      id_servicio: id_cliente

  - nombre: verificar_identidad_por_cedula
    tipo: http
    descripcion: >
      Primer paso de la verificacion (no el unico -- ver confirmar_identidad)
      por numero de cedula, cuando el numero de WhatsApp no alcanzo para
      verificarlo solo. Filtro verificado contra la API real (metodo del
      valor imposible, agosto 2026 -- ver .claude/skills/wisphub-api/SKILL.md).
      NUNCA devuelve datos del cliente: solo el nombre a confirmar, o si
      quedo ambiguo o no encontrado.
    solo_lectura: true
    roles_permitidos: [cliente_final]
    verifica_identidad: true
    campo_busqueda: cedula
    base_url: https://api.wisphub.io
    endpoint: /api/clientes/
    metodo: GET
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key

  - nombre: confirmar_identidad
    tipo: interno
    descripcion: >
      Segundo y ultimo paso de la verificacion. Llamala DESPUES de que el
      cliente responda si el nombre que le leiste (nombre_a_confirmar, de
      verificar_identidad_por_cedula) es el suyo. No llama a ninguna API --
      solo cierra (o descarta) la verificacion pendiente.
    solo_lectura: true
    roles_permitidos: [cliente_final]
    confirma_identidad: true

  - nombre: ping_cliente
    tipo: http
    asincrona: true
    descripcion: >
      Ping en tiempo real al equipo del cliente autenticado, via WispHub --
      confirma si hay comunicacion real con la red, mas alla de lo que diga
      el estado de facturacion. Verificado en vivo (agosto 2026, cliente de
      prueba id_servicio=5832): responde en pocos segundos, 3 intentos.

      Si 'ping-exitoso' dice que todos respondieron: el corte NO es de
      conectividad a nivel de red -- no sugieras reiniciar el router por eso,
      la causa es otra (revisar plan/facturacion, o escalar para revision
      mas profunda). Si no responde ninguno o la mayoria: segui el
      procedimiento del manual (luces del router, reinicio de 30 segundos,
      escalar si persiste).
    solo_lectura: true
    roles_permitidos: [cliente_final]
    # base_url incluye '/api' a proposito (a diferencia del resto de
    # herramientas de WispHub en este archivo, que lo ponen en 'endpoint'):
    # ejecutar_asincrono() arma la URL de la tarea como base_url + '/tasks/
    # {id}/', y esta es la unica herramienta asincrona hoy -- que quede
    # autocontenida evita tener que inventar un campo de configuracion
    # nuevo para un solo caso.
    base_url: https://api.wisphub.io/api
    endpoint: /clientes/{id_servicio}/ping/
    metodo: POST
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key
    # Fijos, nunca decididos por el modelo (ver argumentos_fijos en
    # schema.py).
    #
    # arp_ping en FALSE. Estuvo en true, y rompia el diagnostico de cualquier
    # cliente sin 'interfaz_lan' -- que son muchos: ese campo vacio es NORMAL,
    # se llena en un paso posterior de sincronizacion del router (ver la skill
    # wisphub-api, verificado contra 15 clientes reales).
    #
    # Y no fallaba de frente, que hubiera sido preferible. Medido contra la
    # API el 14/08/2026 sobre id_servicio=6580:
    #
    #   arp_ping=true  sin interfaz -> HTTP 202, tarea SUCCESS, y de resultado
    #                                  el texto 'Error "failure: interface
    #                                  needs to be specified for arp ping"'.
    #   arp_ping=false sin interfaz -> el ping real: received 1,
    #                                  packet-loss 0, avg-rtt 1ms401us.
    #
    # Un error con forma de exito, que el modelo tenia que interpretar solo.
    # Lo que se pierde: arp_ping alcanza equipos detras de un firewall, y sin
    # el esos figuran como que no responden. Es un falso negativo acotado y
    # visible; lo otro era basura silenciosa.
    argumentos_fijos:
      pings: 3
      arp_ping: false
    inyectar_sesion:
      id_servicio: id_cliente
      interfaz: interfaz_lan

  - nombre: agendar_visita_tecnica
    tipo: http
    multipart: true
    descripcion: >
      Agenda una visita tecnica real en WispHub (crea un ticket) -- se
      ejecuta de inmediato, SIN ningun paso de confirmacion humana despues
      de la llamada, asi que la decision de llamarla o no es toda tuya.

      Solo la usas cuando el colaborador que te escribe ya CONFIRMO
      (reviso la central) que una falla puntual de TV en canales
      especificos no se explica por causas del lado del cliente (cableado,
      exceso de TV sobre el splitter, etc. -- ver seccion 5.11 del
      manual). Nunca la llames porque el cliente final lo pida directo, ni
      porque alguien pregunte "se puede agendar" sin haber confirmado
      nada -- eso es una pregunta, no una confirmacion.

      Argumentos que proponés: 'servicio' (id_servicio del cliente -- si
      solo tenés la cedula, resolvela primero con
      consultar_cliente_por_cedula) y 'descripcion' (canales afectados por
      NOMBRE, nunca numero, y que se valido antes de escalar). Si falta
      alguno, pedilo antes de llamar -- nunca inventes ni completes a
      medias. El resto (tecnico, prioridad, departamento, asunto) queda
      fijo, siempre el mismo tecnico y asunto 'Problemas De Tv'.
    solo_lectura: false
    # Lo exige el validador (toda escritura lo necesita) pero hoy no hace
    # nada en el codigo -- ningun paso del motor lo lee todavia (ver
    # nucleo/modelo/motor.py). En la practica la herramienta ya es
    # autonoma: se ejecuta apenas el modelo la llama, sin ningun paso
    # extra. La "confirmacion" real pasa por la conversacion (el
    # colaborador ya reviso la central antes de escribirle al agente), no
    # por este flag. Decision explicita, agosto 2026 -- no reactivar el
    # gate sin discutirlo, afecta a todo el catalogo de escritura.
    requiere_confirmacion: true
    roles_permitidos: [soporte]
    base_url: https://api.wisphub.io
    endpoint: /api/tickets/
    metodo: POST
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key
    # Verificado en vivo (agosto 2026, tickets de prueba 89721/89724 sobre
    # id_servicio=5832): esta API exige multipart/form-data -- JSON da 500
    # (opaco, sin motivo), form-urlencoded da 415. 'asuntos_default' tiene
    # que ser IGUAL a 'asunto' (lo exige la propia API, no es redundancia
    # nuestra); 'estado'/'prioridad' van como CODIGO NUMERICO en texto
    # (1=Nuevo, prioridad 2=Normal), no como la palabra que se ve al leer
    # ("Nuevo"/"Normal" fallan la validacion).
    argumentos_fijos:
      tecnico: "1428053"                          # Mario Vasquez / sistemas@rapilink-sas
      email_tecnico: mario.vasquez.moreno@gmail.com
      asunto: Problemas De Tv
      asuntos_default: Problemas De Tv
      estado: "1"                                 # Nuevo
      prioridad: "2"                               # Normal
      departamento: Soporte Técnico
      departamentos_default: Soporte Técnico
      origen_reporte: oficina
    # fecha_inicio = el momento real de creacion; fecha_final = el plazo de
    # resolucion para este tipo de ticket. Se calculan en motor.py, nunca
    # fijas en este archivo (quedarian congeladas en la fecha de hoy). El
    # '3' de fecha_final se edita desde Configuracion > Personalidad del
    # asistente > Plazos de tickets -- no hace falta tocar este archivo
    # para cambiarlo.
    fechas_automaticas:
      fecha_inicio: 0
      fecha_final: 3
    # Reusa 'filtros_verificados' (igual que las herramientas de solo
    # lectura) para los DOS valores que si varian por llamada -- el
    # ejecutor no distingue "filtro de busqueda" de "campo de un POST", solo
    # traduce clave del modelo -> param real.
    filtros_verificados:
      servicio:
        param: servicio
        tipo: id
        verificado_el: 2026-08-12
      descripcion:
        param: descripcion
        tipo: texto
        verificado_el: 2026-08-12

  - nombre: consultar_ticket
    tipo: http
    solo_lectura: true
    roles_permitidos: [soporte]
    base_url: https://api.wisphub.io
    endpoint: /api/tickets/
    metodo: GET
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key

  - nombre: consultar_tickets_de_cliente
    tipo: http
    descripcion: >
      La API de tickets NO filtra por cliente (probados 8 nombres de parametro,
      todos ignorados). Se filtra por estado y se cruza por cliente en codigo,
      solo sobre los abiertos.
    solo_lectura: true
    roles_permitidos: [soporte, administracion]
    base_url: https://api.wisphub.io
    endpoint: /api/tickets/
    metodo: GET
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key

  - nombre: consultar_facturas
    tipo: http
    solo_lectura: true
    roles_permitidos: [facturacion]
    base_url: https://api.wisphub.io
    endpoint: /api/facturas/
    metodo: GET
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key

  - nombre: registrar_pago
    tipo: http
    descripcion: ACCION SENSIBLE. Registra un pago sobre una factura.
    solo_lectura: false
    requiere_confirmacion: true
    roles_permitidos: [facturacion]
    base_url: https://api.wisphub.io
    endpoint: /api/facturas/{id}/registrar-pago/
    metodo: POST
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key

  # --- BottleCRM (verificado en vivo, ver skill bottlecrm-api) ---------------

  - nombre: consultar_casos_bottlecrm
    tipo: http
    descripcion: >
      Casos/tickets registrados en BottleCRM. Se puede buscar por texto libre
      (nombre o descripcion del caso) o filtrar por estado.
    solo_lectura: true
    roles_permitidos: [soporte]
    base_url: http://localhost:8000
    endpoint: /api/cases/
    metodo: GET
    auth_ref: BOTTLECRM_API_TOKEN
    auth_esquema: Bearer
    # Verificados en vivo, agosto 2026 (ver skill bottlecrm-api): impossible
    # value = 0, valor real = cuenta esperada.
    filtros_verificados:
      buscar:
        param: search
        tipo: texto
        verificado_el: 2026-08-07
      estado:
        param: status
        tipo: enum
        valores: {nuevo: New, asignado: Assigned, pendiente: Pending, cerrado: Closed, rechazado: 
            Rejected, duplicado: Duplicate}
        verificado_el: 2026-08-07
    extraer_de: cases

  # --- agregados -------------------------------------------------------------

  - nombre: contar_clientes
    tipo: agregado
    entidad: clientes
    etiqueta: clientes
    solo_lectura: true
    roles_permitidos: [soporte, facturacion, administracion]
    base_url: https://api.wisphub.io
    endpoint: /api/clientes/
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key
    # Verificado: 4260+811+2093+88 = 7252 = total sin filtro. Cuadra exacto.
    filtros_verificados:
      estado:
        param: estado
        tipo: enum
        valores: {activo: 1, suspendido: 2, cancelado: 3, gratis: 4}
        verificado_el: 2026-07-29
      plan_internet: {param: plan_internet, tipo: id, verificado_el: 2026-07-29}
      ciudad: {param: ciudad, tipo: texto, verificado_el: 2026-07-29}
      localidad: {param: localidad, tipo: texto, verificado_el: 2026-07-29}
      # Hallados en el sondeo de agosto. 'router' es la via para agrupar por
      # zona geografica: en una red WISP el router ES la zona fisica.
      router: {param: router, tipo: id, verificado_el: 2026-08-04}
      tecnico: {param: tecnico, tipo: id, verificado_el: 2026-08-04}
    filtros_ignorados_por_api:
      zona: >
        La API de clientes IGNORA el filtro por zona (devuelve los 7.272).
        Para agrupar clientes geograficamente usa 'router'. Las facturas si
        se pueden contar por zona.
      estado_facturas: >
        La API de clientes ignora este filtro. Para saber quien debe se cuentan
        facturas en estado 'pendiente' (cuenta facturas, no clientes).
      saldo: La API de clientes ignora el filtro por saldo.
      periodo: >
        La API de clientes no filtra por fecha en ninguna forma: no se pueden
        contar altas de un mes.
    agrupar_por: [estado, router, tecnico]

  - nombre: contar_facturas
    tipo: agregado
    entidad: facturas
    etiqueta: facturas
    solo_lectura: true
    roles_permitidos: [facturacion, administracion]
    base_url: https://api.wisphub.io
    endpoint: /api/facturas/
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key
    # Verificado: 3606+5087+7 = 8700 = total. Las 5 zonas suman 8700 exacto.
    filtros_verificados:
      estado:
        param: estado
        tipo: enum
        valores: {pendiente: 1, pagada: 2, cancelada: 3, en_revision: 4, transferida: 5}
        verificado_el: 2026-07-29
      zona: {param: zona, tipo: id, verificado_el: 2026-07-29}
    filtros_ignorados_por_api:
      facturadas: La API ignora este filtro.
      cliente: Para las facturas de UN cliente usa consultar_facturas.
    agrupar_por: [estado, zona]
    periodo:
      campos:
        emision: fecha_emision__range
        vencimiento: fecha_vencimiento__range
        pago: fecha_pago__range
      por_defecto: emision
      max_meses: 3          # verificado: 4 meses -> HTTP 400
      nota_defecto: periodo por defecto del API (~2 ultimos meses de emision)
      advertencia_defecto: >
        Sin periodo explicito, el API cuenta solo sus ultimos ~2 meses de
        emision, no el historico completo.

  - nombre: contar_tickets
    tipo: agregado
    entidad: tickets
    etiqueta: tickets
    solo_lectura: true
    roles_permitidos: [soporte, administracion]
    base_url: https://api.wisphub.io
    endpoint: /api/tickets/
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key
    # Verificado: 266+18+2351 = 2635 = total sin filtro de fecha.
    filtros_verificados:
      estado:
        param: estado
        tipo: enum
        # NUMERICO: ?estado=Nuevo devuelve 0 resultados, sin error.
        valores: {nuevo: 1, en_progreso: 2, cerrado: 4}
        verificado_el: 2026-07-29
    filtros_ignorados_por_api:
      cliente: >
        La API de tickets no filtra por cliente. Para los tickets de UN cliente
        usa consultar_tickets_de_cliente.
      tecnico: La API de tickets ignora el filtro por tecnico.
      prioridad: La API de tickets ignora el filtro por prioridad.
      departamento: La API de tickets ignora el filtro por departamento.
    agrupar_por: [estado]
    periodo:
      campos: {creacion: fecha_creacion}    # UN solo guion bajo, no '__range'
      por_defecto: creacion
      max_meses: 2          # verificado: 3 meses -> HTTP 400
      nota_defecto: "sin periodo: recorte temporal propio del API, no el historico"
      advertencia_defecto: >
        SIN PERIODO: el API aplica un recorte temporal propio. Sin filtro
        devuelve 2.635, pero solo julio da 2.637 y junio 3.341 — un subconjunto
        no puede superar al conjunto. Este total NO es el historico y no sirve
        para comparar.

  - nombre: informe_materiales
    tipo: batch
    descripcion: >
      Consumo de materiales de un periodo. El dato NO esta en un modulo de
      inventario (/api/gastos/ existe pero esta vacio): vive en el formulario
      'Firma de Ticket' dentro de las respuestas del ticket. Se parsea con
      codigo determinista; el modelo solo redacta sobre los totales.
      Coste ~2.700 llamadas por mes: es proceso POR LOTES, no interactivo.
    solo_lectura: true
    roles_permitidos: [administracion]

  # --- Uso interno del motor, no de ningun rol conversacional ---------------
  # Las tres de aca abajo las llama nucleo/seguimiento/escalamiento.py por
  # codigo cuando una conversacion se escala, nunca el modelo por su cuenta:
  # 'roles_permitidos' abajo es solo para pasar la validacion del esquema
  # (exige minimo un rol, ver nucleo/config/schema.py:381) -- lo que de
  # verdad controla que el modelo pueda invocarlas es 'puede_consultar' en
  # cada rol, y ninguno la tiene ahi a proposito.
  - nombre: listar_tags_crm
    tipo: http
    descripcion: Lista las etiquetas ya existentes en BottleCRM (para reusar en vez de duplicar).
    solo_lectura: true
    roles_permitidos: [administracion]
    base_url: http://backend:8000/api
    endpoint: /tags/
    metodo: GET
    auth_ref: BOTTLECRM_API_TOKEN
    auth_esquema: Bearer
    extraer_de: tags

  - nombre: crear_tag_crm
    tipo: http
    descripcion: Crea una etiqueta nueva en BottleCRM cuando listar_tags_crm no la encontro.
    solo_lectura: false
    requiere_confirmacion: true
    roles_permitidos: [administracion]
    base_url: http://backend:8000/api
    endpoint: /tags/
    metodo: POST
    auth_ref: BOTTLECRM_API_TOKEN
    auth_esquema: Bearer
    extraer_de: tag

  - nombre: crear_caso_soporte
    tipo: http
    descripcion: >
      Crea el ticket real en BottleCRM cuando una conversacion se escala a un
      humano. Verificado en vivo (agosto 2026): 'account'/'contacts' son
      opcionales -- un cliente de WhatsApp sin verificar todavia no tiene
      ninguno de los dos vinculado. 'tags' exige uuid, no nombre (a
      diferencia de otras pantallas del CRM, este endpoint no crea la
      etiqueta sola -- por eso existen listar_tags_crm/crear_tag_crm antes).
    solo_lectura: false
    requiere_confirmacion: true
    roles_permitidos: [administracion]
    base_url: http://backend:8000/api
    endpoint: /cases/
    metodo: POST
    auth_ref: BOTTLECRM_API_TOKEN
    auth_esquema: Bearer

# -----------------------------------------------------------------------------
#  CANALES
# -----------------------------------------------------------------------------
canales:
  # WhatsApp Business, Cloud API de Meta directo (sin intermediario).
  #
  # Todos los '*_ref' son NOMBRES de secretos, nunca valores -- el validador
  # rechaza el archivo si detecta algo con pinta de credencial. Los valores se
  # cargan aparte, cifrados, en asistente.tenant_secrets (ver
  # nucleo/seguridad/secretos.py); si un nombre no esta ahi, se busca en el
  # entorno del motor.
  #
  # Cual es cual, porque los nombres de Meta se confunden:
  #   phone_number_id   ID del numero EMISOR. No es el telefono.
  #   waba_id           la cuenta de WhatsApp Business. Solo para plantillas.
  #   token             de un System User, PERMANENTE. El de la consola dura
  #                     24 h y deja de servir sin aviso.
  #   app_secret        firma cada webhook entrante. Sin el no hay forma de
  #                     saber si quien golpea la URL publica es Meta.
  #   verify_token      cadena que elige la empresa; Meta la devuelve una sola
  #                     vez, en el handshake de alta del webhook.
  whatsapp:
    # Poner en true EXIGE los cuatro refs indispensables (el validador falla
    # si falta alguno): mejor que arrancar bien y romperse con el primer
    # mensaje de un cliente real.
    # ACTIVO desde agosto 2026: el canal atiende clientes reales. Estaba en
    # false porque el piloto todavia no habia arrancado, y se activo desde
    # Ajustes -> Canales -> WhatsApp, que escribe en la base.
    #
    # Quedo en false aca mientras tanto, y eso tumbo el canal: un
    # 'cargar_config --forzar' lo devolvio a false y el webhook empezo a
    # responder 401 a Meta ("El canal de WhatsApp no esta activo"). El valor
    # de este archivo tiene que seguir al de produccion, no al reves.
    activo: true
    phone_number_id_ref: WHATSAPP_PHONE_NUMBER_ID
    token_ref: WHATSAPP_TOKEN
    waba_id_ref: WHATSAPP_WABA_ID
    app_secret_ref: WHATSAPP_APP_SECRET
    verify_token_ref: WHATSAPP_VERIFY_TOKEN
    # Fija a proposito: que Meta publique una version nueva no puede cambiar el
    # comportamiento del canal sin que alguien lo decida.
    version_api: v23.0
    # Solo para mostrarlo en los ajustes. No participa de ninguna llamada.
    # No es un secreto: es el numero publico al que le escriben los clientes.
    numero_visible: '+573208633423'
    # clave interna -> nombre aprobado en Meta. La indireccion existe para que
    # el codigo diga 'aviso_mora' y cada empresa lo mapee al nombre que
    # registro. Se llenan cuando Meta apruebe las plantillas; comprobar el
    # cruce con GET /plantillas/whatsapp/rapilink antes de confiar en ellas.
    plantillas: {}
    # Baja de avisos: derecho del titular (Ley 1581) y ademas necesidad
    # practica -- un numero que quiere dejar de recibir y no puede, bloquea, y
    # los bloqueos le bajan la reputacion al numero de la empresa.
    # Se compara el mensaje COMPLETO, no si lo contiene: "no me llega nada, doy
    # de baja el servicio?" no es una solicitud de baja del canal.
    palabras_baja: [baja, stop, no molestar, cancelar avisos]
    palabras_alta: [alta, start, reactivar avisos]
  web:
    activo: true

escalamiento:
  activar_si: [frustracion_detectada, tres_fallos_seguidos, solicitud_explicita, duda_de_identidad]
  destino_rol: soporte
  mensaje: Te paso con un companero del equipo para que te ayude mejor.
  siempre_disponible: true

# -----------------------------------------------------------------------------
#  CONVERSACIONES  -  bandeja de chats con clientes finales (ver /conversaciones)
# -----------------------------------------------------------------------------
#  'etiquetas' es la taxonomia fija que nucleo/seguimiento/escalamiento.py le
#  ofrece al modelo (via function-calling con enum) al escalar una
#  conversacion -- nunca elige una categoria fuera de esta lista. Punto de
#  partida, se ajusta con uso real.
conversaciones:
  etiquetas: [soporte_tecnico, facturacion, comercial, queja]

# -----------------------------------------------------------------------------
#  MANUAL  -  taxonomia fija de casos para marcar respuestas buenas (ver
#  /manual y /conversaciones). Punto de partida: lo que cliente_final ya
#  resuelve o deriva hoy segun su descripcion, mas los casos probados en
#  vivo. Se ajusta con uso real, igual que 'conversaciones.etiquetas'.
# -----------------------------------------------------------------------------
manual:
  casos:
    - no_internet
    - internet_lento
    - consulta_saldo
    - consulta_factura
    - estado_servicio
    - reconexion
    - cambio_contrasena
    - reclamo_formal
    - otro

limites:
  max_conversaciones_dia: 500
  max_costo_usd_mes: 0.0    # modelo local: sin costo por token
  alerta_al_porcentaje: 80
  # Cubre depuracion, auditoria y analisis; mas alla es solo superficie de riesgo.
  retencion_conversaciones_dias: 365
  # Mucho mas corta que la de arriba, a proposito: el texto es barato y util
  # para depurar; una foto pesa y puede mostrar la casa, la cedula o una cara.
  # La foto sirve para resolver el caso, y un caso vive dias.
  retencion_multimedia_dias: 30

evaluacion:
  minimo_acierto_pct: 90.0
  # CERO, no "bajo". gemma3:4b respondia bien e inventaba cliente, plan y
  # factura: un sistema con 92% de acierto que inventa el 3% es peligroso.
  maximo_invenciones: 0
  minimo_casos: 50
