  # SmartOLT: control de la ONU autorizada en la OLT de fibra. Sondeado en
  # vivo contra la instancia real de Rapilink (agosto 2026, ver
  # .claude/skills/smartolt-api/SKILL.md) -- nunca se tomo la doc del
  # proveedor por buena sin probarla.
  #
  # 'sn_onu' de WispHub sirve DIRECTO como identificador de SmartOLT, sin
  # traduccion (verificado con el metodo del valor imposible: serial
  # inventado -> 400, no el universo entero). Lo inyecta el codigo desde la
  # sesion verificada, igual que 'interfaz_lan' -- el modelo nunca elige de
  # que ONU habla. Falta en el 32% de los clientes activos (ver skill
  # wisphub-api): para esos, la llamada falla de forma controlada (ver la
  # guarda de 'endpoint sin resolver' en nucleo/herramientas/http.py) y el
  # modelo cae al camino alternativo (ping + preguntas de luces).
  - nombre: consultar_estado_ont
    tipo: http
    descripcion: >
      Estado de la ONU del cliente en la OLT (Online/Offline) y hace cuanto
      cambio. PRIMER paso del diagnostico de SmartOLT -- liviano (sin PII,
      sin latencia relevante). Si da Offline sin que consultar_senal_ont
      alcance para explicar por que, y hace falta distinguir sin energia de
      falla optica, ese es un diagnostico mas profundo que todavia no esta
      disponible como herramienta -- en ese caso sigue el protocolo de
      preguntar por las luces del equipo.
    solo_lectura: true
    roles_permitidos: [cliente_final, soporte]
    base_url_ref: SMARTOLT_SUBDOMINIO
    endpoint: /api/onu/get_onu_status/{sn_onu}
    metodo: GET
    auth_ref: SMARTOLT_API_KEY
    auth_esquema: ""
    auth_header: X-Token
    # SIN 'extraer_de': la respuesta de este endpoint es PLANA
    # ({onu_status, last_status_change, status, response_code}), no trae un
    # objeto envolvente. Declararlo extraia el STRING 'Online' en vez de un
    # dict, y el filtro de campos lo descartaba entero con "Formato de
    # respuesta no reconocido" -- el modelo recibia un error donde deberia
    # haber un dato, y el registro de auditoria lo marcaba como exitoso
    # igual (la llamada HTTP si funcionaba). Encontrado 14/08/2026.
    inyectar_sesion:
      sn_onu: sn_onu
    # De 4.966 ONUs de Rapilink, 68 solo responden con el serial en su
    # forma hexadecimal (verificado en vivo, agosto 2026) -- y entre ellas
    # hay clientes ACTIVOS. WispHub guarda la forma corta, asi que sin este
    # reintento esos clientes se quedan sin diagnostico, con un 400 que no
    # explica nada. Ver el campo en nucleo/config/schema.py.
    reintentar_identificador_como:
      sn_onu: gpon_hex

  - nombre: consultar_senal_ont
    tipo: http
    descripcion: >
      Nivel de senal optica de la ONU del cliente. SEGUNDO paso del
      diagnostico de SmartOLT, junto con consultar_estado_ont -- llama a
      las dos juntas para un diagnostico completo. El veredicto
      (onu_signal_1490_veredicto) ya viene calculado contra los umbrales de
      G-GO-04, no lo calcules tu: 'aceptable' es -8 a -25 dBm, fuera de
      ese rango es un problema real de senal.
    solo_lectura: true
    roles_permitidos: [cliente_final, soporte]
    base_url_ref: SMARTOLT_SUBDOMINIO
    endpoint: /api/onu/get_onu_signal/{sn_onu}
    metodo: GET
    auth_ref: SMARTOLT_API_KEY
    auth_esquema: ""
    auth_header: X-Token
    # SIN 'extraer_de', mismo motivo que consultar_estado_ont (ver arriba):
    # la respuesta es plana, 'onu_signal' es un campo ('Very good'), no un
    # objeto envolvente.
    inyectar_sesion:
      sn_onu: sn_onu
    # De 4.966 ONUs de Rapilink, 68 solo responden con el serial en su
    # forma hexadecimal (verificado en vivo, agosto 2026) -- y entre ellas
    # hay clientes ACTIVOS. WispHub guarda la forma corta, asi que sin este
    # reintento esos clientes se quedan sin diagnostico, con un 400 que no
    # explica nada. Ver el campo en nucleo/config/schema.py.
    reintentar_identificador_como:
      sn_onu: gpon_hex
    # G-GO-04 (guia de diagnostico de fallas de conectividad, campo -- ONT
    # del cliente): -8 a -25 dBm aceptable, peor que -25 es problema del
    # drop. El tercer tramo (mejor que -8, senal "demasiado fuerte") no esta
    # normado en G-GO-04 -- se etiqueta como fuera de rango en vez de
    # inventar un limite, y se deriva a revision tecnica en cualquier caso.
    # Las dos etiquetas de problema arrancan con 'fuera de rango' A
    # PROPOSITO, no por estilo: es lo que hace que una condicion de
    # 'evidencia_suficiente' / 'ticket_al_escalar' pueda preguntar por las
    # dos con un solo 'contiene', sin acoplarse al texto descriptivo que
    # sigue. Antes decian 'problema en el drop...' y 'fuera DEL rango...', y
    # la condicion buscaba 'fuera de rango': no matcheaba NINGUNA de las
    # tres. La condicion existia, se veia razonable y estaba muerta desde el
    # dia que se escribio -- comprobado el 21/08/2026 pasando las tres
    # etiquetas reales por el matcher.
    veredictos:
      onu_signal_1490:
        - desde: -25.0
          hasta: -8.0
          etiqueta: aceptable
        - desde:
          hasta: -25.0001
          etiqueta: "fuera de rango -- senal debil: problema en el drop (conector, cable o tensores)"
        - desde: -7.9999
          hasta:
          etiqueta: "fuera de rango -- senal muy fuerte: revisar con un tecnico"

  # Descubierta sondeando la instancia real el 21/08/2026. NO esta en la
  # documentacion de SmartOLT -- el usuario la busco ahi y no aparece. Sale
  # del mismo metodo de siempre: probar el endpoint y ver si contesta.
  # Verificada con el metodo del valor imposible (serial inventado -> 400
  # "specify a valid ONU external ID"), asi que el endpoint valida el
  # identificador y no devuelve lo primero que encuentra.
  #
  # Lo que aporta y hoy NO se ve por ningun otro lado: un cliente puede estar
  # aprovisionado por debajo de su plan y nadie se entera. Eso es lentitud
  # real, es culpa nuestra, y no la detecta ni el speedtest (que solo dice
  # "va lento", no por que) ni la señal optica (que estaria perfecta).
  - nombre: consultar_velocidad_aprovisionada
    tipo: http
    descripcion: >
      A que velocidad esta REALMENTE configurado el equipo del cliente en la
      red, que no es lo mismo que el plan que contrato. Devuelve el perfil de
      bajada y el de subida; el nombre del perfil ES la velocidad
      (PLAN_100MB = 100 megas de bajada).

      USALA en cualquier reporte de internet lento, ANTES de pedirle al
      cliente que corra una prueba de velocidad: si el equipo quedo
      configurado por debajo de su plan, esa es la causa y ya la tienes --
      hacerlo medir no agrega nada y lo hace trabajar al pepe.

      LA SUBIDA ES NORMALMENTE LA MITAD DE LA BAJADA en esta red (medido
      sobre 22 clientes reales el 21/08/2026: PLAN_100MB/PLAN_50MB,
      PLAN_200MB_SV/PLAN_100MB). Un par asimetrico asi NO es una falla, no lo
      reportes como problema.

      Lo que SI es un hallazgo: que el perfil de bajada no corresponda al
      plan contratado, o que no haya ningun perfil asignado. En los dos
      casos, el cliente no puede alcanzar su velocidad por mas pruebas que
      haga, y eso se resuelve del lado nuestro, no en su casa.
    solo_lectura: true
    roles_permitidos: [cliente_final, soporte_tecnico_cliente, soporte]
    base_url_ref: SMARTOLT_SUBDOMINIO
    endpoint: /api/onu/get_onu_speed_profiles/{sn_onu}
    metodo: GET
    auth_ref: SMARTOLT_API_KEY
    auth_esquema: ""
    auth_header: X-Token
    inyectar_sesion:
      sn_onu: sn_onu
    reintentar_identificador_como:
      sn_onu: gpon_hex

  - nombre: consultar_incidente_red
    tipo: interno
    detecta_incidente: true
    descripcion: >
      Correlaciona la ONU de ESTE cliente contra los incidentes activos de
      su OLT en SmartOLT -- resuelve si su falla es un caso aislado o parte
      de una caida que afecta a mas gente (mismo splitter/PON). El
      veredicto ('es_incidente_de_red', cuantos clientes, desde cuando) ya
      viene calculado, no lo recalcules ni lo cuestiones. IMPORTANTE:
      SmartOLT tarda 2 a 5 minutos en agrupar una caida recien empezada
      (dato del proveedor) -- 'es_incidente_de_red: false' en un reporte
      muy reciente significa "todavia no hay nada agrupado", no "confirmado
      que es solo suyo". Comunicaselo asi al colaborador, no lo simplifiques
      a un si/no tajante cuando el reporte tiene pocos minutos.

      VIENEN DOS NUMEROS Y NO MIDEN LO MISMO. 'clientes_afectados' es lo
      que agrupa SmartOLT con su propio criterio. 'clientes_caidos_a_la_vez'
      es evidencia cruda: cuantos equipos del mismo puerto se cayeron en el
      mismo momento que el de este cliente, contado sobre los tiempos
      reales. Para hablarle al cliente usa el SEGUNDO, y lo mismo con
      'desde_por_tiempos' en vez de 'desde' -- en la caida del 21/08/2026
      SmartOLT declaraba 8 afectados desde las 12:16 cuando los tiempos
      mostraban 7 caidos juntos desde las 07:16, cinco horas antes.

      Por que importa: un puerto acumula equipos apagados hace meses
      (clientes que se fueron y nadie dio de baja). Contarlos como
      afectados hincha el numero y lo vuelve inutil -- en ese mismo puerto
      habia 17 caidos, y 10 llevaban entre mes y medio y ocho meses. Los
      que importan son los que se cayeron JUNTOS.
    solo_lectura: true
    roles_permitidos: [soporte_tecnico_cliente, soporte]
    base_url_ref: SMARTOLT_SUBDOMINIO
    auth_ref: SMARTOLT_API_KEY
    auth_esquema: ""
    auth_header: X-Token
    inyectar_sesion:
      sn_onu: sn_onu
    reintentar_identificador_como:
      sn_onu: gpon_hex

  # El dato que hasta hoy se desperdiciaba. Ver
  # nucleo/herramientas/estabilidad.py para el detalle de por que el conteo
  # va en codigo y no se le pasa la lista al modelo.
  - nombre: consultar_estabilidad_enlace
    tipo: interno
    resume_estabilidad: true
    descripcion: >
      Cuantas veces se cayo y volvio el enlace de ESTE cliente en las ultimas
      24 horas, y por que. El veredicto ('enlace_inestable', cuantas caidas,
      cual fue la causa dominante) ya viene calculado: no lo recalcules ni lo
      cuestiones.

      USALA cuando el cliente diga que le anda MAL A RATOS -- "a veces bien y
      a veces no", "se cae y vuelve", "en las noches se pone lento". Ese es
      el caso que ninguna otra herramienta puede ver: todas miden AHORA, y
      ahora suele estar andando bien. Un equipo que responde 'Online' con
      señal 'Very good' puede haberse caido nueve veces en el dia, y esto es
      lo unico que lo muestra.

      NO reemplaza a diagnosticar_falla_ont: esa dice por que se cayo LA
      ULTIMA vez, y esa ultima causa puede tapar el patron. Visto el
      21/08/2026 en la ONU de prueba: la ultima causa era un simple
      're-register' mientras el historial del mismo dia tenia ocho alarmas de
      perdida optica.

      Si da 'enlace_inestable', ya tienes evidencia suficiente: no le hagas
      hacer pruebas de velocidad para confirmar algo que la red ya conto.
    solo_lectura: true
    roles_permitidos: [cliente_final, soporte_tecnico_cliente, soporte]
    base_url_ref: SMARTOLT_SUBDOMINIO
    auth_ref: SMARTOLT_API_KEY
    auth_esquema: ""
    auth_header: X-Token
    inyectar_sesion:
      sn_onu: sn_onu
    reintentar_identificador_como:
      sn_onu: gpon_hex

  - nombre: reiniciar_ont
    tipo: http
    descripcion: >
      LLAMA A ESTA HERRAMIENTA (no sugieras el reinicio manual del router, no escales) apenas
      consultar_senal_ont haya dado 'aceptable' Y ping_cliente haya
      respondido bien, en un cliente que dice no tener internet -- ese es
      exactamente el caso para el que existe esta herramienta, y usar el
      reinicio manual en su lugar le hace perder tiempo al cliente para
      lograr lo mismo que esto hace en un paso. Reinicia la ONT del cliente.
      Contrato del proveedor (documentado,
      agosto 2026): comando fire-and-forget -- confirma que SE MANDO, no que
      la ONT ya reinicio ni que el problema se resolvio. Dile al cliente
      que el equipo va a estar sin conexion **uno o dos minutos** (medido en
      vivo, 14/08/2026: volvio a responder en ~73 segundos) y que revise si
      volvio la señal despues de ese tiempo.

      SIN paso de aprobacion humana -- el codigo exige en su lugar que ya
      hayas corrido consultar_senal_ont y ping_cliente EN ESTA conversacion
      y que los dos hayan dado resultado favorable (senal aceptable, ping
      exitoso). Si no se cumple, la herramienta se rechaza sola con el
      motivo -- no lo intentes "igual", sigue el protocolo alternativo. Es
      exactamente la logica del equipo electronico que a veces necesita
      reinicio PERO solo tiene sentido si ya se descarto que el problema es
      de red: si la senal esta mal, reiniciar no arregla nada y solo
      retrasa mandar un tecnico.

      Maximo UNA vez por conversacion -- si el cliente insiste en que lo
      reinicies de nuevo, no lo repitas: dile que un colaborador humano
      sigue el caso.
    solo_lectura: false
    requiere_confirmacion: true
    # Reiniciar deja al cliente sin internet uno o dos minutos, asi que no
    # puede salir del mensaje con que la puerta derivo el caso: ese mensaje
    # suele ser ambiguo ("me quede sin servicio") y bien puede estar
    # hablando de la television. Paso el 15/08/2026 en el simulador --
    # reinicio remoto, y recien despues el cliente aclaro que era la TV.
    # Medir sigue permitido en ese turno; actuar no. Ver
    # 'exige_turno_propio' en nucleo/config/schema.py.
    exige_turno_propio: true
    roles_permitidos: [cliente_final, soporte]
    base_url_ref: SMARTOLT_SUBDOMINIO
    endpoint: /api/onu/reboot/{sn_onu}
    metodo: POST
    auth_ref: SMARTOLT_API_KEY
    auth_esquema: ""
    auth_header: X-Token
    inyectar_sesion:
      sn_onu: sn_onu
    # De 4.966 ONUs de Rapilink, 68 solo responden con el serial en su
    # forma hexadecimal (verificado en vivo, agosto 2026) -- y entre ellas
    # hay clientes ACTIVOS. WispHub guarda la forma corta, asi que sin este
    # reintento esos clientes se quedan sin diagnostico, con un 400 que no
    # explica nada. Ver el campo en nucleo/config/schema.py.
    reintentar_identificador_como:
      sn_onu: gpon_hex
    # Los comentarios van ARRIBA de la clave, no entre los elementos de la
    # lista: ruamel indexa los de adentro por posicion y --exportar los
    # pierde al cambiar un elemento (ver el limite conocido de _fusionar en
    # cli/cargar_config.py). Se perdieron una vez, aca mismo.
    #
    # 'ping-exitoso' de WispHub es TEXTO ("3 de 3", "0 de 3"), NUNCA un
    # booleano. Estuvo declarado como 'valor: true' y por eso la precondicion
    # era imposible de cumplir desde el dia que se escribio -- el modelo
    # nunca lograba ofrecer el reinicio y desde afuera parecia que no queria.
    #
    # Y despues 'valores' en vez de un unico "3 de 3": medido el 15/08/2026,
    # el MISMO equipo sano devolvio '1 de 3', '2 de 3' y '3 de 3' en tres
    # corridas seguidas. Exigir el ping perfecto dejaba el reinicio remoto
    # fuera de alcance justo para el cliente con la conexion inestable, que
    # es el que se queja. Lo que importa es que el equipo CONTESTE: si
    # contesta, el comando llega. '0 de 3' queda afuera a proposito -- ahi no
    # hay a quien mandarle nada.
    exige_previas:
      - {herramienta: consultar_senal_ont, campo: onu_signal_1490_veredicto, valor: aceptable}
      - {herramienta: ping_cliente, campo: "ping-exitoso",
         valores: ["1 de 3", "2 de 3", "3 de 3"]}
    limite_por_conversacion: 1
    # Empujon de segunda oportunidad -- ver el campo en schema.py. El motor
    # inyecta esto apenas la señal y el ping YA dieron favorable en esta
    # conversacion, para que el modelo lo considere antes de redactar (no
    # pudo haberlo pedido en el mismo lote que recien trajo esos datos).
    # El texto insiste en EJECUTAR y no en anunciar por un motivo medido
    # (14/08/2026): con una redaccion mas suave ("decidi si corresponde
    # llamar a reiniciar_ont"), el modelo le contestaba al cliente "voy a
    # reiniciarlo de forma remota" SIN llamar la herramienta -- prometia una
    # accion que nunca ocurria, que es peor que no ofrecerla.
    sugerir_cuando_disponible: >
      El diagnostico (señal + ping) dio favorable, asi que reiniciar la ONT
      es el siguiente paso -- no el reinicio manual del router, no escalar a
      un humano.

      LLAMA LA HERRAMIENTA reiniciar_ont AHORA, en este mismo paso. No
      anuncies que la vas a usar ni le prometas al cliente que vas a
      reiniciar: si no la llamas, el reinicio NO ocurre y le habrias
      mentido. Primero ejecutala, y recien despues cuentale al cliente que
      ya la reiniciaste y que espere uno o dos minutos.

      Unica excepcion: si el cliente ya te dijo en este intercambio que no
      quiere que la reinicies.

  - nombre: diagnosticar_falla_ont
    tipo: http
    descripcion: >
      Diagnostico PROFUNDO de por que la ONU esta offline. Distingue el
      corte de energia CONFIRMADO (el equipo alcanzo a avisar) de una caida
      sin aviso -- que puede ser la fibra, pero tambien un equipo apagado o
      desenchufado de golpe: esos dos se ven identicos desde la OLT y solo
      los separa preguntarle al cliente. SOLO llama a esta herramienta como SEGUNDO paso, y solo cuando
      consultar_estado_ont ya dio Offline y consultar_senal_ont no alcanzo
      para explicar por que (offline no tiene lectura de senal util) --
      nunca la llames primero ni la llames si el equipo esta Online, ahi no
      aporta nada mas que las dos herramientas livianas. Tarda ~10 segundos
      (mucho mas que las otras herramientas de SmartOLT) -- es el costo de
      tener la causa real en vez de adivinar, dile al cliente que estas
      revisando algo mas a fondo si la conversacion se alarga.

      'ONU details.Last down cause_interpretado' ya viene calculado: no
      interpretes tu el texto crudo en ingles ('dying-gasp', 'ONT
      LOSi/LOBi alarm'), usa la version interpretada. Si no viene el campo
      '_interpretado' es porque la causa no esta en el mapeo conocido --
      en ese caso no inventes que significa, di que no se pudo determinar
      la causa exacta y seguí con el protocolo (luces del equipo, o
      escalar).
    solo_lectura: true
    roles_permitidos: [cliente_final, soporte]
    base_url_ref: SMARTOLT_SUBDOMINIO
    endpoint: /api/onu/get_onu_full_status_info/{sn_onu}
    metodo: GET
    auth_ref: SMARTOLT_API_KEY
    auth_esquema: ""
    auth_header: X-Token
    extraer_de: full_status_json
    inyectar_sesion:
      sn_onu: sn_onu
    # De 4.966 ONUs de Rapilink, 68 solo responden con el serial en su
    # forma hexadecimal (verificado en vivo, agosto 2026) -- y entre ellas
    # hay clientes ACTIVOS. WispHub guarda la forma corta, asi que sin este
    # reintento esos clientes se quedan sin diagnostico, con un 400 que no
    # explica nada. Ver el campo en nucleo/config/schema.py.
    reintentar_identificador_como:
      sn_onu: gpon_hex
    # Valores reales observados contra la instancia de Rapilink (agosto
    # 2026, ver skill smartolt-api). Un valor sin entrada aca se deja SIN
    # interpretar -- nunca se inventa una etiqueta para una causa nueva.
    mapeos:
      "ONU details.Last down cause":
        dying-gasp: "sin energia electrica en el domicilio (corte de luz o el equipo se desenchufo)"
        # NO afirma "fibra cortada": el dying-gasp es de mejor esfuerzo, y un
        # equipo que se apaga de golpe (o que desenchufan) no llega a
        # mandarlo -- la OLT ve lo mismo que con la fibra cortada. Verificado
        # en campo por Rapilink (agosto 2026): aparece asi seguido con
        # equipos que en realidad estaban desconectados de la corriente.
        # Afirmar la fibra aca mandaba visitas tecnicas a casas donde solo
        # habia que enchufar el equipo.
        "ONT LOSi/LOBi alarm": "sin señal optica: puede ser la fibra (cortada o falla en la caja NAP) O el equipo apagado/desenchufado -- desde la OLT los dos se ven identicos, hay que preguntarle al cliente por la corriente para distinguirlos"
        "ONT LOFi alarm": "sin señal optica: puede ser la fibra (cortada o falla en la caja NAP) O el equipo apagado/desenchufado -- desde la OLT los dos se ven identicos, hay que preguntarle al cliente por la corriente para distinguirlos"
        # Visto en vivo el 21/08/2026 en la ONU de prueba. NO es una falla:
        # el equipo se volvio a registrar contra la OLT, cosa que pasa tras
        # una reconexion de fibra, un cambio de configuracion o un flap. Lo
        # importante es que TAPA la causa anterior -- ese mismo equipo venia
        # de cuatro 'ONT LOSi/LOBi alarm' en el dia, y 'Last down cause' solo
        # refleja el evento mas reciente. Por eso la etiqueta no concluye
        # nada y manda a mirar si se repite.
        "re-register": "el equipo se volvio a registrar en la red hace poco (reconexion reciente). Esto NO dice por que se cayo antes: si el cliente sigue sin servicio, hay que tratarlo como una caida sin causa confirmada"
        "ONU is currently online": "el equipo esta en linea, no hay una caida que explicar"

  - nombre: cambiar_tipo_onu
    tipo: http
    multipart: true
    descripcion: >
      Corrige el TIPO con que la ONU quedo registrada en SmartOLT, para que
      exponga el puerto de television. No cambia nada fisico en la casa del
      cliente: cambia como esta clasificado su equipo.

      SOLO se usa cuando consultar_estado_catv devolvio 'Not supported by
      ONU-Type' Y el cliente confirmo que tiene UN SOLO equipo. Si tiene dos,
      su television va por un decodificador aparte y el puerto de la ONU no
      interviene -- cambiar el tipo ahi no arregla nada.

      Despues de llamarla, vuelve a leer consultar_estado_catv: tiene que
      dejar de decir 'Not supported'. Recien entonces activar_catv.
    solo_lectura: false
    requiere_confirmacion: true
    # No en el turno en que la conversacion llega al area: hace falta que el
    # cliente haya contestado cuantos equipos tiene, y eso es un turno suyo.
    exige_turno_propio: true
    limite_por_conversacion: 1
    exige_previas:
      - herramienta: consultar_estado_catv
        campo: catv
        contiene: "Not supported"
    roles_permitidos: [soporte_tecnico_cliente, soporte]
    base_url_ref: SMARTOLT_SUBDOMINIO
    endpoint: /api/onu/change_onu_type/{sn_onu}
    metodo: POST
    auth_ref: SMARTOLT_API_KEY
    auth_esquema: ""
    auth_header: X-Token
    inyectar_sesion:
      sn_onu: sn_onu
    # El nombre del campo salio de la coleccion oficial del proveedor (ver
    # .claude/skills/smartolt-api/SKILL.md, el truco del collectionId), no de
    # adivinar: 'onu_type', form-data, con el NOMBRE del tipo como valor.
    #
    # 'CDATA-CATV' es el destino porque en esta instancia el unico tipo sin
    # soporte de TV es 'CDATA' (355 equipos, medido el 18/08/2026) y su
    # equivalente con CATV es ese, con 1.247 equipos funcionando. Si algun dia
    # aparece otro tipo sin soporte, esto deja de alcanzar y hay que mapear
    # origen -> destino en vez de un destino fijo.
    argumentos_fijos:
      onu_type: CDATA-CATV

  - nombre: activar_catv
    tipo: http
    descripcion: >
      Enciende el servicio de television en el equipo del cliente. Se usa en
      UN solo caso: consultar_estado_catv dio 'Disabled' y su plan SI
      incluye TV. Ahi la television esta apagada en el equipo por error, y
      encenderla resuelve el caso entero sin visita ni tecnico.

      NO la llames en ningun otro caso. Si el plan no incluye TV, el
      servicio esta apagado A PROPOSITO y encenderlo seria darle algo que no
      contrato -- medido: de cada dos clientes con la TV apagada, uno la
      tiene apagada con razon. El motor ademas lo rechaza solo si falta
      alguna de las dos condiciones, asi que no lo intentes "por si acaso":
      sigue el protocolo normal.

      Despues de encenderla, dile al cliente que ya quedo activada y
      preguntale si le volvio la señal. Si todavia no la ve, guialo con la
      sintonizacion automatica de canales eligiendo ANTENA -- el equipo
      necesita volver a buscar los canales despues de recuperar la señal.

      Maximo UNA vez por conversacion.
    solo_lectura: false
    requiere_confirmacion: true
    roles_permitidos: [soporte_tecnico_cliente, soporte]
    base_url_ref: SMARTOLT_SUBDOMINIO
    endpoint: /api/onu/enable_catv/{sn_onu}
    metodo: POST
    auth_ref: SMARTOLT_API_KEY
    auth_esquema: ""
    auth_header: X-Token
    inyectar_sesion:
      sn_onu: sn_onu
    reintentar_identificador_como:
      sn_onu: gpon_hex
    limite_por_conversacion: 1
    # Los dos guards en CODIGO, no en el prompt (PRD 7.4): esto le enciende
    # un servicio pago a un cliente, y el prompt es guia, no garantia. Sin
    # las dos medidas hechas en esta conversacion, el motor no ejecuta.
    #
    # 'contiene' y no 'valor': las descripciones de plan son texto libre
    # ("PLAN HOGAR FO (100MB + TV)", "SERVICIO DE INTERNET + TV"), no un
    # valor cerrado que se pueda enumerar sin desactualizarse.
    #
    # Se busca "TV" y no "television" porque asi lo escriben: medido el
    # 15/08/2026, los 10 planes de Rapilink que incluyen television usan el
    # token 'TV', ninguno la palabra completa. OJO: 'television' NO contiene
    # la subcadena 'tv', asi que un plan nuevo escrito de esa forma quedaria
    # afuera -- el guard falla del lado seguro (no enciende), pero habria que
    # ajustar este 'contiene'.
    exige_previas:
      - herramienta: consultar_plan_tv
        campo: descripcion
        contiene: "TV"
      - herramienta: consultar_estado_catv
        campo: catv
        valor: Disabled

  - nombre: consultar_dispositivos_conectados
    tipo: http
    descripcion: >
      Los equipos que estan conectados AHORA al router del cliente, via
      TR-069. Es lo unico que deja ver del lado de adentro de la casa: hasta
      aca el diagnostico llega a la ONT y despues hay que preguntar.

      Cuando el cliente dice que no tiene internet pero la ONT responde y la
      señal esta bien, esto separa los tres casos que antes se distinguian
      preguntando:

      - Varios equipos activos, de WiFi Y de cable: el servicio llega. Falla
        UN dispositivo puntual, no la conexion.
      - Solo equipos de cable activos ('InterfaceType' Ethernet) y ninguno de
        WiFi ('802.11'): el problema es el WiFi -- banda, clave o alcance.
      - Lista vacia con la ONT en linea: no hay NADA conectado. O el router
        del cliente esta apagado, o el WiFi entero se cayo.

      'HostName' trae el nombre real del equipo ("DESKTOP-C8V2688", el
      celular de alguien). Sirve para hablarle concreto -- "veo tu computador
      conectado pero ningun celular" -- en vez de interrogarlo.

      OJO CON EL ERROR: si responde 'The ONU is not responding to TR-069 ACS
      requests', eso NO es "no hay equipos conectados", es "no pude mirar".
      Medido el 19/08/2026: de 5 ONUs con TR-069 habilitado, 2 contestaron
      con datos, 1 con lista vacia y 2 fallaron asi. Tratar un fallo como
      lista vacia le diria a alguien que no tiene nada conectado cuando en
      realidad no se pudo ver.

      No la llames si la ONT esta caida o la señal esta fuera de rango: el
      problema esta antes y los equipos de adentro no importan todavia.
    solo_lectura: true
    roles_permitidos: [soporte_tecnico_cliente, soporte]
    base_url_ref: SMARTOLT_SUBDOMINIO
    endpoint: /api/onu/get_onu_router_hosts/{sn_onu}
    metodo: GET
    auth_ref: SMARTOLT_API_KEY
    auth_esquema: ""
    auth_header: X-Token
    inyectar_sesion:
      sn_onu: sn_onu
    # Dos niveles, y el de adentro viene indexado por numero en vez de ser
    # una lista -- el motor lo normaliza (ver nucleo/herramientas/http.py).
    extraer_de: response.hostlist

  - nombre: consultar_estado_catv
    tipo: http
    descripcion: >
      Si el servicio de TV esta habilitado en el equipo del cliente, segun
      la OLT. Para una falla de TV es el UNICO dato duro que tenemos de
      nuestro lado -- todo lo demas del protocolo (cableado, entrada,
      sintonizacion) depende de lo que el cliente reporte.

      LLAMA A ESTA HERRAMIENTA APENAS el cliente reporta una falla de TV y ya confirmaste
      que su plan la incluye, ANTES de arrancar con la lista de preguntas.
      El manual (5.9) pide verificar en SmartOLT como PARTE del
      procedimiento, no despues de agotar al cliente.

      Como leer 'catv':
      - 'Enabled'  = el servicio esta habilitado en el equipo. De nuestro
                     lado sale bien, asi que el problema esta del lado del
                     cliente: sigue el protocolo (cableado, entrada del TV,
                     sintonizacion).
      - 'Disabled' = el servicio de TV esta APAGADO en el equipo. ESO es la
                     falla, ya la encontraste, y la resuelves tu: llama a
                     activar_catv. No derives a un humano por esto ni le
                     pidas que sintonice antes de encenderlo.
      - 'Not supported by ONU-Type' = el modelo de equipo que tiene no
                     soporta television. No es algo que el cliente pueda
                     resolver ni que se arregle sintonizando: pasa el caso a
                     un colaborador humano, porque si su plan incluye TV hay
                     que cambiarle el equipo.
    solo_lectura: true
    # Si no se puede leer, la conversacion escala SOLA, en codigo. En una
    # falla de TV este es el unico dato de nuestro lado: sin el, seguir
    # preguntando por cables da por sentado que la central esta bien, que es
    # justo lo que no se pudo comprobar. Paso el 18/08/2026 con un cliente
    # real sin identificador de equipo cargado, y la television estaba
    # desactivada desde la central.
    escalar_si_falla: sin_datos_para_diagnosticar
    # Sin 'cliente_final': ese rol es un ROUTER, no diagnostica (ver su
    # catalogo). Las fallas de TV las atiende soporte_tecnico_cliente.
    roles_permitidos: [soporte_tecnico_cliente, soporte]
    base_url_ref: SMARTOLT_SUBDOMINIO
    endpoint: /api/onu/get_onu_details/{sn_onu}
    metodo: GET
    auth_ref: SMARTOLT_API_KEY
    auth_esquema: ""
    auth_header: X-Token
    extraer_de: onu_details
    inyectar_sesion:
      sn_onu: sn_onu
    # De 4.966 ONUs de Rapilink, 68 solo responden con el serial en su
    # forma hexadecimal (verificado en vivo, agosto 2026) -- y entre ellas
    # hay clientes ACTIVOS. WispHub guarda la forma corta, asi que sin este
    # reintento esos clientes se quedan sin diagnostico, con un 400 que no
    # explica nada. Ver el campo en nucleo/config/schema.py.
    reintentar_identificador_como:
      sn_onu: gpon_hex
    # DESCARTADO: 'Optical status.CATV Rx optical power(dBm)' existe y trae
    # el nivel optico de CATV (medido en vivo, agosto 2026: -5.90 en un
    # equipo sano). NO se expone todavia porque no hay un rango aceptable
    # confirmado con el area tecnica -- y el dBm crudo no va al modelo sin
    # interpretar (PRD 12.5). Cuando ese rango exista, se agrega aca un
    # bloque 'veredictos' igual al de consultar_senal_ont y el campo
    # '..._veredicto' a la lista blanca de los roles.

  # --- asistente de configuracion guiada (agosto 2026) --------------------
  # Las dos unicas herramientas 'tipo: interno' de este catalogo que NO son
  # verifica_identidad/confirma_identidad/deriva_rol. No pasan por el
  # ejecutor generico de nucleo/modelo/motor.py::_ejecutar_tool -- las
  # despacha directo Herramienta.sondea_api / .propone_herramienta. Ver
  # nucleo/herramientas/sondeo.py para el bloqueo de SSRF.
  - nombre: sondear_api
    tipo: interno
    sondea_api: true
    solo_lectura: true
    roles_permitidos: [configuracion_guiada]
    descripcion: >
      Hace un GET de solo lectura contra una URL externa que describis vos
      (o el ADMIN te paso). Bloqueada contra redes privadas/internas por
      seguridad -- si la URL resuelve a una IP interna, el pedido se
      rechaza antes de salir.

      Devuelve un RESUMEN, nunca el volcado completo: cuantos registros hay
      (count), que campos trae cada uno (campos_disponibles), y hasta 3
      filas de muestra. Usalo primero SIN filtros para ver la forma de la
      respuesta, y despues con 'params' distintos para verificar cada
      filtro con el metodo del valor imposible (comparar sin filtro, con un
      valor que no puede existir, y con un valor real).

      Si la API necesita autenticacion, pasa 'auth_ref' con el NOMBRE del
      secreto ya guardado (nunca le pidas al ADMIN que te escriba la clave
      en el chat -- vos no la necesitas, el motor la resuelve solo).

  - nombre: proponer_herramienta
    tipo: interno
    propone_herramienta: true
    solo_lectura: false
    requiere_confirmacion: true
    roles_permitidos: [configuracion_guiada]
    descripcion: >
      Guarda el borrador de una Herramienta nueva, con la evidencia del
      sondeo que la respalda. NO la activa -- queda pendiente hasta que un
      ADMIN humano la apruebe desde la pantalla de configuracion. Llamala
      SOLO despues de haber verificado con sondear_api lo que estas
      declarando; nunca antes.

# -----------------------------------------------------------------------------
#  CANALES
# -----------------------------------------------------------------------------
canales:
  # WhatsApp Business, Cloud API de Meta directo (sin intermediario).
  #
  # Todos los '*_ref' son NOMBRES de secretos, nunca valores -- el validador
  # rechaza el archivo si detecta algo con pinta de credencial. Los valores se
  # cargan aparte, cifrados, en asistente.tenant_secrets (ver
  # nucleo/seguridad/secretos.py); si un nombre no esta ahi, se busca en el
  # entorno del motor.
  #
  # Cual es cual, porque los nombres de Meta se confunden:
  #   phone_number_id   ID del numero EMISOR. No es el telefono.
  #   waba_id           la cuenta de WhatsApp Business. Solo para plantillas.
  #   token             de un System User, PERMANENTE. El de la consola dura
  #                     24 h y deja de servir sin aviso.
  #   app_secret        firma cada webhook entrante. Sin el no hay forma de
  #                     saber si quien golpea la URL publica es Meta.
  #   verify_token      cadena que elige la empresa; Meta la devuelve una sola
  #                     vez, en el handshake de alta del webhook.
  whatsapp:
    # Poner en true EXIGE los cuatro refs indispensables (el validador falla
    # si falta alguno): mejor que arrancar bien y romperse con el primer
    # mensaje de un cliente real.
    # ACTIVO desde agosto 2026: el canal atiende clientes reales. Estaba en
    # false porque el piloto todavia no habia arrancado, y se activo desde
    # Ajustes -> Canales -> WhatsApp, que escribe en la base.
    #
    # Quedo en false aca mientras tanto, y eso tumbo el canal: un
    # 'cargar_config --forzar' lo devolvio a false y el webhook empezo a
    # responder 401 a Meta ("El canal de WhatsApp no esta activo"). El valor
    # de este archivo tiene que seguir al de produccion, no al reves.
    activo: true
    phone_number_id_ref: WHATSAPP_PHONE_NUMBER_ID
    token_ref: WHATSAPP_TOKEN
    waba_id_ref: WHATSAPP_WABA_ID
    app_secret_ref: WHATSAPP_APP_SECRET
    verify_token_ref: WHATSAPP_VERIFY_TOKEN
    # Fija a proposito: que Meta publique una version nueva no puede cambiar el
    # comportamiento del canal sin que alguien lo decida.
    version_api: v23.0
    # Solo para mostrarlo en los ajustes. No participa de ninguna llamada.
    # No es un secreto: es el numero publico al que le escriben los clientes.
    numero_visible: '+573208633423'
    # clave interna -> nombre aprobado en Meta. La indireccion existe para que
    # el codigo diga 'aviso_mora' y cada empresa lo mapee al nombre que
    # registro. Se llenan cuando Meta apruebe las plantillas; comprobar el
    # cruce con GET /plantillas/whatsapp/rapilink antes de confiar en ellas.
    plantillas: {}
    # Baja de avisos: derecho del titular (Ley 1581) y ademas necesidad
    # practica -- un numero que quiere dejar de recibir y no puede, bloquea, y
    # los bloqueos le bajan la reputacion al numero de la empresa.
    # Se compara el mensaje COMPLETO, no si lo contiene: "no me llega nada, doy
    # de baja el servicio?" no es una solicitud de baja del canal.
    palabras_baja: [baja, stop, no molestar, cancelar avisos]
    palabras_alta: [alta, start, reactivar avisos]
  web:
    activo: true

# -----------------------------------------------------------------------------
#  AREAS DE TRABAJO  -  donde trabaja cada persona del equipo
# -----------------------------------------------------------------------------
#  Precargan los agentes al dar de alta a alguien. Es un punto de partida: se
#  editan despues, porque alguien de soporte que ademas atiende facturas tiene
#  que poder tener los dos.
#
#  VENTAS NO ESTA, y no es un olvido: existe 'ventas' como agente que atiende
#  al cliente en el chat, pero NO como agente interno, asi que no hay
#  capacidades que darle a un colaborador de esa area. Declararla igual seria
#  ofrecer en la pantalla un area que deja a la persona sin poder hacer nada.
#  Entra cuando se diseñe su agente interno.
areas:
  # 'icono' y 'color' son opcionales: sin ellos la pantalla deriva un color
  # estable del nombre y dibuja las iniciales. Se declaran aca porque son de
  # la empresa -- otra empresa tendra otras areas y otros colores.
  - nombre: cartera
    etiqueta: Cartera
    agentes: [facturacion]
    icono: factura
    color: '#7c5cd6'
  - nombre: soporte_tecnico
    etiqueta: Soporte Técnico
    agentes: [soporte]
    icono: llave
    color: '#2f6fed'
  - nombre: administracion
    etiqueta: Administración
    agentes: [administracion]
    icono: edificio
    color: '#0d9488'

# -----------------------------------------------------------------------------
#  IDENTIDAD EXTERNA  -  quien es cada colaborador en el sistema operativo
# -----------------------------------------------------------------------------
#  Sin esto, el ticket que sale al escalar solo podia asignarse al usuario
#  FIJO que estuviera escrito en la herramienta -- y quedo uno solo, asi que
#  todos los tickets de todos los casos caian sobre la misma persona,
#  incluidas las consultas de factura, que no son suyas.
#
#  'herramienta_listado' es la que ya usa el asistente para ver el personal.
#  Los nombres de campo son los que devuelve de verdad esa API (verificado:
#  cada persona viene como {id, username, nombre, email}).
identidad_externa:
  sistema: wisphub
  etiqueta: Usuario en WispHub
  herramienta_listado: consultar_tecnicos
  campo_identificador: id
  campo_nombre: nombre

escalamiento:
  activar_si: [frustracion_detectada, tres_fallos_seguidos, solicitud_explicita, duda_de_identidad,
               visita_tecnica_requerida, sin_datos_para_diagnosticar]
  destino_rol: soporte
  # Este texto REEMPLAZA la respuesta del asistente cuando escala (ver
  # nucleo/canales/api.py), no se le suma -- asi que tiene que sostenerse
  # solo: es lo unico que el cliente va a leer en ese turno.
  mensaje: >-
    Entiendo tu molestia. Te paso con un compañero del equipo que va a
    revisar tu caso ahora mismo.
  siempre_disponible: true
  # Un cliente que putea por el servicio no esta pidiendo un humano: esta
  # pidiendo que le arreglen el internet, y eso el asistente lo puede hacer
  # solo en veinte segundos. Escalarlo a la primera lo sacaba del asistente
  # antes de intentar siquiera el diagnostico -- y en un ISP eso es casi todo
  # el que se queda sin servicio (visto el 15/08/2026: "el internet no sirve
  # para una verga" -> caso humano abierto, cero herramientas ejecutadas).
  #
  # Se le da UNA vuelta, no mas. Si el proximo mensaje sigue igual, pasa a
  # una persona sin discutir: insistir con alguien que ya exploto dos veces
  # empeora las cosas.
  #
  # 'solicitud_explicita' NO va aca a proposito: ese es el cliente PIDIENDO
  # hablar con alguien, y a eso no se lo hace esperar una vuelta.
  intentar_resolver_antes: [frustracion_detectada]
  # Piloto (agosto 2026): sin_senal_tv es el UNICO caso con agendamiento
  # automatico habilitado -- nucleo/seguimiento/agendamiento.py revisa el
  # checklist de la seccion 5.9 contra el manual real antes de agendar.
  # Apagado por defecto para cualquier otro caso.
  agendamiento_automatico:
    sin_senal_tv: agendar_visita_tecnica
    # Agregado 21/08/2026. NO cubre todo 'no_internet': el arbol decide en
    # que ramas corresponde visita (equipo con corriente que no vuelve,
    # fibra, WAN perdida) y en cuales corresponde un humano (falla en todos
    # los aparatos tras reiniciar, solo WiFi, o todo normal y el cliente
    # insiste). El verificador contrasta contra el manual antes de agendar.
    no_internet: agendar_visita_internet

  # Ramas donde la evidencia YA es dura y viene de la red, no del relato del
  # cliente: ahi se agenda sin pasar por el checklist del manual. Ver
  # 'evidencia_suficiente' en nucleo/config/schema.py.
  #
  # Por que estas tres y no el caso entero: el verificador contrasta contra
  # el procedimiento que el RAG recupere, y el 21/08/2026 traia el de WiFi
  # por parecido -- exigia "¿que mensaje aparece en el dispositivo?" a un
  # cliente que no tiene ninguna conexion de la cual leer un mensaje. Con eso
  # 'no_internet' no agendaba nunca.
  #
  # Las ramas que NO estan aca (falla en todos los aparatos tras reiniciar,
  # solo WiFi, todo normal y el cliente insiste) siguen escalando a un
  # humano, como se definio: ahi el servicio llega y mandar un tecnico a
  # mirar el mismo equipo no resuelve nada.
  #
  # Las dos condiciones de abajo, en orden:
  #   1. 'sin señal optica' -- fibra cortada o falla en la caja. La OLT lo
  #      ve; no hay nada que preguntarle al cliente sobre su casa.
  #   2. 'fuera de rango' -- el problema esta en la acometida (el drop, un
  #      conector, un empalme). El veredicto lo calcula el codigo.
  #
  # OJO con el nombre del campo: va PLANO, sin el 'ONU details.' de
  # adelante. La lista blanca entiende notacion con punto, pero
  # '_buscar_campo' -- el que evalua estas condiciones -- no: busca la clave
  # en cualquier nivel. Con el prefijo devolvia None y la condicion no
  # disparaba nunca, y desde afuera se veia igual que si el mecanismo no
  # existiera.
  #
  # Los comentarios van ACA y no dentro de la lista: el editor de config
  # (cli/cargar_config.py::_fusionar) pierde los comentarios que viven entre
  # los elementos de una lista al exportar -- verificado, se llevaba estos y
  # de paso el encabezado de la seccion siguiente.
  # Vetos: la traza que hace que agendar sea un error. Ver
  # nucleo/seguimiento/agendamiento.py:veto_de_agendamiento -- corre ANTES
  # que 'evidencia_suficiente', porque justamente lo que vetamos aca es una
  # caida que desde la ONU de un cliente se ve identica a su fibra cortada.
  no_agendar_si:
    no_internet:
      - herramienta: consultar_incidente_red
        campo: es_incidente_de_red
        valor: true
  # Que ticket operativo sale cuando el caso se pasa a una persona. Gana la
  # PRIMERA entrada cuyas condiciones cumpla la traza; la ultima, sin
  # condiciones, es el caso por defecto (el esquema obliga ese orden).
  #
  # 'internet_lento' escala SIEMPRE, por decision del piloto: el agente hace
  # todo el diagnostico que no necesita a nadie y despues pasa el caso con la
  # ficha armada. Lo que cambia segun lo medido es el ASUNTO, porque es lo
  # que le dice al tecnico de que se trata antes de abrir nada.
  #
  # 'no_internet' NO esta aca a proposito: ese caso ya agenda la visita sola
  # cuando corresponde, y ese ticket ES el trabajo anotado. Duplicarlo seria
  # mandar dos veces el mismo trabajo.
  # A que area va cada caso, con que asunto y con que prioridad. Todos los
  # asuntos salen del catalogo REAL de /api/tickets/asuntos-tickets/.
  #
  # La PRIORIDAD la decide el contexto de la conversacion, no el caso a secas:
  # dos entradas del mismo caso con condiciones distintas abren tickets
  # distintos. Valores de WispHub: 1 baja, 2 normal, 3 alta, 4 muy alta.
  #
  # 'otro' entra con el asunto 'Otros', que Rapilink creo el 23/08/2026 para
  # esto (verificado: el POST lo acepta -- antes, con uno inventado, devolvia
  # 400). Va con la categoria que el asistente sugiere en la primera linea de
  # la descripcion: asi el catalogo mejora con el uso en vez de quedarse
  # fijo, y quien administra decide si vale la pena crearla.
  #
  # Tampoco estan los casos donde el ticket no aporta: un suspendido es
  # facturacion, no una orden de trabajo, y las consultas que el asistente
  # resuelve solo no dejan nada pendiente que anotar.
  # Que area ATIENDE la conversacion de cada caso. Con esto el caso del CRM se
  # crea asignado, y no es un detalle de prolijidad: el CRM le muestra a quien
  # no es administrador SOLO lo suyo, asi que un caso sin dueño no queda
  # "para todos" -- queda invisible para el equipo.
  #
  # Medido el 23/08/2026 antes de esto: 54 casos escalados en la instancia
  # real, y las dos personas del equipo veian CERO. Solo el admin los veia.
  #
  # Es la lista completa de casos a proposito: uno que falte aca vuelve a caer
  # en el agujero de antes.
  # Cuando un caso deja de ocupar a alguien. Todo lo que no este en esta
  # lista cuenta como carga al repartir: lo que ya empezo Y lo que tiene
  # esperando. Son los estados terminales de BottleCRM.
  estados_cerrados: [Closed, Rejected, Duplicate]

  area_por_caso:
    no_internet: soporte_tecnico
    internet_lento: soporte_tecnico
    sin_senal_tv: soporte_tecnico
    cambio_wifi: soporte_tecnico
    consulta_saldo: cartera
    consulta_factura: cartera
    estado_servicio: cartera
    reconexion: cartera
    reclamo_formal: cartera
    otro: soporte_tecnico

  ticket_al_escalar:
    internet_lento:
      # La optica fuera de rango es una falla fisica confirmada: entra ALTA.
      - herramienta: crear_ticket_caso
        area: soporte_tecnico
        asunto: Internet Lento/Niveles Altos
        prioridad: "3"
        condiciones:
          - herramienta: consultar_senal_ont
            campo: onu_signal_1490_veredicto
            contiene: "fuera de rango"
      # El enlace que se cae y vuelve tambien: la red ya lo conto.
      - herramienta: crear_ticket_caso
        area: soporte_tecnico
        asunto: Internet Intermitente
        prioridad: "3"
        condiciones:
          - herramienta: consultar_estabilidad_enlace
            campo: enlace_inestable
            valor: true
      # Sin causa identificada: normal, hasta que alguien mire.
      - herramienta: crear_ticket_caso
        area: soporte_tecnico
        asunto: Internet Lento
        prioridad: "2"

    # Esta sin servicio mientras espera.
    reconexion:
      - herramienta: crear_ticket_caso
        area: cartera
        asunto: Reconexion
        prioridad: "3"

    # Cubre TODO cambio en la red inalambrica: nombre, clave, y si la red
    # queda oculta o visible.
    #
    # Se llamaba 'cambio_contrasena', del alcance original: decia menos de lo
    # que abarca, y el modelo clasifica leyendo estos identificadores -- un
    # pedido de cambio de NOMBRE tendia a caer en 'otro'. Se renombro cuando
    # se comprobo que ninguna conversacion lo tenia asignado todavia (cero
    # filas en asistente.conversations), asi que no hubo nada que migrar. Si
    # se vuelve a renombrar con conversaciones ya etiquetadas, hay que
    # actualizarlas: quedan apuntando a un caso que no existe.
    #
    # El asunto sale de lo que el cliente pidio, leido de la traza que dejo
    # 'registrar_pedido_wifi'. Gana la PRIMERA entrada que cumple, y la que no
    # tiene condiciones va ultima por obligacion del esquema.
    cambio_wifi:
      # Nombre, o nombre Y clave juntos: entra como cambio de nombre. Es lo
      # normal -- casi nadie cambia el nombre sin cambiar tambien la clave, y
      # un solo ticket con los dos datos adentro le sirve mas al tecnico que
      # dos tickets que hay que cruzar.
      - herramienta: crear_ticket_caso
        area: soporte_tecnico
        asunto: Cambio De Nombre De Red
        prioridad: "2"
        condiciones:
          - herramienta: registrar_pedido_wifi
            campo: cambia_nombre
            valor: true
      # Solo la clave.
      - herramienta: crear_ticket_caso
        area: soporte_tecnico
        asunto: Cambio De Contraseña En Router Wifi
        prioridad: "2"
        condiciones:
          - herramienta: registrar_pedido_wifi
            campo: cambia_clave
            valor: true
      # Solo ocultar la red, sin tocar nombre ni clave: es un tramite propio
      # en el catalogo de WispHub, no una variante de los anteriores.
      - herramienta: crear_ticket_caso
        area: soporte_tecnico
        asunto: Red Oculta
        prioridad: "2"
        condiciones:
          - herramienta: registrar_pedido_wifi
            campo: red_oculta
            valor: true
      # Y volver a hacerla visible, que tambien tiene el suyo.
      - herramienta: crear_ticket_caso
        area: soporte_tecnico
        asunto: Red Visible
        prioridad: "2"
        condiciones:
          - herramienta: registrar_pedido_wifi
            campo: red_oculta
            valor: false
      # Sin traza de la herramienta (el cliente lo pidio y la conversacion se
      # corto antes de validarlo): entra igual, para que no se pierda.
      - herramienta: crear_ticket_caso
        area: soporte_tecnico
        asunto: Cambio De Contraseña En Router Wifi
        prioridad: "2"

    # Un reclamo formal tiene plazos legales: no puede entrar como uno mas.
    reclamo_formal:
      - herramienta: crear_ticket_caso
        area: cartera
        asunto: Pqr
        prioridad: "4"

    consulta_saldo:
      - herramienta: crear_ticket_caso
        area: cartera
        asunto: Asesoria Para Pago En Linea
        prioridad: "2"

    consulta_factura:
      - herramienta: crear_ticket_caso
        area: cartera
        asunto: Ajuste Factura
        prioridad: "2"

    # Llega aca solo si el dato del sistema no cuadra y alguien tiene que
    # mirarlo: el asistente resuelve solo la consulta normal.
    estado_servicio:
      - herramienta: crear_ticket_caso
        area: cartera
        asunto: Actualización De Datos
        prioridad: "2"

    # Lo que no encajo en ningun caso del manual. Va a soporte por ser la cola
    # general, y normal porque justamente no se sabe que es -- ponerle una
    # prioridad alta a algo sin clasificar desordena la cola de los que si se
    # sabe que urgen.
    otro:
      - herramienta: crear_ticket_caso
        area: soporte_tecnico
        asunto: Otros
        prioridad: "2"

  evidencia_suficiente:
    no_internet:
      - herramienta: diagnosticar_falla_ont
        campo: Last down cause_interpretado
        contiene: "sin señal optica"
      - herramienta: consultar_senal_ont
        campo: onu_signal_1490_veredicto
        contiene: "fuera de rango"

# -----------------------------------------------------------------------------
#  CONVERSACIONES  -  bandeja de chats con clientes finales (ver /conversaciones)
# -----------------------------------------------------------------------------
#  'etiquetas' es la taxonomia fija que nucleo/seguimiento/escalamiento.py le
#  ofrece al modelo (via function-calling con enum) al escalar una
#  conversacion -- nunca elige una categoria fuera de esta lista. Punto de
#  partida, se ajusta con uso real.
conversaciones:
  etiquetas: [soporte_tecnico, facturacion, comercial, queja]

# -----------------------------------------------------------------------------
#  MANUAL  -  taxonomia fija de casos para marcar respuestas buenas (ver
#  /manual y /conversaciones). Punto de partida: lo que cliente_final ya
#  resuelve o deriva hoy segun su descripcion, mas los casos probados en
#  vivo. Se ajusta con uso real, igual que 'conversaciones.etiquetas'.
# -----------------------------------------------------------------------------
manual:
  casos:
    - no_internet
    - internet_lento
    - consulta_saldo
    - consulta_factura
    - estado_servicio
    - reconexion
    - cambio_wifi
    - reclamo_formal
    # Seccion 5.9 del manual. Piloto de agendamiento automatico de visita
    # tecnica (nucleo/seguimiento/agendamiento.py) -- ver
    # escalamiento.agendamiento_automatico mas abajo.
    - sin_senal_tv
    - otro

limites:
  max_conversaciones_dia: 500
  max_costo_usd_mes: 0.0    # modelo local: sin costo por token
  alerta_al_porcentaje: 80
  # Cubre depuracion, auditoria y analisis; mas alla es solo superficie de riesgo.
  retencion_conversaciones_dias: 365
  # Un dia sin escribir y la conversacion se cierra: la proxima vez empieza
  # limpia, con el resumen de la anterior como contexto. Sin esto, un cliente
  # que vuelve dias despues por otro tema se pega al mismo hilo -- paso con
  # una de 67 mensajes y 180 horas, y el asistente termino repitiendo
  # preguntas y afirmando mediciones de cuatro horas antes.
  horas_inactividad_cierra: 24
  # Mucho mas corta que la de arriba, a proposito: el texto es barato y util
  # para depurar; una foto pesa y puede mostrar la casa, la cedula o una cara.
  # La foto sirve para resolver el caso, y un caso vive dias.
  retencion_multimedia_dias: 30

evaluacion:
  minimo_acierto_pct: 90.0
  # CERO, no "bajo". gemma3:4b respondia bien e inventaba cliente, plan y
  # factura: un sistema con 92% de acierto que inventa el 3% es peligroso.
  maximo_invenciones: 0
  minimo_casos: 50
