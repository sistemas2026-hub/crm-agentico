    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key

  - nombre: registrar_pago
    tipo: http
    descripcion: >
      ACCION SENSIBLE. Registra un pago sobre una factura EXISTENTE
      (necesitas su id_factura). Si el colaborador menciona la forma de
      pago por nombre, resolvela primero con consultar_formas_pago -- no
      inventes el ID. 'accion' decide si ademas de registrar el pago se
      reactiva el servicio del cliente.
    solo_lectura: false
    requiere_confirmacion: true
    roles_permitidos: [facturacion]
    base_url: https://api.wisphub.io
    endpoint: /api/facturas/{id}/registrar-pago/
    metodo: POST
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key
    # Hallazgo 19/08/2026: esta herramienta NO declaraba 'filtros_verificados'
    # -- el modelo no tenia forma de decir a que factura se refiere.
    # 'url_de()' nunca podia resolver el marcador '{id}' del endpoint y la
    # llamada fallaba SIEMPRE con ErrorHerramientaHttp, silenciosamente
    # (nadie lo habia notado porque no hay caso dorado ni prueba en vivo
    # de esta herramienta hasta ahora).
    #
    # 'fecha_pago' la doc la marca opcional ("solo tiene efecto con un
    # permiso especial"), pero la API SI exige que el campo este presente
    # -- un pago real sin 'fecha_pago' dio 400 "Este campo es requerido".
    # Se calcula en codigo (fechas_automaticas: ahora mismo) en vez de
    # pedirsela al modelo: es el mismo dato de siempre ("ahora"), no una
    # decision real. Formato confirmado en vivo: 'YYYY-MM-DD HH:mm', DISTINTO
    # del que usan los tickets (DD/MM/AAAA) -- por eso existe
    # 'formato_fechas_automaticas' (antes una constante fija del motor).
    # 'total_cobrado' si se deja libre: la API la ignora salvo permiso
    # especial, y forzar un valor en codigo pisaria ese permiso si algun
    # dia esta clave lo tiene.
    requeridos: [id_factura, accion]
    fechas_automaticas:
      fecha_pago: 0
    formato_fechas_automaticas: "%Y-%m-%d %H:%M"
    filtros_verificados:
      id_factura:
        param: id
        tipo: id
      referencia:
        param: referencia
        tipo: texto
      total_cobrado:
        param: total_cobrado
        tipo: texto
      accion:
        param: accion
        tipo: enum
        valores: {solo_registrar_pago: 0, registrar_pago_y_activar_servicio: 1}
      forma_pago:
        param: forma_pago
        tipo: id

  - nombre: agregar_promesa_pago
    tipo: http
    descripcion: >
      Registra que un cliente prometio pagar una factura para cierta
      fecha limite. Necesitas el id_factura (de consultar_facturas o
      consultar_factura_detalle). Queda PENDIENTE de aprobacion humana
      -- decile al colaborador que todavia no se registro, alguien tiene
      que aprobarla.
    solo_lectura: false
    requiere_confirmacion: true
    aprobacion_humana: true
    roles_permitidos: [facturacion]
    base_url: https://api.wisphub.io
    endpoint: /api/promesa-pago/
    metodo: POST
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key
    plantilla_resumen: "Promesa de pago de la factura {id_factura} para el {fecha_limite}"
    campos_texto_libre: [comentarios]
    # Hallazgo 19/08/2026: la doc marca 'id_factura' como requerido, pero
    # el serializer NO lo valida -- un valor imposible (999999999) no
    # genero error junto a los demas campos vacios. Se fuerza igual via
    # 'requeridos': el motor no confia en que la API vaya a rechazar lo
    # que falte. La doc tambien trae el formato de 'fecha_limite' mal
    # (ejemplo '2022/08/26' con barras); la API real exige guiones
    # (YYYY-MM-DD), confirmado con un 400 real antes de acertar el
    # formato.
    requeridos: [id_factura, fecha_limite, accion]
    filtros_verificados:
      id_factura:
        param: id_factura
        tipo: id
      fecha_limite:
        param: fecha_limite
        tipo: texto
      comentarios:
        param: comentarios
        tipo: texto
      accion:
        param: accion
        tipo: enum
        valores: {registrar_promesa: 0, registrar_promesa_y_activar_servicio: 1}

  # --- BottleCRM (verificado en vivo, ver skill bottlecrm-api) ---------------

  - nombre: consultar_casos_bottlecrm
    tipo: http
    descripcion: >
      Casos/tickets registrados en BottleCRM. Se puede buscar por texto libre
      (nombre o descripcion del caso) o filtrar por estado.
    solo_lectura: true
    roles_permitidos: [soporte]
    # 'backend' y no 'localhost': el motor corre en su propio contenedor, asi
    # que localhost es EL MOTOR, no el CRM. Estuvo apuntando mal y la
    # herramienta fallaba con connection refused -- y es el unico modo que
    # tiene un colaborador de consultar sus casos desde el asistente. Las
    # otras tres herramientas del CRM ya usaban el nombre del servicio; esta
    # se quedo atras. Comprobado ejecutandola desde el contenedor.
    base_url: http://backend:8000
    endpoint: /api/cases/
    metodo: GET
    auth_ref: BOTTLECRM_API_TOKEN
    auth_esquema: Bearer
    # Verificados en vivo, agosto 2026 (ver skill bottlecrm-api): impossible
    # value = 0, valor real = cuenta esperada.
    filtros_verificados:
      buscar:
        param: search
        tipo: texto
        verificado_el: 2026-08-07
      estado:
        param: status
        tipo: enum
        valores: {nuevo: New, asignado: Assigned, pendiente: Pending, cerrado: Closed, rechazado: 
            Rejected, duplicado: Duplicate}
        verificado_el: 2026-08-07
    extraer_de: cases

  # --- agregados -------------------------------------------------------------

  - nombre: contar_clientes
    tipo: agregado
    entidad: clientes
    etiqueta: clientes
    descripcion: >
      Cuenta clientes por estado, plan, ciudad, localidad, router o tecnico
      (o el total sin filtro). El resultado ya viene calculado -- nunca sumes
      ni corrijas el numero que te llega.

      Si el colaborador pide explicitamente un archivo o reporte descargable
      ("mandame un excel", "quiero el reporte de morosos", "pasamelo en
      pdf"), pasa formato='excel' o formato='pdf' segun lo que haya pedido
      (si no aclaro el tipo de archivo, usa 'excel'): se genera un archivo
      real y queda adjunto a tu respuesta automaticamente, el colaborador lo
      ve en la misma conversacion. El resultado te trae 'archivo_id' -- es un
      identificador TECNICO, NUNCA lo escribas ni lo menciones en tu
      respuesta (no significa nada para una persona). Solo confirma que ya
      generaste el archivo, por ejemplo "Listo, te dejo el Excel con el
      detalle". Si solo pregunta un numero ("cuantos clientes activos hay"),
      no uses formato o dejalo en 'texto' -- redacta la respuesta como
      siempre, sin mencionar ningun archivo.

      Si el resultado trae 'error_archivo', el archivo NO se genero -- decile
      al colaborador que el reporte no se pudo generar en este momento, nunca
      afirmes que si se genero.
    solo_lectura: true
    exportable: true
    # 'ventas' tuvo acceso entre el 19 y el 20/08/2026 (chequeaba cobertura
    # con el filtro 'localidad' en vivo, una llamada por mensaje). Sacado:
    # agregaba 1-2s de latencia por turno y consultar_planes_venta ahora
    # resuelve cobertura Y planes sin red, leyendo el catalogo sincronizado
    # (ver incidente 20/08/2026, "doña manuela"). Sacar el rol del catalogo
    # -- no solo del prompt -- es lo que de verdad cierra la puerta: el
    # prompt es guia, nunca garantia (PRD 7.4).
    roles_permitidos: [soporte, facturacion, administracion]
    # Fuente del sync de localidades -> zona real (ver
    # nucleo/herramientas/localidades.py). Reusa esta misma declaracion de
    # base_url/endpoint/auth -- no llama a la API distinto, solo la
    # recorre entera en vez de contar con un filtro puntual.
    sincroniza_localidades: true
    base_url: https://api.wisphub.io
    endpoint: /api/clientes/
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key
    # Verificado: 4260+811+2093+88 = 7252 = total sin filtro. Cuadra exacto.
    filtros_verificados:
      estado:
        param: estado
        tipo: enum
        valores: {activo: 1, suspendido: 2, cancelado: 3, gratis: 4}
        verificado_el: 2026-07-29
      plan_internet: {param: plan_internet, tipo: id, verificado_el: 2026-07-29}
      ciudad: {param: ciudad, tipo: texto, verificado_el: 2026-07-29}
      localidad: {param: localidad, tipo: texto, verificado_el: 2026-07-29}
      # Hallados en el sondeo de agosto. 'router' es la via para agrupar por
      # zona geografica: en una red WISP el router ES la zona fisica.
      router: {param: router, tipo: id, verificado_el: 2026-08-04}
      tecnico: {param: tecnico, tipo: id, verificado_el: 2026-08-04}
    filtros_ignorados_por_api:
