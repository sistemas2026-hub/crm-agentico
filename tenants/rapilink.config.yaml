    auth_esquema: Api-Key
    plantilla_resumen: "Cambiar el ticket {id_ticket} a estado '{estado}'"
    # Confirmado en vivo (19/08/2026, ticket #90354): el PUT acepta solo
    # 'estado' sin exigir el resto del recurso -- no es REST estricto.
    requeridos: [id_ticket, estado]
    filtros_verificados:
      id_ticket:
        param: id_ticket
        tipo: id
      estado:
        param: estado
        tipo: enum
        valores: {nuevo: 1, en_progreso: 2, resuelto: 3, cerrado: 4}

