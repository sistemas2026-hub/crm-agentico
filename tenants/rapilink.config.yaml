  # --- escritura de tickets (18/08/2026) -- aprobacion_humana real -------
  # Endpoints verificados contra la documentacion oficial de WispHub
  # (pegada por el usuario), filtros de LECTURA ya verificados en vivo con
  # el metodo del valor imposible (mis_tickets, fecha_creacion_0/_1). Las
  # tres de ESCRITURA de abajo todavia no se probaron contra produccion --
  # quedan con aprobacion_humana=true a proposito: la primera vez que se
  # ejecuten de verdad va a ser desde /acciones/propuestas, con un ticket
  # de prueba, no en el primer intento a ciegas.
  - nombre: crear_ticket
    tipo: http
    descripcion: >
      Crea un ticket de soporte tecnico real en WispHub. Necesitas el
      id_servicio del cliente (si solo tenes la cedula, resolvela primero
      con consultar_cliente_por_cedula) y el 'asunto' TIENE que ser
      exactamente una de las opciones del enum -- nunca inventes un
      asunto que no este en la lista. Si no sabes el ID del tecnico,
      usa consultar_tecnicos primero. Queda PENDIENTE de aprobacion --
      decile al colaborador que todavia no se creo de verdad, alguien
      tiene que aprobarla desde la pantalla correspondiente.
    solo_lectura: false
    requiere_confirmacion: true
    aprobacion_humana: true
    roles_permitidos: [soporte]
    base_url: https://api.wisphub.io
    endpoint: /api/tickets/
    metodo: POST
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key
    plantilla_resumen: "Crear ticket '{asunto}' para el servicio {servicio} (prioridad {prioridad})"
    # 'estado' se fija en codigo -- todo ticket nuevo nace 'Nuevo' (1), no es
    # una decision del modelo. 'tecnico' SI es requerido por la API (probado
    # en vivo el 19/08/2026: un POST sin 'tecnico' ni 'estado' devuelve 400
    # "Este campo es requerido" para los dos -- la documentacion oficial no
    # los marcaba como obligatorios). Ver 'requeridos' abajo.
    argumentos_fijos:
      departamento: "Soporte Técnico"
      estado: 1
    espejar_campos:
      asunto: asuntos_default
      departamento: departamentos_default
    requeridos: [servicio, asunto, tecnico]
    filtros_verificados:
      servicio:
        param: servicio
        tipo: id
      tecnico:
        param: tecnico
        tipo: id
      descripcion:
        param: descripcion
        tipo: texto
      prioridad:
        param: prioridad
        tipo: enum
        valores: {baja: 1, normal: 2, alta: 3, muy_alta: 4}
      origen_reporte:
        param: origen_reporte
        tipo: enum
        valores:
          oficina: oficina
          portal_cliente: portal_cliente
          telefono: telefono
          presencial: presencial
          redes_sociales: redes_sociales
      asunto:
        param: asunto
        tipo: enum
        valores:
          "Internet Lento": "Internet Lento"
          "No Tiene Internet": "No Tiene Internet"
          "Antena Desalineada": "Antena Desalineada"
          "Antena Dañada": "Antena Dañada"
          "No Responde la Antena": "No Responde la Antena"
          "No Responde el Router Wifi": "No Responde el Router Wifi"
          "Router Wifi Reseteado(Valores de Fabrica)": "Router Wifi Reseteado(Valores de Fabrica)"
          "Cambio de Router Wifi": "Cambio de Router Wifi"
          "Cambio de Antena": "Cambio de Antena"
          "Cambio de Antena + Router Wifi": "Cambio de Antena + Router Wifi"
          "Cambio de Contraseña en Router Wifi": "Cambio de Contraseña en Router Wifi"
          "Cable UTP Dañado": "Cable UTP Dañado"
          "Internet Intermitente": "Internet Intermitente"
          "Cambio de Domicilio": "Cambio de Domicilio"
          "PoE Dañado": "PoE Dañado"
          "Reconexión": "Reconexión"
          "Recolección De Equipos": "Recolección De Equipos"
          "Conector Dañado": "Conector Dañado"
          "Cambio A Fibra Óptica": "Cambio A Fibra Óptica"
          "Cable Fibra Dañado": "Cable Fibra Dañado"
          "Jumper Dañado": "Jumper Dañado"
          "Antena valores De Fabrica": "Antena valores De Fabrica"
          "Cableado Para Modem Extra": "Cableado Para Modem Extra"
          "Eliminador Dañado": "Eliminador Dañado"
          "Cables Mal Colocados": "Cables Mal Colocados"
          "RJ45 Dañado": "RJ45 Dañado"
          "Alambres Rotos": "Alambres Rotos"
          "Cancelación": "Cancelación"
          "Desconexión": "Desconexión"
          "Troncal Dañado": "Troncal Dañado"
          "Caja Nap Dañada": "Caja Nap Dañada"

  - nombre: responder_ticket
    tipo: http
    descripcion: >
      Agrega una respuesta/nota a un ticket YA EXISTENTE en WispHub, con
      la opcion de reabrirlo. Necesitas el id_ticket (de consultar_ticket
      o de una creacion previa). Queda PENDIENTE de aprobacion, igual que
      crear_ticket.
    solo_lectura: false
    requiere_confirmacion: true
    aprobacion_humana: true
    roles_permitidos: [soporte]
    base_url: https://api.wisphub.io
    endpoint: /api/tickets/{id_ticket}/respuesta/
    metodo: POST
    auth_ref: WISPHUB_API_KEY
    auth_esquema: Api-Key
    plantilla_resumen: "Responder al ticket {id_ticket}: \"{respuesta}\""
    campos_texto_libre: [respuesta]
    # El nombre de quien la escribe se pega al final, en codigo. No lo redacta
    # el modelo: si lo hiciera podria poner otro nombre o saltearlo, y una
    # atribucion equivocada en algo que queda registrado es peor que no
    # firmar. El cliente no ve estos tickets, asi que la firma es interna.
    firmar_campo: respuesta
    # 'estado' y 'prioridad' confirmados requeridos en vivo (19/08/2026,
    # ticket real #90354): un POST solo con 'respuesta' devuelve 400
    # "Este campo es requerido" para 'ticket-estado' y 'ticket-prioridad'.
    requeridos: [id_ticket, respuesta, estado, prioridad]
    filtros_verificados:
      id_ticket:
        param: id_ticket
        tipo: id
      respuesta:
        param: respuesta
        tipo: texto
      reabrir_ticket:
        param: reabrir-ticket
        tipo: texto
      estado:
        param: ticket-estado
        tipo: enum
        valores: {nuevo: 1, en_progreso: 2, resuelto: 3, cerrado: 4}
      prioridad:
        param: ticket-prioridad
        tipo: enum
        valores: {baja: 1, normal: 2, alta: 3, muy_alta: 4}

  - nombre: actualizar_estado_ticket
    tipo: http
    descripcion: >
      Cambia el estado de un ticket YA EXISTENTE (ej. marcarlo Resuelto o
      Cerrado). Solo el estado -- para agregar una nota usa
      responder_ticket. Necesitas el id_ticket. Queda PENDIENTE de
